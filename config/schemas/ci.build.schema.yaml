apiVersion: cic/v1
kind: Schema
metadata:
  name: ci.build
  version: "1.0"
  description: |
    Input schema for the ci.build native module.
    Describes a make-based build invocation and the expected artifact path.
spec:
  type: object
  required:
    - artifact_output
  properties:
    build_target:
      type: string
      description: "Working directory for make (optional, defaults to current dir)"
    make_target:
      type: string
      description: "Make target to run (default: build)"
      default: "build"
    artifact_output:
      type: string
      description: "Path to the produced artifact file (required); its SHA-256 digest becomes the step output hash"
  additionalProperties: false