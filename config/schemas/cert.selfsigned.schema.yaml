apiVersion: cic/v1
kind: Schema
identity:
  kind: Schema
  namespace: cic
  version: "1.0"
config:
  name: cert.selfsigned
  description: |
    Input schema for the cert.selfsigned native module.
    Generates a self-signed ECDSA P-256 X.509 certificate.
    Required input: cn (string). Optional: dns_sans ([]string), validity_days (int, default 365).
