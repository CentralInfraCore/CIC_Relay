apiVersion: cic/v1
kind: Schema
identity:
  kind: Schema
  namespace: cic
  version: "1.0"
config:
  name: proof_artifact
  description: >
    Unified proof artifact schema for CIC-Relay.
    Every ProofTrace-based execution produces one artifact of this shape.
    The schema is the contract between runtime, Git state recorder, and verifier.
    Required fields: workflow_id, source_digest, chain_hash, steps, timestamp.
    Optional: pose_result (VERIFIED|DRIFT|SKIPPED), commit_record.
