description: |
  Leírja, hogyan rögzíti a séma-pipeline, hogy egy build melyik forrás-revízióból
  készült: commit rögzítése a kérésben, a provenance mezők útja a
  cic.pipeline.start-tól az assert és build lépéseken át a cic.artifact.sign-ig,
  a build_hash (tiszta tartalom-digest) és a verification_root (a manifest
  Merkle-gyökere, benne a forrás-provenance) különbsége, valamint az, hogyan
  jelzi a VerifyProofArtifact a horgonyozatlan láncot.
