description: >
  Defines the two-layer observability model for CIC Relay: the ProofTrace truth layer
  (deterministic, cryptographic) and the operational observability layer (LogRecord,
  TraceFrame, MetricPoint). Specifies the integrity model (hash-chained logs, signed
  metric artifacts), the ExecutionContext correlation struct, the policy layer, and the
  future OTel projection adapter. Establishes the strict separation between proof and
  observation concerns.