description: |
  Concept státuszú terv a #162 1. munkacsomagjához: általános modul-release rekord kibocsátó a base-repo wasm/main ágon, a cic-primitives envelope 3 szerződés megvalósításával (a WASM és a teljes leíró egy rekordban kötve, forrás-commit, artifact- és manifest-digestek, Vault-aláírás, CICSourceCA-ellenjegyzés, külön rekordfájl), a meglévő base-repo ágak felmérése, a producer-oldali bizonyítási terv a primitives referencia-verifier ellen, és a D4 felmérés arról, hogyan fejezhető ki az authorization policy a CertPattern-ből, nyitott pontokkal. Csak terv, kód nincs.
