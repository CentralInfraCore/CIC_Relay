description: |
  Ez a dokumentum a CIC Relay rendszer biztonsági és auditálási modelljét írja le.
  Részletezi a Git-alapú állapotrögzítést, a Vault-alapú titokkezelést, a logolási szinteket és a többrétegű (host/relay/modul) biztonsági szeparációt.
