description: |
  A WASM moduloknak kínált típusos git host modul capability-szerződése: milyen műveletek léteznek, hogyan deklarálja a modul a hatókörét az aláírt capability manifestben, hogyan kötődik az identitás és a grant az ellenőrzött artifacthoz és manifesthez, mit ellenőriz a relay minden híváskor, miért van visszavonva a push, és milyen operátori feltételezések érvényesek.
