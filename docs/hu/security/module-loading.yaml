description: |
  A WASM modulok betöltésének tanúsítványszabályai: mit ellenőriz a betöltő (tanúsítványlánc, WASM digest, és a #162 release-burok: CICMODENVv1 aláírás, module:sign jogosultság, nyers/futtatott WASM és teljes manifest digest, egyetlen beolvasás, trust_state authenticated/transitional/dev, capability-kötés (module_id, envelope_digest)), valamint mit tesz a relay a tanúsítvány nélküli modullal, az érvényes tanúsítvánnyal és az érvénytelen minden fajtájával prodban és devben, a csak dev-ben élő CIC_ALLOW_UNSIGNED_MODULES opt-in, amely kizárólag aláírásfájl nélküli modult enged (érvénytelen aláírást soha, és capability nélkül), valamint a betöltött modul számára elérhető, felsorolt host felület.
