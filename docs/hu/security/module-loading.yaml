description: |
  A WASM modulok betöltésének aláírási szabályai: mit tesz a relay az aláíratlan modullal, az érvényes aláírással és az érvénytelen aláírás minden fajtájával prodban és devben, a csak dev-ben élő CIC_ALLOW_UNSIGNED_MODULES opt-in, amely kizárólag aláírásfájl nélküli modult enged (érvénytelen aláírást soha, és capability nélkül), valamint a betöltött modul számára elérhető, felsorolt host felület.
