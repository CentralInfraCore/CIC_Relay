# Root Cargo workspace. Crates live next to the subsystem they belong to (the
# first is `connections/`); this manifest just ties them together so there is a
# single Cargo.lock and one target/ dir, regardless of where members grow.
[workspace]
resolver = "2"
members = [
    "connections",
    "vault-adapter",
    "module",
    "ffi",
]

# Shared metadata + lints applied to every workspace crate.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Deny-by-default lint posture, mirroring the Go/Python gates (clippy -D).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
# Deterministic, provenance-friendly release builds.
strip = true
lto = true
codegen-units = 1
panic = "abort"
