---
# Single source of truth for the dev/build stack. Previously split across
# docker-compose.yml (Python) and docker-compose.yaml (Go), both defining a
# service named `builder` with conflicting meaning — `docker compose` loaded
# only one file by default, so half the Makefile targets silently hit the wrong
# container. Services are now uniquely named (py-* / go-*) in one file.
#
# Image digests — pinned to linux/amd64 manifests for hermetic, reproducible builds.
# To re-pin: docker manifest inspect <image>:<tag> | jq '.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest'
# golang:1.25.12         linux/amd64  sha256:09c6d487ccb96cac78767ef217cef33d15e9ee8c7569edbc9a3b00e3aef505d5
# rust:1.96.1-bookworm   linux/amd64  sha256:d99f7b31f49909348dc59b51f3c95d1efded1701ffb222f095aaab7de3c4abd8
# nats:2.10.12           linux/amd64  sha256:dbab4c53c0de6b089ceb67849d41bdf54a0ad29e50f1105048fc5f19508db803
# natsio/nats-box:0.12.0 linux/amd64  sha256:1a2c9c9281add7b81ccc886f92d2bc7a247c3ddfd99ecfab51f86a883b38cf7d
x-golang-version: &golang_image golang:1.25.12@sha256:09c6d487ccb96cac78767ef217cef33d15e9ee8c7569edbc9a3b00e3aef505d5
x-rust-version: &rust_image rust:1.96.1-bookworm@sha256:d99f7b31f49909348dc59b51f3c95d1efded1701ffb222f095aaab7de3c4abd8
x-nats-version: &nats_image nats:2.10.12@sha256:dbab4c53c0de6b089ceb67849d41bdf54a0ad29e50f1105048fc5f19508db803
x-nats-box-version: &nats_box_image natsio/nats-box:0.12.0@sha256:1a2c9c9281add7b81ccc886f92d2bc7a247c3ddfd99ecfab51f86a883b38cf7d

services:
  # --- Python tooling (schema compiler, release, lint/type/test) ---------------

  # On-demand: (re)generate requirements.txt and populate the ./p_venv cache.
  # Profiled so it does not auto-start on `docker compose up -d`.
  py-setup:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["setup"]
    # Run as the current host user to avoid file permission issues on mounts.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/app
      - ./p_venv:/app/p_venv:rw
    command:
      - sh
      - -c
      - >-
        pip-compile --generate-hashes --cache-dir /app/.pip-cache
        -o requirements.txt requirements.in && pip install --no-cache-dir
        --require-hashes -r requirements.txt --target /app/p_venv

  # Long-running: `exec`ed into for Python compiler/validate/release + Python QA.
  py-builder:
    build:
      context: .
      dockerfile: Dockerfile
    # Named explicitly (like cic-go-builder / cic-rust-builder): the relay drives
    # this container with `docker exec <name> make <target>`, so a
    # compose-generated name would make CIC_SCHEMA_BUILDER_CONTAINER unpredictable.
    container_name: cic-py-builder
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # Mount the populated venv directory as a read-only cache
      - ./p_venv:/app/p_venv:ro
      # Mount the project root to access schemas and write to source
      - ./:/app:rw
      # Mount the host's Vault token file for scripts to use
      - "${XDG_RUNTIME_DIR}/vault/sign-token:/var/run/secrets/vault-token:ro"
      # Mount the host's Vault server CA certificate for TLS verification
      - "${XDG_RUNTIME_DIR}/vault/server.crt:/var/run/secrets/vault-ca.crt:ro"
    # Allows the container to reach the host machine (for Vault)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONPATH=/app:/app/p_venv   # Add /app to PYTHONPATH
      - VAULT_ADDR=https://host.docker.internal:18200
      - CIC_VAULT_TOKEN_FILE=/var/run/secrets/vault-token
      - CIC_VAULT_CA_FILE=/var/run/secrets/vault-ca.crt
    # Keep the container running in the background
    command: ["tail", "-f", "/dev/null"]

  # --- Go build/test toolchain -------------------------------------------------

  # Long-running: `exec`ed into for go build/test/vet (read-only source).
  go-builder:
    image: *golang_image
    container_name: cic-go-builder
    volumes:
      - ./:/git-source:ro
      - ~/tmp/cache/CIC-Relay/gomodcache:/go/pkg/mod
      - ~/tmp/cache/CIC-Relay/cache:/go/cache
      - ~/tmp/cache/CIC-Relay/go/bin:/go/bin
      - ./output:/output
      - ~/tmp/cache/CIC-Relay/build:/tmp
    environment:
      - GOMODCACHE=/go/pkg/mod
      - GOCACHE=/go/cache
    working_dir: /tmp
    stdin_open: true
    tty: true
    entrypoint: ["sh"]

  # Long-running: `exec`ed into for mutations of the source tree (go mod tidy,
  # symbolsgen, manifest) — read-write source.
  go-fixer:
    image: *golang_image
    container_name: cic-go-fixer
    volumes:
      - ./:/git-source:rw
      - ~/tmp/cache/CIC-Relay/gomodcache:/go/pkg/mod
      - ~/tmp/cache/CIC-Relay/cache:/go/cache
      - ~/tmp/cache/CIC-Relay/go/bin:/go/bin
      - ./output:/output
      - ~/tmp/cache/CIC-Relay/build:/tmp
    environment:
      - GOMODCACHE=/go/pkg/mod
      - GOCACHE=/go/cache
    working_dir: /tmp
    stdin_open: true
    tty: true
    entrypoint: ["sh"]

  # --- Rust build/lint/test toolchain ------------------------------------------

  # Long-running: `exec`ed into for cargo fmt/clippy/test/build. Source is
  # read-only; the target dir and cargo home (registry + installed tools like
  # cargo-deny) live in cache volumes. rustfmt/clippy are added on demand per
  # rust-toolchain.toml and persist for the container's life.
  rust-builder:
    image: *rust_image
    container_name: cic-rust-builder
    volumes:
      - ./:/git-source:ro
      - ~/tmp/cache/CIC-Relay/rust-cargo:/cargo
      - ~/tmp/cache/CIC-Relay/rust-target:/target
      # Shared with go-builder: staging point for the cic-ffi staticlib so the
      # Go cgo build can link it (features/feature-008/ffi-boundary.md, 2b).
      - ./output:/output
    environment:
      - CARGO_HOME=/cargo
      - CARGO_TARGET_DIR=/target
      - CARGO_TERM_COLOR=never
    working_dir: /git-source
    stdin_open: true
    tty: true
    entrypoint: ["sh"]

  # On-demand `go` runner for warming the module cache. Profiled (no auto-start).
  go-mod-cache-loader:
    image: *golang_image
    profiles: ["setup"]
    volumes:
      - ./:/go/src:rw
      - ~/tmp/cache/CIC-Relay/gomodcache:/go/pkg/mod
      - ~/tmp/cache/CIC-Relay/go/bin:/go/bin
    working_dir: /go/src
    entrypoint: ["go"]

  # --- Messaging ---------------------------------------------------------------

  nats:
    image: *nats_image
    container_name: nats-server
    ports:
      - "4222:4222"
    volumes:
      - ./nats-data:/data
    restart: unless-stopped

  # Interactive NATS box. Profiled (no auto-start).
  nats-cli:
    image: *nats_box_image
    container_name: nats-cli
    profiles: ["cli"]
    depends_on:
      - nats
    stdin_open: true
    tty: true
    entrypoint: ["sh"]
    environment:
      - NATS_URL=nats://nats:4222

  # --- Relay server ------------------------------------------------------------

  # The relay itself, as a CI executor. Profiled (no auto-start) so the existing
  # build/tooling stack is unaffected: `docker compose --profile relay up -d relay`.
  #
  # Everything here was previously a hand-assembled `docker run`. The non-obvious
  # parts are documented in docs/en/pipeline/relay-container.md; the short version:
  #   - the docker socket + CLI are needed because the pipeline's test/validate/
  #     release steps run `docker exec <builder_container> make <target>`
  #   - /build must be the SAME host path the builder container sees, or the
  #     builder cannot see the clone the relay just made
  #   - ProofTrace recording is silently disabled without VAULT_TOKEN, and the
  #     token must be authorised for CIC_VAULT_KEY (not merely valid)
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    image: cic-relay:dev
    container_name: cic-relay
    profiles: ["relay"]
    ports:
      - "${CIC_RELAY_PORT:-8080}:8080"
    # Vault usually runs on the host, which is not reachable as 127.0.0.1 from a
    # bridge network. Same pattern the py-builder service already uses.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Shared with the builder container: the relay clones here, the builder builds here.
      - ${CIC_BUILD_DIR:-./build}:/build
      # ProofTrace audit git repository.
      - ${CIC_AUDIT_DIR:-./relay-audit}:/var/lib/cic-relay
      # The pipeline drives the builder container through the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Anything the relay needs to read at runtime — most commonly the Vault CA
      # certificate that VAULT_CACERT points at.
      - ${CIC_SECRETS_DIR:-./relay-secrets}:/run/secrets/relay:ro
    environment:
      - CIC_SCHEMA_BUILD_DIR=/build
      - CIC_SCHEMA_BUILDER_CONTAINER=${CIC_BUILDER_CONTAINER:-cic-py-builder}
      # ProofTrace signing. Without VAULT_TOKEN the relay starts but logs
      # "ProofTrace recording disabled" and produces no signed trace.
      - VAULT_ADDR=${VAULT_ADDR:-}
      - VAULT_TOKEN=${VAULT_TOKEN:-}
      - VAULT_CACERT=${VAULT_CACERT:-}
      - CIC_VAULT_MOUNT=${CIC_VAULT_MOUNT:-transit}
      - CIC_VAULT_KEY=${CIC_VAULT_KEY:-}
      - CIC_TRUST_MODE=${CIC_TRUST_MODE:-dev}
    restart: unless-stopped
