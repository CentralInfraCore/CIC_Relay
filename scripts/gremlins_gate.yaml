---
module: gremlins_gate
description: 'Run gremlins on Go packages with a per-package ratchet threshold. A
  package that is not in .mutation-baseline.json must reach efficacy >= 90 and mutant
  coverage >= 90. A package that is listed (it was below 90 when the baseline was
  taken) must not get worse than its baseline minus the weight of one mutant, so quality
  can only go up. A new package is never listed, so it starts at 90. gremlins v0.6.0
  does not enforce thresholds given on the command line (measured: exit 0 at 70% with
  --threshold-efficacy 100), so the thresholds are written to a temporary --config
  file, and the numbers it prints are checked here as well. Output that cannot be
  parsed fails the package (fail-closed). All packages are run; the exit status is
  non-zero if any package failed. Traps closed here (all measured): (1) The Go test
  cache: gremlins derives the time limit of a mutant from the baseline test run; a
  cached baseline takes ~0 s and then nearly every mutant times out (core/nexus/git:
  13 killed / 7 lived on the first run, then 9 killed / 0 lived / 11 timed out, which
  reads as 100%). GOFLAGS gets -count=1. (2) Timeouts. A mutant that makes a test
  hang (a loop condition, pkg/merkle/merkle.go:64) times out, and as in mutation testing
  generally that is a detection: killed + timed out is what counts as detected. That
  sum is stable (core/nexus/iac: 117+1 or 110+8, always 118, only the split follows
  the load of the machine), so it is used. But a run in which the timeouts dominate
  (more than max(3, 20% of the mutants)) says nothing about the tests and is rejected
  as untrustworthy. gremlins itself leaves timed-out mutants out of its efficacy.
  (3) Parallelism: more workers than the machine can serve slow the tests down; the
  default is half of the CPUs. With --report FILE the verdict of every package is
  also written as a machine-readable report (gremlins-report/1: one row per package,
  with killed / lived / not covered / timed out counted on their own), so that scripts/quality_gate.py
  can check that the packages that were planned are exactly the packages that were
  measured. The thresholds are not affected. usage: gremlins_gate.py [--baseline FILE]
  [--workers N] [--report FILE --chunk N --plan-digest SHA256] PKG [PKG ...]'
