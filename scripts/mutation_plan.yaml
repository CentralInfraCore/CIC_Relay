---
module: mutation_plan
description: 'Plan the diff-mode mutation gate of a pull request. Discovers, from
  the files a pull request changes, what has to be mutated: * Go: every package of
  the root module that has non-test source and whose files changed. A changed or deleted
  test, and a changed testdata/fixture file, selects the package it tests: a test
  change can change the mutation result (a weaker test lets a mutant survive), so
  it is never treated as "nothing to mutate". Packages are discovered from the diff,
  never listed by hand, so new code is gated by default. * Rust: whether any Rust
  source or manifest changed. The mutants themselves are selected by `cargo mutants
  --in-diff` in the workflow, unless the plan escalates. Escalation to FULL (the diff
  cannot be proven to narrow the work safely): a change to the dependencies, the build
  or the mutation configuration, the gate logic itself, or a Rust test file, or a
  change that reaches a `#[cfg(test)]` region of a Rust file, plans every Go package
  (go_full) and/or every Rust mutant (rust_full). A deleted file is part of the change
  set (it is not silently dropped). The Go packages are spread over at most --go-max-jobs
  jobs (round-robin), so the wall time stays bounded while the code base grows. With
  --all the diff is ignored and everything at --head is planned (the weekly FULL and
  the first nightly, which has no earlier run to compare with). Output (GITHUB_OUTPUT,
  or stdout when it is unset): go       JSON list of {"id": n, "pkgs": "./a ./b"}   ("[]"
  when nothing to do) go_pkgs  the same packages as one space-separated line rust     "true"
  | "false" go_full  "true" when every Go package is planned because of an escalation
  (or --all) rust_full "true" when the Rust mutants are NOT narrowed by --in-diff
  full_reasons  the escalation reasons, "; "-separated ("" when none)'
tags:
- core
- loader
category: []
used_in: []
entrypoint: true
related_nodes: []
objects:
- name: changed_files
  kind: function
  decorators: []
  description: 'Every path the change touches: added, copied, modified, renamed AND
    deleted. Renames are reported as a delete plus an add (--no-renames), so the old
    path is not lost.'
  references: []
  calls:
  - out.splitlines
- name: GO_FULL_PATHS
  kind: const
  description: ''
  references: []
- name: RUST_FULL_BASENAMES
  kind: const
  description: ''
  references: []
- name: RUST_FULL_PREFIXES
  kind: const
  description: ''
  references: []
- name: GATE_LOGIC_PATHS
  kind: const
  description: ''
  references: []
- name: is_rust_test_file
  kind: function
  decorators: []
  description: A Rust file cargo-mutants never mutates, but whose change can change
    the result.
  references: []
  calls:
  - name.endswith
  - path.endswith
  - path.split
- name: full_reasons
  kind: function
  decorators: []
  description: '(go_full, rust_full, reasons): whether the change forces a non-narrowed
    plan.'
  references: []
  calls:
  - f.rsplit
  - f.startswith
  - reasons.append
- name: CFG_TEST
  kind: const
  description: ''
  references: []
- name: HUNK
  kind: const
  description: ''
  references: []
- name: first_cfg_test_line
  kind: function
  decorators: []
  description: The 1-based line of the first `#[cfg(test)]` in a Rust source, None
    if there is none.
  references: []
  calls:
  - CFG_TEST.match
  - text.splitlines
- name: git_show
  kind: function
  decorators: []
  description: The content of path at rev, or None when it does not exist there.
  references: []
  calls: []
- name: touches
  kind: function
  decorators: []
  description: Does a diff range (start, length; length 0 = a pure insertion/deletion
    after `start`) reach the test region that begins at line `first`?
  references: []
  calls: []
- name: cfg_test_changes
  kind: function
  decorators: []
  description: 'Modified Rust files whose diff reaches a `#[cfg(test)]` region. cargo-mutants
    never mutates test code, so `--in-diff` plans 0 mutants for such a change (measured:
    even removing an assertion in the test module of http-executor/src/lib.rs), although
    a weaker test can let a mutant survive. The test module sits after the attribute,
    so a changed line at or after the first `#[cfg(test)]` of the old or the new file
    is treated as a test change. This over-escalates for production code that follows
    such an attribute (safe), and does not escalate for a file that is new (nothing
    to compare with: its production lines are mutated by --in-diff).'
  references: []
  calls:
  - HUNK.match
  - diff.splitlines
  - f.endswith
  - hit.append
  - m.group
- name: nearest_go_mod_dir
  kind: function
  decorators: []
  description: The directory of the closest go.mod at or above path_dir ('' is the
    root).
  references: []
  calls:
  - d.rsplit
- name: go_source_dirs
  kind: function
  decorators: []
  description: Directories of the root module that hold non-test, non-testdata Go
    source at head.
  references: []
  calls:
  - dirs.add
  - f.endswith
  - f.rsplit
  - f.split
- name: go_packages
  kind: function
  decorators: []
  description: The packages to mutate for the changed files. A non-test .go file selects
    its own package. A `_test.go` file selects the package it tests, and a file under
    `testdata/` the package that owns the testdata (a test change is a change of the
    mutation result). A deleted file selects its package when the package still has
    source at head. source_dirs (from go_source_dirs) says which directories have
    non-test source; None means "assume every directory has".
  references: []
  calls:
  - f.endswith
  - f.rsplit
  - f.split
  - parts.index
  - pkgs.add
- name: load_costs
  kind: function
  decorators: []
  description: (seconds per package, default seconds) from a cost-hint file, None
    if absent.
  references: []
  calls:
  - doc.get
- name: chunk
  kind: function
  decorators: []
  description: 'Spread the packages over at most max_jobs jobs. Without cost hints:
    round-robin. With them: the most expensive package first, each into the least
    loaded job (so the heavy packages do not share a job). A wrong hint only makes
    the jobs uneven; every package is in exactly one job either way.'
  references: []
  calls:
  - per.get
- name: rust_changed
  kind: function
  decorators: []
  description: Whether any changed file is Rust source or a file that forces a full
    Rust mutation run.
  references: []
  calls:
  - f.endswith
  - f.rsplit
  - f.startswith
- name: main
  kind: function
  decorators: []
  description: Plan the gate for --base..--head (or everything at --head with --all)
    and write the plan as key=value lines to $GITHUB_OUTPUT, or to stdout outside
    GitHub Actions; the reasoning goes to stderr.
  references: []
  calls:
  - ap.add_argument
  - ap.error
  - ap.parse_args
  - fh.write
  - p.endswith
  - p.rsplit
  - reasons.append
  - result.items
