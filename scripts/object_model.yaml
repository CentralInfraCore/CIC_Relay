- name: verify_tools
  kind: function
  decorators: []
  description: 'Is every tool of the record the pinned one, and does the record declare
    every tool it must? Fail closed. UNUSABLE: the version is known but is not the
    pinned one. UNVERIFIABLE: the version cannot be established (missing, empty, `unknown`)
    or the tool is not pinned at all (an unknown tool decides nothing). Either verdict
    rejects the measurement. The versions are what the record DECLARES: that the declared
    tool really ran is provenance, not checked here. `pins` is the loaded `.measurement-tools.json`;
    the tools the record must declare are its `record_tools` (all pinned tools when
    absent).'
  references:
