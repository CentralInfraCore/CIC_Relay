---
module: object_model
description: 'Object-level measurement model (report-only): what check did each production
  object get? Global percentages say how much of a package ran. They do not say, per
  function or method, which coverage and which mutation verdicts it has, or that for
  some objects nothing can be said. This module builds that model and a canonical,
  digested evidence record of it, and a verifier that states what it proves and what
  it does not. Contracts (versioned; a change is a change of the gate logic, planned
  as such by mutation_plan.py) object-id/1         the key of an object (see go_object_id
  / rust_object_key) object-evidence/1   the record (build_record) and its three verification
  levels (verify_record) measurement-scope/1 which files are production, test, generated,
  experimental, measured apart Every evidence field of every object is exactly one
  of MEASURED         a measured value NOT_APPLICABLE   nothing to measure, for a
  stated reason UNVERIFIABLE     it cannot be established, with a coded reason: never
  a hidden success The coverage KIND is part of the data and is one of statement |
  line | region. There is no "branch": the stable toolchain gives none (measured:
  `cargo llvm-cov --branch` needs nightly), so nothing here may be called branch coverage.
  Attribution is never estimated. A Go cover block belongs to an object only if it
  lies completely inside that object''s span; a block that cuts an object, spans several,
  or lies in none is counted and makes the affected fields UNVERIFIABLE. No value
  is ever split proportionally. Verification levels (never merged into one "verified"):
  L1 INTEGRITY_OK       schema, digest, totals recount, enums: the record is internally
  consistent L2 BOUND_TO_INPUTS    the commit/tree and the input files are the ones
  the record names (NOT_CHECKED without them) L3 COMPLETE_FOR_SCOPE the object list
  is complete against an independent enumeration (PARTIAL where only a part can be
  shown) A digest does not prove where a measurement came from: that the tools really
  ran on that tree is not shown by any of the three levels.'
tags:
- core
- loader
- parser
