---
module: count_mutants
description: 'Count the mutants a listing command prints, failing closed. Usage: count_mutants.py
  -- cargo mutants --workspace --list [--in-diff FILE] The exit status of the listing
  command is checked BEFORE its output is counted: * the command fails (any non-zero
  status, or it cannot be started)  -> exit 1, nothing on stdout. A failed listing
  is never "zero mutants". * the command succeeds and prints nothing                          ->
  prints 0 (a valid, empty listing: the diff applies and holds no mutable code). *
  the command succeeds and prints N non-empty lines                -> prints N. stdout
  carries only the number, so `n=$(count_mutants.py -- ...)` is safe under `bash -e`:
  a failed listing fails the assignment and with it the step. The listing itself goes
  to --out (default: a temporary file that is removed) so that it can be kept as evidence.'
