- name: pin_reference
  kind: function
  decorators: []
  description: 'Resolve the reference pins of a job and write them (and the record)
    to `out_dir`. Fail closed. pull_request: the reference is the tip of the base
    branch (fetched now); `base_sha` (from the event) must be a commit of that branch,
    so a forged SHA is refused. The head pin file must exist; if it differs from the
    base''s, an approval bound to `head_sha` and the head pin digest is required,
    and then the head pin file is the reference (APPROVED_UPDATE), otherwise the job
    is refused (PIN_CHANGED_UNAPPROVED). push (any non-PR event): the reference is
    the tree itself (SELF_REFERENCE); said so in the record. bootstrap: only for the
    change that introduces this mechanism: the base must not have it yet.'
  references: []
  calls:
  - GateError
  - SHA_RE.match
  - _approvers
  - _digest
  - _git
  - _read_comments
  - app.get
  - out.mkdir
  - rec.update
