  description: 'The primary mutation score, caught / (caught + missed), as a state,
    never a bare number. {"state": "MEASURED", "value": 0..100, "caught": c, "evaluable":
    c + m} {"state": "NOT_APPLICABLE", "reason": ...}        nothing evaluable, for
    a stated reason {"state": "UNVERIFIABLE", "reason": "MEASUREMENT_MISSING"}   no
    accounting at all A zero denominator is neither 100% nor 0%: with no mutant planned
    the score does not apply (NO_MUTANTS_PLANNED); with every mutant unviable (ALL_UNVIABLE)
    or only unviable and timed-out ones (NO_EVALUABLE_MUTANT) nothing could be evaluated.'
