---
module: quality_gate
description: 'Completeness validation of the mutation gates (fail-closed). What a
  green `cargo mutants --shard` or `gremlins` job proves is that the tool exited 0
  on the part it was given. It does not prove that every PLANNED mutant (or package)
  got exactly one interpretable verdict. This script closes that gap: the plan is
  recorded as a verifiable record, every shard/chunk hands in a report bound to that
  plan, and `verify` accepts the result only if the planned set and the measured set
  are the same. Commands plan-rust   list the Rust mutants (`cargo mutants --list
  --json ...`) and write the plan record; the listing exit status is part of the record
  plan-go     write the Go plan record from the planner''s package list wrap-shard  bind
  one `cargo mutants` outcomes.json to the plan (a shard report) verify      check
  plan + shard reports + chunk reports against each other check-coverprofile  a Go
  coverage profile must exist, parse and hold at least one block check-tools         every
  measuring tool a job uses must be the pinned one (fail closed) pin-reference       resolve
  the reference pins of a job: the base branch''s, not the pull request''s own (#195)
  Contracts (versioned; a change is a change of the gate logic and is planned as such
  by scripts/mutation_plan.py): mutation-plan/1      the plan record (this file, build_rust_plan
  / build_go_plan) mutant-id/1          the id of a Rust mutant is the `name` cargo-mutants
  prints for it ("file:line:col: replace f -> T with X"). The plan holds the ids sorted
  and duplicate-free, so the order of the listing and the shard layout do not matter;
  two different mutants never share an id (a listing with a duplicate id is an invalid
  plan, not a merged one). mutation-shard-report/1, gremlins-report/1   the reports
  of a shard / a chunk mutation-policy/2    how the verdicts are accounted and the
  primary score (see POLICY) Plan states (named in the output): PLAN_VALID_NONEMPTY  a
  valid plan with at least one mutant/package PLAN_VALID_EMPTY     PROVABLY valid
  and empty: the listing exited 0 and printed nothing (measured: cargo-mutants 27.1.0
  prints 0 bytes, not "[]", for a diff with no mutable code), or the planner reported
  nothing to do. The exit status and the digest of the output are in the same record.
  PLAN_INVALID         anything else: missing, unreadable, not matching its digest,
  wrong schema or contract, a failed listing. Always a failure.'
tags:
- core
- loader
