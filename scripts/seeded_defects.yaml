---
module: seeded_defects
description: 'Seeded defects: does the evidence verifier really turn red when it must?
  (CI self-test, PR-05) Every case DERIVES a defective bundle from an honest one,
  runs the REAL verifier (scripts/object_model.py, not a copy) and states which level
  must fail with which diagnostic code. Every negative case has a POSITIVE CONTROL:
  the honest bundle must reach the expected honest verdict, otherwise the case proves
  nothing (a verifier that fails everything would also "catch" every defect). A bundle
  is the honest record plus everything the verifier needs: the checkout, the input
  files, the re-derived values, the independent Go/Rust object sets, the required
  units, the cargo-mutants listing. The cases work on a deep copy; nothing outside
  the temporary directory is written and the product tree is not touched. Run:  seeded_defects.py
  --record R --root CHECKOUT --scope S --input NAME=PATH ... --rust-list L --expect-l3
  PARTIAL|COMPLETE_FOR_SCOPE (the record and the real input files of a real measurement;
  the tests build the bundle from the PR-04 fixtures) Exit: 0 only if every control
  is honest AND every defect is caught at the expected level with the expected code.'
tags:
- core
- executor
