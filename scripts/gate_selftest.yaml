---
module: gate_selftest
description: 'Self-test of the REAL quality gates (report-only): does the gate that
  guards the repository turn red when it must? PR-06 probes 1 and 2 of the #169 self-testing
  list: P1  a deliberately weakened test suite lowers the coverage and the coverage
  gate turns red (Go: the per-package threshold step of verify.yml; Rust: `cargo llvm-cov
  --fail-under-lines`) P2  a deliberately surviving mutant turns the mutation gate
  red (Go: scripts/gremlins_gate.py, the per-package ratchet; Rust: `cargo mutants
  --in-diff`, as the PR gate runs it) What makes this more than a seeded exit code:
  - the gate is the REAL one. The Go coverage gate is the `run:` script of the workflow
  step, extracted from the workflow file and executed unchanged (its thresholds are
  the ones in the file; nothing here sets a threshold); the other three are the very
  commands of the workflows, run with the same tools. - every defect runs in an ISOLATED
  COPY of the checkout; the checkout itself is never written (its `git status` is
  recorded before and after). - every defect has a POSITIVE CONTROL next to it: the
  same gate on the unmodified copy (P1) or on the same planted code WITH an asserting
  test (P2) must be green, so a gate that is red for another reason is not counted.
  - the expected failure must be the right one (a marker in the gate''s own output),
  not just a non-zero exit. Not covered here: the plan/completeness aggregation of
  the PR workflow (mutation-pr.yml `gate`): the P2 Rust case runs the same `cargo
  mutants --in-diff` command as the shard job, not the whole pipeline. Said in the
  report. Usage: gate_selftest.py --src CHECKOUT [--work DIR] [--only go-cov,rust-cov,go-mut,rust-mut]'
tags:
- core
- executor
