  implements: []
  references: []
- name: egressPolicy
  kind: type
  description: egressPolicy is the ordered set of egress rules; the first match permits.
  references: []
- name: keyResolver
  kind: type
  description: keyResolver maps a manifest secret handle (e.g. "oci/prod") to a signer
    over the relay-provisioned Vault key behind it. The module never names key material;
    provisioning the OCI key into Vault is a separate operator flow (r3-plan.md).
  references: []
- name: validateGit
  kind: method
  receiver: capabilityManifest
  description: validateGit rejects a manifest whose git block is malformed or too
    loose to enforce. A rule that grants fetch or push without naming a remote, or
    clone, checkout or push without naming refs, would be unbounded, so it is an error
    at load, never a silent widening.
  references: []
