- name: gitOpSet
  kind: var
  description: gitOpSet is every git operation name a manifest rule or a module import
    may mention. "push" is in it so that it is recognised and refused with gitPushDisabled
    rather than reported as unknown.
  references: []
- name: gitPushDisabled
  kind: const
  description: 'gitPushDisabled is why git.push can not be granted. Pushing from a
    guest needs the exact source object, the exact remote identity, the exact destination
    ref and the destination''s expected previous state to be bound to one authorised
    decision; the git command line does not give that (it resolves refs by name on
    both ends, and a remote can show a different ref list to a reader than to a writer
    or hide that a ref is symbolic). Until a push primitive that does is designed
    and proven, the capability is withdrawn: no manifest can grant it, no module can
    import it, and the host function refuses at run time whatever the registry holds.
    ExecGitOps.Push stays, with its hardening, and is simply not reachable from a
    guest.'
  references: []
