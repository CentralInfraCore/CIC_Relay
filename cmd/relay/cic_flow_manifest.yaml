- name: capabilityManifest
  kind: struct
  description: 'capabilityManifest is a module''s declared reach — the `capability_manifest`
    block of its project.yaml. The module cannot widen it: it is part of the signed
    artifact and the host enforces exactly this.'
  implements: []
  references: []
- name: egressRule
  kind: struct
  description: egressRule is one permitted outbound reach. Host is an exact host or
    a leading "*." suffix glob. Empty Methods / Paths / Ports mean any-method / any-path
    / port 443.
  implements: []
  references: []
- name: secretRule
  kind: struct
  description: secretRule is one secret handle the module may operate on — never the
    value.
  implements: []
  references: []
- name: gitRule
  kind: struct
  description: 'gitRule is one permitted git reach: which registered repository, which
    operations on it, and for the operations that name something outside the repository
    (a remote, a ref, a clone source) exactly which ones. Nothing is implied: an operation
    that is not listed, a remote or ref that is not listed, or a repository that is
    not named is refused.'
  implements: []
  references: []
- name: moduleProject
  kind: struct
  description: moduleProject is the subset of a module's project.yaml the relay reads
