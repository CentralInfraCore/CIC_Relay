  - cabinet.ModuleProfileBinding
  - cabinet.ExecutedIdentityV2
  - cabinet.ProfileRefV2
  - cabinet.TrustStateAuthenticated
  calls: []
- name: newTraceSource
  kind: func
  description: newTraceSource builds the source. protected is the operator's protected-component
    set (the cabinet's own).
  references:
  - hostsign.Record
  calls: []
- name: ExecutedIdentity
  kind: method
  receiver: traceSource
  description: 'ExecutedIdentity implements cabinet.TraceV2Source. ok=false: the module
    was not admitted with a profile binding, or the artifact is not the admitted one:
    no executed identity may be claimed.'
  references:
  - cabinet.ModuleDescriptor
  - cabinet.ExecutedIdentityV2
  - cabinet.ModuleDescriptor.ID
  - cabinet.ModuleDescriptor.Checksum
  calls:
  - cabinet.ModuleDescriptor.Checksum
  - cabinet.ModuleDescriptor.ID
- name: recordDigest
  kind: func
  description: 'recordDigest is the digest of a small canonical record: a fixed header,
    then key=value lines in the given order.'
  references: []
  calls: []
- name: Authorization
  kind: method
  receiver: traceSource
  description: 'Authorization implements cabinet.TraceV2Source: a protected component
