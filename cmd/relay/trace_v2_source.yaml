    flushed: a recorder that attested before the write would be attesting a hope.'
  implements: []
  references: []
- name: newIdentityRegistry
  kind: func
  description: newIdentityRegistry returns an empty registry.
  references: []
  calls: []
- name: set
  kind: method
  receiver: identityRegistry
  description: set records the admission of moduleID; a reload replaces it.
  references:
  - cabinet.ExecutedIdentityV2
  calls:
  - Lock
  - Unlock
- name: forget
  kind: method
  receiver: identityRegistry
  description: forget drops a module's record (a reload that is not admitted with
    a profile must not leave the earlier one).
  references: []
  calls:
  - Lock
  - Unlock
- name: get
  kind: method
  receiver: identityRegistry
  description: get returns the record only if it belongs to exactly this artifact.
  references:
  - cabinet.ExecutedIdentityV2
  calls:
  - RLock
  - RUnlock
- name: sha256Of
  kind: func
  description: sha256Of is the sha256:<hex> form of the O-1 digests.
  references: []
  calls: []
- name: executedIdentityOf
  kind: func
  description: executedIdentityOf builds the admission record of a module from what
