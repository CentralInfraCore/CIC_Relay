  implements: []
  references: []
- name: traceSource
  kind: struct
  description: traceSource is the production cabinet.TraceV2Source (and StepScoper).
  implements: []
  references:
  - hostsign.Record
- name: recorderKey
  kind: struct
  description: 'recorderKey is the key a recorder attests persistence with. The attestation
