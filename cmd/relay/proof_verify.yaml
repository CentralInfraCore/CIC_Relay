- name: VerifyProofArtifact
  kind: func
  description: 'VerifyProofArtifact validates a ProofArtifact against the proof_artifact@1.0
    schema contract. Checks performed: 1. Required fields present (workflow_id, source_digest,
    chain_hash, steps, timestamp). 2. chain_hash recomputed and verified against the
    artifact''s declared value. 3. Per-step: name, module, input_hash, output_hash
    all non-empty. 4. pose_result value is one of: VERIFIED | DRIFT | SKIPPED (when
    present). 5. commit_record.id == chain_hash when commit_record is present.'
  references:
