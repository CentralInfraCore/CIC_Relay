- name: verifyCICFlowProvenance
  kind: func
  description: 'verifyCICFlowProvenance checks a module''s signing cert against the
    CICSourceCA provenance anchor (EKU=CodeSigning, CRL). It is the fail-closed gate
    for binding a cic-flow capability: no SourceCA loaded, or a cert that does not
    chain to it, means no capability. (Entitlement against CICLicenseCA is a separate
    axis; its per-module attestation format is pending — see r3-plan.md.)'
  references:
  - cabinet.VerifyCertificateChain
  - cabinet.VerifyOptions
  calls:
