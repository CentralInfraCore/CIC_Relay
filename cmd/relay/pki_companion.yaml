- name: loadProvenanceAnchors
  kind: func
  description: 'loadProvenanceAnchors loads the detached cic-flow anchors into pkiAssets:
    CICSourceCA from CIC_SOURCE_CA_BUNDLE (provenance) and CICLicenseCA from CIC_LICENSE_CA_BUNDLE
    (entitlement). Each is optional; a missing var leaves its anchor unloaded (fail-closed).
