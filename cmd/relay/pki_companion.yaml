- name: moduleSignAuthoritiesFile
  kind: struct
  description: 'moduleSignAuthoritiesFile is the wire form of the authority bindings:
    which signer keys (by key_id = sha256 of the DER SubjectPublicKeyInfo) hold which
    role. The only role the relay knows is module:sign.'
  implements: []
  references: []
- name: loadCompanionCAPool
  kind: func
  description: loadCompanionCAPool reads a detached PEM CA bundle into a cert pool.
  references: []
  calls:
