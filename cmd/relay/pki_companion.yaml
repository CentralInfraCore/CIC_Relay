- name: loadProvenanceAnchors
  kind: func
  description: 'loadProvenanceAnchors loads the detached cic-flow anchors into pkiAssets:
    CICSourceCA from CIC_SOURCE_CA_BUNDLE (provenance) and CICLicenseCA from CIC_LICENSE_CA_BUNDLE
    (entitlement). Each is optional; a missing var leaves its anchor unloaded (fail-closed).
    A configured-but-unreadable bundle is an error.'
  references:
  - logrus.Logger
  - logrus.Fields
  - logrus.Logger.WithFields
  - logrus.Logger.WithField
  calls:
  - Info
  - Warn
  - logrus.Logger.WithField
  - logrus.Logger.WithFields
- name: verifyCICFlowProvenance
  kind: func
  description: 'verifyCICFlowProvenance checks a module''s signing cert against the
    CICSourceCA provenance anchor (EKU=CodeSigning, CRL). It is the fail-closed gate
    for binding a cic-flow capability: no SourceCA loaded, or a cert that does not
    chain to it, means no capability. (Entitlement against CICLicenseCA is a separate
    axis; its per-module attestation format is pending — see r3-plan.md.)'
  references:
  - cabinet.VerifyCertificateChain
  - cabinet.VerifyOptions
  calls:
  - cabinet.VerifyCertificateChain
- name: parseModuleSignAuthorities
  kind: func
  description: 'parseModuleSignAuthorities decodes the authority bindings strictly.
    An unknown field, kind, version or role, a malformed or duplicated key_id is an
    error: a typo must not silently grant or drop an authority.'
  references: []
  calls:
  - Decode
  - DisallowUnknownFields
  - MatchString
- name: loadModuleSignAuthorities
  kind: func
  description: 'loadModuleSignAuthorities loads the pinned module-sign authority bindings
    from CIC_MODULE_SIGN_AUTHORITIES into pkiAssets. Unset: no signer is authorised,
    so no envelope is admitted (fail-closed). Set but unreadable or invalid: an error
    (start-up failure).'
  references:
  - logrus.Logger
  - logrus.Fields
  - logrus.Logger.WithField
  - logrus.Logger.WithFields
  calls:
  - Info
  - Warn
  - logrus.Logger.WithField
  - logrus.Logger.WithFields
- name: moduleSignAuthoritiesEnv
  kind: const
  description: 'moduleSignAuthoritiesEnv names the operator''s pinned authority bindings
    for module signing (#162 V2b): a detached companion, like the CICSourceCA bundle,
    so it is part of the operator''s trust domain and not of the binary.'
  references: []
