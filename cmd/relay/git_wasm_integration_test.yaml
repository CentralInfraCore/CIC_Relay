- name: TestGitGrant_PublishPairsTheManifestWithItsOwnArtifact
  kind: func
  description: 'Two manifests that differ in the repository they name, published concurrently
    each with its own artifact. An observer reads the registry the whole time: every
    state it ever sees pairs a manifest with the artifact that was published WITH
    it (or has no artifact at all, which is never usable), never the manifest of one
    call and the artifact of another.'
  references:
  - require.NoError
  - assert.Positive
  - assert.Zero
  calls:
  - RLock
  - RUnlock
  - assert.Positive
  - assert.Zero
  - require.NoError
- name: TestLoadModule_ConcurrentLoadsOfOneIDLeaveGrantAndArtifactTogether
  kind: func
  description: 'Concurrent loads of the same module ID with two different, verified
    artifacts: when they are done, the cabinet holds one artifact and the registry
    holds the grant that was published for THAT artifact. (Run with -race.) Loads
    are serialised, so there is no interleaving to get wrong.'
  references:
  - require.NoError
  - assert.Equal
  calls:
  - Checksum
  - GetModule
  - assert.Equal
  - require.NoError
- name: TestLoadModule_LoadsOfOneIDDoNotInterleave
  kind: func
  description: 'Loads of one module ID are serialised: while one load sits between
    publishing its grant and storing its artifact, another load of the same ID can
    not start. Deterministic: the first load is held at exactly that point and the
    second is given time to run; it must not.'
  references:
  - require.NoError
  - assert.Equal
  calls:
  - Checksum
  - GetModule
  - assert.Equal
  - require.NoError
