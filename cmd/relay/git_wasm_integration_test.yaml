- name: TestGitFromAStartSection_RunsUnderTheNewInstancesOwnIdentity
  kind: func
  description: 'F9: the start section runs inside InstantiateModule, before the host
    has a handle on the instance. It runs under the identity the manager created for
    THIS instance and THIS artifact: it can use a grant bound to that artifact, and
