- name: signedBytes
  kind: method
  receiver: moduleReleaseEnvelope
  description: 'signedBytes is the byte-exact CICMODENVv1 signed domain: the domain
    line, then the six fields in fixed order, LF terminated. The values are validated
    (validateEnvelopeForm) before this is called, so none contains a line break.'
  references: []
  calls: []
- name: sha256Ref
  kind: func
  description: sha256Ref returns "sha256:<lower hex>" of b.
  references: []
  calls: []
- name: parseEnvelope
  kind: func
  description: 'parseEnvelope decodes the envelope file strictly: one JSON object,
    no unknown field, no trailing data. The version is checked first (an unknown version
    is ENVELOPE_VERSION, not a form error), then the form of every field.'
  references: []
  calls:
  - Decode
  - DisallowUnknownFields
  - Token
- name: validateEnvelopeForm
  kind: func
  description: 'validateEnvelopeForm checks every field against the schema: kind,
    version, module_id form, the four digests in the sha256:<64 lower hex> form, and
    the algorithm allowlist.'
  references: []
  calls:
  - MatchString
- name: decodeSignatureFile
  kind: func
  description: decodeSignatureFile accepts exactly one line of RFC 4648 section 4
    standard base64 (padded, no whitespace) ended by one LF (ENV-02); anything else
    is SIG_ENCODING.
  references: []
  calls:
  - DecodeString
  - EncodeToString
  - Strict
- name: verifyEnvelope
  kind: func
  description: 'verifyEnvelope runs V1, V2, V4 (digests) and V5 of the contract in
    the reference order: version, form, algorithm against the key type, key_id against
    the SPKI, signature encoding, signature, raw wasm digest, executed wasm digest,
    manifest digest. It is pure: the signer authority (V2b), the certificate chain
    (V3) and buildHash are the loader''s.'
  references: []
  calls: []
- name: signerAuthorized
  kind: func
  description: signerAuthorized reports whether the operator's pinned authority bindings
    grant keyID the module:sign role. The key's presence in a certificate, even a
    verified one, is not an authority (V2b).
  references: []
  calls: []
- name: admitEnvelope
  kind: func
  description: 'admitEnvelope is the loader''s full envelope admission for a certificate-verified
    module: the pure envelope check (verifyEnvelope), then the signer authority from
    the operator''s pinned bindings (V2b), the module identity, and the equality chain
    sha256(raw) = envelope.wasm_sha256 = wasmDigest = metadata.buildHash (V4, verifyBuildHash).'
  references: []
  calls: []
- name: importsCICFlow
  kind: func
  description: importsCICFlow reports whether the release manifest declares a cic-flow
    import (V6).
  references: []
  calls: []
- name: readOptional
  kind: func
  description: readOptional reads one companion file; a missing file is (nil, nil),
    an unreadable one is an error.
  references: []
  calls: []
- name: signatureMaterialPresent
  kind: func
  description: signatureMaterialPresent reports whether an envelope or a .sig exists
    beside the module manifest.
  references: []
  calls: []
- name: requiresAuthentication
  kind: func
  description: 'requiresAuthentication reports whether the V6 rule applies: everywhere
    except an explicit dev trust mode.'
  references: []
  calls: []
- name: admitModuleArtifact
  kind: func
  description: 'admitModuleArtifact decides the trust state of a module whose signer
    certificate already verified against the trust store (V3, the #155 path). It is
    given the buffers loadModule read once: the manifest, the raw wasm and the executed
    wasm of the descriptor built from it. - envelope and .sig both present: V1-V5
    and V2b must all hold, else the module is rejected with the named code (a present
    signature always has to verify, in every mode). Then the CICSourceCA provenance
    decides between authenticated and transitional. - exactly one of them present:
    ENVELOPE_MISSING. - neither: transitional (the pre-#162 path). A module that is
    not authenticated never gets a capability; in prod one that imports cic-flow is
    rejected (V6, MODULE_REJECTED) instead of being loaded without its capability.'
  references:
  - logrus.Entry
  - logrus.Entry.WithError
  calls:
  - Warn
  - logrus.Entry.WithError
- name: envDigestRE
  kind: var
  description: 'envDigestRE is the digest form of the envelope: sha256: and 64 lowercase
    hex.'
  references: []
- name: envModuleIDRE
  kind: var
  description: 'envModuleIDRE is the module_id form: name@semver.'
  references: []
- name: codeEnvelopeMissing
