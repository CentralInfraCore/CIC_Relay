---
package: main
description: 'Command relay is the CIC relay (cic-relay): the HTTP control-plane server
  that hosts the Cabinet (schema, module and workflow stores plus the wazero WASM
  runtime) and runs workflows through it. At start-up it loads its configuration from
  the environment, bootstraps PKI trust (CIC_TRUST_MODE), registers the native modules,
  loads the embedded components and those installed under /etc/cic-relay/components.d,
  wires the "git" and "cic-flow" host modules with per-module capability grants taken
  from each verified module manifest, optionally starts the IaC operator, and serves
  the API on :8080 (routes and their protection: apiRoutes). Started with --mode=module-worker
  it instead runs the subprocess isolation worker loop on stdin/stdout.'
tags:
- core
- gateway
- interface
- metrics
category: []
used_in: []
entrypoint: true
related_nodes: []
