category: []
used_in: []
entrypoint: true
related_nodes: []
objects:
- name: config
  kind: struct
  description: config holds the application's configuration.
  implements: []
  references: []
- name: relayServer
  kind: struct
  description: relayServer holds the dependencies for our HTTP handlers.
  implements: []
  references:
  - cabinet.Cabinet
  - logrus.Logger
  - obs.TraceSink
  - obs.LogSink
  - obs.MetricSink
  - obs.Resource
- name: VaultSecrets
  kind: struct
  description: VaultSecrets holds Vault connection parameters loaded from the environment.
  implements: []
