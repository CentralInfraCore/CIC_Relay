- name: buildOperatorIfConfigured
  kind: func
  description: 'buildOperatorIfConfigured constructs and returns an Operator if CIC_INFRA_REPO_PATH
    is set. Returns nil if CIC_INFRA_REPO_PATH is not set (operator is optional).
    Calls logger.Fatal if CIC_INFRA_REPO_PATH is set but CIC_OPERATOR_SECRET is missing.
    The operator is fully wired: - IaCValidator → Cabinet.GetSchema (schema-bound
    resource validation) - CabinetActivator → Cabinet.Setx (execution bridge) - IaC
    graph loaded upfront for dependency gating (WithGraph)'
  references:
  - cabinet.Cabinet
