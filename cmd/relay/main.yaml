- name: BuildID
  kind: var
  description: BuildID identifies the build ("<version>-<commit>"); "dev" when not
    injected.
  references: []
- name: CommitHash
  kind: var
  description: CommitHash is the source commit; it is the SourceRef of the Merkle
    build context.
  references: []
- name: Timestamp
  kind: var
  description: Timestamp is the build time (UTC, RFC 3339); dev/debug builds only,
    not release builds.
  references: []
- name: SourceTreeHash
  kind: var
  description: SourceTreeHash is the digest of all tracked source files (tools/sourcehash,
    pkg/sourcedigest). It is the Merkle build context's SourceTreeDigest and the default
    SourceDigest of a /set request that names none; builds without it fall back to
    CommitHash there.
  references: []
- name: BuilderImageDigest
  kind: var
  description: BuilderImageDigest is the digest of the pinned builder image; it becomes
    the DockerImageChecksum of the Merkle build context.
