  - cabinet.NewMemSchemaStore
  - cabinet.NewMemWorkflowStore
  - cabinet.NewMemModuleStore
  - cabinet.WasmManagerConfig
  - schemacompile.ArtifactSigner
  - crypto.NewVaultCryptoService
  - git.NewRepoRegistry
  - git.NewExecGitOps
  - obs.NewLogrusSink
  - cabinet.WithObsSinks
  - cabinet.NewCabinetService
  - merkle.BuildContext
  - merkle.GoSumDigest
  - merkle.GoRuntimeDigest
  - obs.Resource
