objects:
- name: resolveTrustMode
  kind: func
  description: resolveTrustMode reads the CIC_TRUST_MODE environment variable and
    returns the trust mode (dev or prod). Missing or empty values default to "dev"
    with a warning log.
  references:
  - logrus.Logger
  - logrus.Fields
  - logrus.Logger.WithFields
  calls:
  - Warn
  - logrus.Logger.WithFields
- name: bootstrapPKI
  kind: func
  description: 'bootstrapPKI loads the CA trust store based on trustMode. dev → loads
    CICDeveloperCA + rootCA from embeddedPKI; TrustStoreLoaded=true prod → scaffold:
    CICPlatformCA not embedded; returns empty pool with WARN Any other value returns
    an error.'
  references:
  - logrus.Logger
  - logrus.Fields
  - logrus.Logger.WithFields
  calls:
  - AppendCertsFromPEM
  - Info
  - logrus.Logger.WithFields
