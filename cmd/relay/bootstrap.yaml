- name: loadEmbeddedComponents
  kind: func
  description: 'loadEmbeddedComponents loads schemas, workflows and modules from the
    embedded filesystems and registers them with the cabinet service. Embedded components
    are verified against the SAME trust context as installed ones (pkiAssets, the
    result of bootstrapTrust): being compiled into the binary grants no extra trust.
    Origin (the signer chain against the configured anchors), authenticity and the
    capability a module receives are decided by the same rules on both load paths.
    The loader used to build a second trust store from the embedded CAs, so in prod
    an embedded module was judged against the development CAs instead of the operator''s
    bundle.'
  references:
  - cabinet.Cabinet
  - logrus.Logger
  - logrus.Logger.Info
  calls:
  - logrus.Logger.Info
