- name: loadPKIAssets
  kind: func
  description: 'loadPKIAssets loads X.509 certificates and CRLs from a filesystem
    path and populates PKIAssets with root certificates, intermediates, and revocation
    lists. This is the lenient (dev) loader: every CRL still needs a valid signature
    from a CA certificate loaded here, and one that fails is never used, but an unparsable
    or stale CRL is only logged. The strict (prod) path is the CA bundle in bootstrapPKI.'
  references:
  - logrus.Logger
  - logrus.Fields
  - logrus.Logger.Debug
  - logrus.Logger.WithField
  - logrus.Logger.WithFields
