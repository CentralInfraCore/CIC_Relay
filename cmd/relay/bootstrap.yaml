- name: loadWorkflow
  kind: func
  description: Loads a Workflow YAML file from disk and registers it in the cabinet.
  references:
  - cabinet.Cabinet
  - cabinet.NewWorkflow
  - logrus.WithField
- name: loadModule
  kind: func
  description: Loads a WASM module binary from disk and registers it in the cabinet.
  references:
  - cabinet.Cabinet
  - logrus.Logger
  - logrus.Fields
  - cabinet.NewModuleDescriptor
  - logrus.WithField
- name: loadPKIAssets
  kind: func
  description: Loads PKI assets (root CAs, intermediates, CRLs) from a directory into
