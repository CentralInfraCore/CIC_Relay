objects:
- name: gitAuthorizer
  kind: interface
  description: gitAuthorizer decides whether the calling module may perform op. A
    nil authorizer denies everything.
  references:
  - cabinet.InstanceIdentity
  methods: []
- name: gitHostFn
  kind: type
  description: gitHostFn is the uniform host-function ABI of the git module.
  references:
  - api.Module
- name: makeGitHostSetupFn
  kind: func
  description: makeGitHostSetupFn returns a WasmManagerConfig.HostSetupFn that registers
    the typed git host module ("git") on the wazero runtime. WASM modules can import
    these functions to perform git operations through the relay's capability boundary
    — they never receive arbitrary exec access.
  references:
  - nexusgit.GitOps
  - wazero.Runtime
  calls: []
- name: authorized
  kind: func
  description: 'authorized wraps a git host function so that it runs only if the *calling
    instance* is permitted. The caller''s identity is the one the WasmManager attached
    to the call context when it created the instance (module ID, the artifact compiled
    for it, a per-instance serial). It is never read from the request, and a context
    without it is refused, so a call that does not come from a managed instance (a
    start section included: it runs under the same identity) can not borrow one. The
    instance name the runtime reports for the module must agree with the identity;
    a disagreement is refused as well.'
  references:
  - api.Module
  - cabinet.InstanceIdentityFrom
  - api.Module.Name
  calls:
  - Error
  - api.Module.Name
  - cabinet.InstanceIdentityFrom
- name: registerGitHostFunctions
  kind: func
  description: 'registerGitHostFunctions instantiates the "git" host module on the
    wazero runtime. Each exported function follows a uniform ABI: (reqPtr i32, reqLen
    i32, outPtr i32, outLen i32) -> i32 The caller passes a JSON-encoded request in
    WASM linear memory at (reqPtr, reqLen). The response JSON is written to (outPtr,
    outLen), and the return value is the number of bytes written, or -1 on error.'
  references:
  - wazero.Runtime
  - nexusgit.GitOps
  - wazero.Runtime.NewHostModuleBuilder
  calls:
  - Export
  - Instantiate
  - NewFunctionBuilder
  - WithFunc
  - WithParameterNames
  - WithResultNames
  - wazero.Runtime.NewHostModuleBuilder
