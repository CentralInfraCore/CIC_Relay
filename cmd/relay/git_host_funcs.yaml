objects:
- name: makeGitHostSetupFn
  kind: func
  description: makeGitHostSetupFn returns a WasmManagerConfig.HostSetupFn that registers
    the typed git host module ("git") on the wazero runtime. WASM modules can import
    these functions to perform git operations through the relay's capability boundary
    — they never receive arbitrary exec access.
  references:
  - nexusgit.GitOps
  - wazero.Runtime
- name: registerGitHostFunctions
  kind: func
  description: 'registerGitHostFunctions instantiates the "git" host module on r.
    Each function follows a uniform ABI: (reqPtr i32, reqLen i32, outPtr i32, outLen
    i32) -> i32 The caller passes a JSON-encoded request in WASM linear memory at
    (reqPtr, reqLen). The response JSON is written to (outPtr, outLen). The return
    value is the number of bytes written, or -1 on error.'
  references:
  - wazero.Runtime
  - nexusgit.GitOps
