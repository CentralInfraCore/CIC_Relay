objects:
- name: cicFlowRegistry
  kind: struct
  description: 'R3a live wiring (feature-011, r3-plan.md). The `cic-flow` host module
    is a single shared instance on the wazero runtime, but capabilities are per-module:
    each guest is instantiated `WithName(moduleID)` (core/cabinet/cicwasm.go), so
    a host function resolves the *calling* guest''s deps by `mod.Name()` from this
    registry. A module with no entry is denied — fail-closed. The registry is populated
    at module load (bootstrap.go `loadModule`) ONLY after the module''s provenance
    verified, so an untrusted module never gets a capability. (Today the gate is the
    existing dev cert-chain verify against the embedded CICDeveloperCA; R3b replaces
    it with CICSourceCA provenance + CICLicenseCA entitlement — see r3-plan.md.)'
  implements: []
  references: []
- name: gitGrant
  kind: struct
  description: 'gitGrant is a module''s verified git reach, bound to the exact artifact
    it was derived from: the wasm digest loadModule verified against the loaded bytes,
    and the digest of the manifest document it read. A grant is dropped whenever the
    module ID is loaded again (revokeModuleCapability), so it can never outlive the
    artifact it was granted for.'
  implements: []
  references: []
- name: gitAuthRequest
  kind: struct
  description: 'gitAuthRequest is the part of a git request the policy looks at. The
    module identity is NOT here: it comes from the runtime (the instance name), never
    from anything the guest sends.'
  implements: []
  references: []
- name: newCICFlowRegistry
  kind: func
  description: 'newCICFlowRegistry builds an empty registry. A nil doer defaults to
    the egress client (newEgressClient: no redirects, no proxy, timeouts, blocked
    address ranges); a nil resolve leaves every module''s signer nil (sign inert)
    until the OCI-key provisioning path wires a real resolver.'
  references: []
  calls: []
- name: lookup
  kind: method
  receiver: cicFlowRegistry
  description: lookup returns the deps bound for moduleID, or false if the module
    is not registered (→ the host function denies the call, fail-closed).
  references: []
  calls:
  - RLock
  - RUnlock
- name: registerVerified
  kind: method
  receiver: cicFlowRegistry
  description: registerVerified parses the module's signed project.yaml, checks its
    cic-flow imports against the declared manifest, binds per-module deps, and registers
    them under moduleID. It must be called only after the module's provenance has
    verified (the caller's fail-closed gate). - A module that does not import cic-flow
    registers nothing (returns nil). - A module that imports cic-flow but under-declares
    its manifest is rejected (error) — the load path surfaces this as a module-load
    failure.
  references: []
  calls: []
- name: publishVerified
  kind: method
  receiver: cicFlowRegistry
  description: publishVerified is registerVerified with the checksum of the artifact
    the cabinet is about to store for this module. The grant and the artifact it belongs
    to are published in ONE step under the registry lock, so there is no moment at
    which a grant exists without its artifact, or with an artifact that came from
    another load. A git grant published without an artifact ("") is never usable.
  references: []
  calls: []
- name: stageVerified
  kind: method
  receiver: cicFlowRegistry
  description: 'stageVerified is publishVerified for the loader: the grant is recorded
    with its artifact but is NOT yet active; commitGrant activates it once the module
    has been stored. Between the two nothing is authorised by it, and an instance
    created in that window carries no binding, so it stays unauthorised for good.'
  references: []
  calls: []
- name: commitGrant
  kind: method
  receiver: cicFlowRegistry
  description: commitGrant activates the staged grant of moduleID if, and only if,
    it is still the one staged for artifact. A stale or foreign commit does nothing.
  references: []
  calls:
  - Lock
  - Unlock
- name: bindingFor
  kind: method
  receiver: cicFlowRegistry
  description: 'bindingFor is WasmManagerConfig.InstanceBinding: the digest of the
    manifest of the active grant for moduleID, or "" if there is none. An instance
    carries it from the moment it is created, so a later reload with a different manifest
    does not widen (or narrow) what that already-running instance may do.'
  references: []
  calls:
  - RLock
  - RUnlock
- name: publish
  kind: method
  receiver: cicFlowRegistry
  description: ''
  references: []
  calls:
  - Lock
  - Unlock
- name: revoke
  kind: method
  receiver: cicFlowRegistry
  description: revoke drops every capability bound to moduleID. loadModule calls it
    before it examines a module, so a reload of the same ID (a different artifact,
    an unsigned one, one whose verification fails) never keeps the previous artifact's
    grants.
  references: []
  calls:
  - Lock
  - Unlock
- name: authorizeGit
  kind: method
  receiver: cicFlowRegistry
  description: 'authorizeGit decides whether the module (identified by the runtime-assigned
    instance name) may perform op on this request. No grant, an unlisted repository,
    operation, remote, ref or source: denied.'
  references:
  - cabinet.InstanceIdentity
  calls:
  - RLock
  - RUnlock
