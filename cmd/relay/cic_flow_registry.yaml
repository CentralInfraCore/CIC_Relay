objects:
- name: cicFlowRegistry
  kind: struct
  description: 'R3a live wiring (feature-011, r3-plan.md). The `cic-flow` host module
    is a single shared instance on the wazero runtime, but capabilities are per-module:
    each guest is instantiated `WithName(moduleID)` (core/cabinet/cicwasm.go), so
    a host function resolves the *calling* guest''s deps by `mod.Name()` from this
    registry. A module with no entry is denied — fail-closed. The registry is populated
    at module load (bootstrap.go `loadModule`) ONLY after the module''s provenance
    verified, so an untrusted module never gets a capability. (Today the gate is the
    existing dev cert-chain verify against the embedded CICDeveloperCA; R3b replaces
    it with CICSourceCA provenance + CICLicenseCA entitlement — see r3-plan.md.)'
  implements: []
  references: []
- name: flowGrant
  kind: struct
  description: flowGrant is a module's cic-flow deps, bound like a gitGrant to the
    artifact the cabinet stores and to the authenticated envelope identity (#162 V7,
    ENV-03). Only an active grant whose artifact and envelope digest are the calling
    instance's authorises anything.
  implements: []
  references: []
- name: gitGrant
  kind: struct
  description: 'gitGrant is a module''s verified git reach, bound to the exact artifact
    it was derived from: the wasm digest loadModule verified against the loaded bytes,
    and the digest of the manifest document it read. A grant is dropped whenever the
    module ID is loaded again (revokeModuleCapability), so it can never outlive the
    artifact it was granted for.'
  implements: []
  references: []
- name: gitAuthRequest
  kind: struct
  description: 'gitAuthRequest is the part of a git request the policy looks at. The
    module identity is NOT here: it comes from the runtime (the instance name), never
    from anything the guest sends.'
  implements: []
  references: []
- name: newCICFlowRegistry
  kind: func
  description: 'newCICFlowRegistry builds an empty registry. A nil doer defaults to
    the egress client (newEgressClient: no redirects, no proxy, timeouts, blocked
    address ranges); a nil resolve leaves every module''s signer nil (sign inert)
    until the OCI-key provisioning path wires a real resolver.'
  references: []
  calls: []
- name: lookupFor
  kind: method
  receiver: cicFlowRegistry
  description: 'lookupFor returns the cic-flow deps of the calling instance, or false
    (→ the host function denies the call, fail-closed). The identity comes from the
    runtime, never from the guest: the grant must be active and bound to exactly the
    artifact the instance was compiled from and the envelope identity it started under
    (#162 V7), so a reused module ID with another digest inherits nothing.'
  references:
  - cabinet.InstanceIdentity
  calls:
  - RLock
  - RUnlock
- name: stageVerified
  kind: method
  receiver: cicFlowRegistry
  description: 'stageVerified is the loader''s registerModuleCapability: the grant
    is recorded with its artifact and its authenticated envelope identity but is NOT
    yet active; commitGrant activates it once the module has been stored. Between
    the two nothing is authorised by it, and an instance created in that window carries
    no binding, so it stays unauthorised for good. The grant and the artifact it belongs
    to are published in ONE step under the registry lock.'
  references: []
  calls: []
- name: commitGrant
  kind: method
  receiver: cicFlowRegistry
  description: commitGrant activates the staged grant of moduleID if, and only if,
    it is still the one staged for artifact. A stale or foreign commit does nothing.
  references: []
  calls:
  - Lock
  - Unlock
- name: bindingFor
  kind: method
  receiver: cicFlowRegistry
  description: 'bindingFor is WasmManagerConfig.InstanceBinding: the authenticated
    envelope digest of the active grant for moduleID (#162 ENV-03; it covers the manifest
    digest), or "" if there is none. An instance carries it from the moment it is
    created, so a later reload with a different manifest or artifact does not widen
    (or narrow) what that already-running instance may do.'
  references: []
  calls:
  - RLock
  - RUnlock
- name: publish
  kind: method
  receiver: cicFlowRegistry
  description: publish is the body of stageVerified. It parses the module's project.yaml
    and returns nil without binding anything when the module neither imports cic-flow
    nor touches git. Otherwise it rejects imports the manifest does not declare, binds
    the cic-flow dependencies (egress, signer) and records the git grant — its rules,
    the manifest digest and artifact, active or staged — under the lock.
  references: []
  calls:
  - Lock
  - Unlock
- name: revoke
  kind: method
  receiver: cicFlowRegistry
  description: revoke drops every capability bound to moduleID. loadModule calls it
    before it examines a module, so a reload of the same ID (a different artifact,
    an unsigned one, one whose verification fails) never keeps the previous artifact's
    grants.
  references: []
  calls:
  - Lock
  - Unlock
- name: authorizeGit
  kind: method
  receiver: cicFlowRegistry
  description: 'authorizeGit decides whether the module (identified by the runtime-assigned
    instance name) may perform op on this request. No grant, an unlisted repository,
    operation, remote, ref or source: denied.'
  references:
  - cabinet.InstanceIdentity
  calls:
  - RLock
  - RUnlock
- name: gitRuleCovers
  kind: func
  description: 'gitRuleCovers reports whether rule, already matched on repository
    and op, also covers the names the request carries: status and commit need nothing
    more, fetch needs a listed remote, checkout a permitted ref, clone a listed source
    URL and a permitted branch. Any other op is not covered.'
  references: []
  calls: []
- name: containsExact
  kind: func
  description: containsExact reports whether list contains v, compared case-sensitively.
  references: []
  calls: []
- name: refAllowed
  kind: func
  description: 'refAllowed: exact name, or "prefix/*" matching one or more path segments
    below prefix.'
  references: []
  calls: []
- name: clipForError
  kind: func
  description: clipForError truncates a guest-supplied value to 48 bytes for an error
    message, so a module cannot flood the logs through it.
  references: []
  calls: []
- name: registerModuleCapability
  kind: var
  description: 'registerModuleCapability, if set, is called by the module-load path
    (`loadModule`) once a module is authenticated (#162: envelope, signer authority,
    digests and provenance verified), to bind its capability under its authenticated
    identity (moduleID, envelopeDigest). `main` wires it to a registry''s registerVerified;
    it stays nil in tests that do not exercise capability binding. A non-nil error
    rejects the module at load (fail-closed). It is set once at startup before any
    load.'
  references: []
- name: commitModuleCapability
  kind: var
  description: commitModuleCapability, if set, is called by loadModule once the module's
    artifact is stored in the cabinet, to activate the grant staged for it. Set once
    at startup.
  references: []
- name: revokeModuleCapability
  kind: var
  description: revokeModuleCapability, if set, is called by loadModule as soon as
    a module's ID is known, before the module is examined, to drop whatever an earlier
    load of the same ID was granted. A grant belongs to the artifact it was verified
    for, not to the name; a reload starts from nothing and is re-granted only if it
    verifies. Set once at startup, like registerModuleCapability.
  references: []
