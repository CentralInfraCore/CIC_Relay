- name: isolatedEgressClient
  kind: func
  description: 'isolatedEgressClient is newEgressClient(true) whose dialer refuses,
    and counts, every destination that is not a loopback IP literal. A test that puts
    an external host in a redirect (a cloud metadata address, a public name) then
    cannot touch real infrastructure if a regression starts following redirects: the
    dial is refused before any name is resolved or any packet is sent, and the returned
    counter, which must stay zero, shows that the follow-up request was attempted.'
  references:
  - require.True
  calls:
