  - o1verify.Persistence
  - attest.RecorderVerifier
  - attest.Material
  - o1verify.Verify
  - attest.SignResult
  - attest.VerifyResult
  - o1verify.VerdictVerified
  calls:
  - Bool
  - DecodeString
  - Encode
  - EncodeToString
  - Parse
  - Public
  - SetIndent
  - SetOutput
  - String
  - attest.RuntimeImplementationDigest
  - attest.SignResult
  - attest.VerifyResult
  - o1verify.InteractionsDigest
  - o1verify.Verify
  - trustbundle.Admit
- name: main
  kind: func
  description: main runs the command against the process streams.
  references: []
  calls: []
