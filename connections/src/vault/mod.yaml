- name: SealedSecret
  kind: struct
  visibility: pub
  description: 'A secret/token as returned by Vault, **sealed to the request''s public
    key**. The core invariant of feature-008: this type holds only ciphertext — the
    plaintext never exists here, and only the module holding the matching private
    key can open it (elsewhere, in the runtime). [`Debug`] and [`Display`] are redacted,
    so a sealed secret can never leak into logs or traces. The exposed [`ciphertext`](SealedSecret::ciphertext)
    is safe precisely because it is encrypted and cannot be opened here.'
  derives:
  - Clone
  - PartialEq
  - Eq
  implements:
  - std::fmt::Debug
  - std::fmt::Display
  references: []
