---
crate: connections
module: crate::vault
description: 'Vault Connection object model — the core "meaning" layer of feature-008''s
  capability-based secret flow. This module owns the *meaning* of a Vault connection,
  not its *access*: it carries no cryptography and talks to no Vault. Instead it models
  the flow as a typestate so the ordering is enforced at compile time — `request →
  countersign → initialize` — and it keeps secret material in an opaque, redaction-only
  [`SealedSecret`] that has no plaintext field and can never leak into logs. The layering
  (feature-008): **core owns meaning** (this module), **Vault lib owns access** (a
  separate driver), **adapter owns translation**, **runtime owns execution**.'
