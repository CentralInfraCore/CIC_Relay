---
crate: connections
module: crate::vault::port
description: 'Ports (traits) the core needs from the outside world for the secret
  flow, plus in-memory reference implementations and their contracts. Port-adapter
  (feature-008): the core declares *what* it needs; a driver (e.g. `vault-client-rs`
  via a future adapter) implements *how*. Nothing here performs cryptography or network
  I/O — the async Vault boundary is the adapter''s concern, so this layer stays synchronous,
  deterministic and dependency-free. The three ports mirror the three runtime bridges
  of the flow: - [`Countersigner`] — the Relay''s content-dependent authorization
  + notary. - [`TokenProvider`] — Vault cert-auth exchanging a Cert for a sealed token.
  - [`SecretBackend`] — the at-rest store of pubkey-sealed envelopes. [`establish`]
  composes the first two into the typestate [`Connection`] flow.'
