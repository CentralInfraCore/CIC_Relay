- name: establish
  kind: fn
  visibility: pub
  description: 'Drives the flow across the two outward ports: countersign the request
    with the Relay, exchange the resulting Cert for a sealed token at Vault, and return
    an initialized [`Connection`]. Models steps 3–7 of feature-008. # Errors [`EstablishError::Countersign`]
    if the Relay denies the scope; [`EstablishError::Token`] if Vault rejects the
    countersigned Cert.'
  references:
  - crate::vault::Connection
  - crate::vault::Initialized
  - crate::vault::Connection::request
  calls:
  - crate::vault::Connection::request
