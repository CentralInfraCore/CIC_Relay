[package]
name = "cic-ffi"
description = "The single unsafe airlock: C-ABI seam that links the safe Rust trust-flow crates into the Go relay. See features/feature-008/ffi-boundary.md."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# staticlib → C-linkable archive for cgo; rlib → normal Rust use + unit tests.
crate-type = ["staticlib", "rlib"]

# NOTE: this crate deliberately does NOT use `[lints] workspace = true`.
# The workspace forbids `unsafe_code`; this is the one crate where the FFI seam
# needs it. The posture below mirrors the workspace clippy denies, permits
# `unsafe` here only, and forces a `// SAFETY:` comment on every unsafe block.
# See features/feature-008/ffi-boundary.md.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[dependencies]
connections = { path = "../connections" }
module = { path = "../module" }
executor = { path = "../executor" }
# HTTP-only (default-features = false → no rustls/aws-lc), so the staticlib stays
# pure-Rust and links into the Go cgo build without dragging a C TLS library. The
# PoC actuates over loopback http; production egress uses the TLS-enabled crate.
http-executor = { path = "../http-executor", default-features = false }
serde_json = "1"
base64 = "0.22"
# A blocking bridge runs the async actuation to completion inside the sync airlock.
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
