---
crate: cic_ffi
module: crate
description: '# cic-ffi — the unsafe airlock The single crate in the workspace permitted
  to use `unsafe`. It is the C-ABI seam that links the safe Rust trust-flow crates
  (`connections`, `module`, `executor`, `http-executor`) into the Go relay. (`http-executor`
  is linked **without** its TLS feature, so the staticlib stays pure-Rust and the
  Go cgo build needs no C library.) Every export routes through one shared airlock
  ([`marshal`]) that fixes the three phases from `features/feature-008/ffi-boundary.md`:
  1. **INGRESS** (`unsafe`): copy the caller''s bytes into an *owned* Rust value.
  No borrow into caller memory escapes this phase. 2. **CORE** (safe): a plain `fn(&[u8])
  -> Option<Vec<u8>>` — no raw pointers, no `unsafe`, panic-contained via [`std::panic::catch_unwind`].
  `None` means "rejected" (validation failure), never a crash. 3. **EGRESS** (`unsafe`):
  hand an owned buffer back to the caller as `ptr` + `len`; the caller releases it
  via [`cic_ffi_free`]. `unsafe` therefore lives only in [`marshal`] and [`cic_ffi_free`],
  and only for pointer/length handling — never business logic. The trust-flow crates
  stay `unsafe_code = "forbid"`.'
tags:
- executor
- parser
category: []
used_in: []
entrypoint: false
related_nodes: []
objects:
- name: logic
  kind: mod
  visibility: private
  description: The safe core. Contains no `unsafe` and no raw pointers — every function
    here takes owned/borrowed-owned bytes and returns owned bytes, so it is ordinary,
    machine-checked safe Rust dispatching into the trust-flow crates.
- name: flow
  kind: mod
  visibility: private
  description: 'End-to-end trust-flow `PoC`, run entirely inside Rust and driven from
    Go: mint a module identity + CSR, mock-countersign it, seal a (mock Vault) secret
    to the module''s public key, open it *inside* the module, and actuate over HTTP
    with the opened credential. Mock trust backends (no live Vault); a real HTTP call.
    The point the seam demonstrates: Go hands in the request, Rust runs the whole
    pipeline, and only the HTTP **outcome** crosses back — the secret is sealed in
    transit and opened only inside the module, never leaving as data.'
- name: flow::live
  kind: mod
  visibility: private
  description: 'The live profile: the real Vault chain (countersign → mTLS cert-auth
    login → `read_sealed` → open) through `vault-adapter`/`module`, then the shared
    HTTP actuation. Compiled only with the `live-vault` feature (which drags in a
    TLS stack, so the staticlib is no longer pure-Rust). The secret is sealed to the
    module key and seeded into KV here — the request-time A-version wrap (M41.2) is
    a deferred edge.'
