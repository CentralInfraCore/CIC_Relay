- name: marshal
  kind: fn
  visibility: private
  description: 'The shared airlock. INGRESS (copy + own) → CORE (safe, panic-contained)
    → EGRESS (owned buffer to the caller). `core` is a safe function over owned bytes;
    `None` from it (or a panic, or empty output) yields a null return. # Safety `ptr`
    must point to `len` valid bytes (or be null with `len == 0`), and `out_len` must
    be a valid, writable `*mut usize` (or null).'
  references: []
  calls: []
- name: cic_ffi_free
  kind: fn
  visibility: pub
  description: 'Release a buffer previously returned by a `cic_ffi_*` allocating export.
    A null pointer or a zero length is a no-op, so it is always safe to call even
    when an export returned "nothing". # Safety `ptr` and `len` must be exactly the
    pair returned by a `cic_ffi_*` export, and this function must be called at most
    once for that pair.'
  references: []
  calls: []
- name: cic_ffi_ping
  kind: fn
  visibility: pub
  description: 'Echo `len` bytes from `ptr` back to the caller — the airlock linkability
    smoke test. Result must be released with [`cic_ffi_free`]. # Safety See [`marshal`].'
  references: []
  calls:
  - marshal
- name: cic_ffi_connection_request
  kind: fn
  visibility: pub
  description: 'Build a Vault Connection request and return its canonical JSON form
    — the first real trust-flow function bound through the seam. Input: a JSON `{"subject":
    "...", "scope": [...]}` document (`ptr`/`len`). Output: canonical JSON with a
    deduplicated, sorted scope, allocated for the caller to release with [`cic_ffi_free`].
    Returns null (and `*out_len == 0`) on malformed input, an empty subject, a null
    `out_len`, or a panic. # Safety See [`marshal`].'
  references: []
  calls:
  - marshal
- name: cic_ffi_run_flow
  kind: fn
  visibility: pub
  description: 'Run the end-to-end trust-flow `PoC` and return its JSON result. Input:
    a JSON request (`ptr`/`len`) — `subject`, `scope[]`, `secret`, `target`, `allow_hosts[]`,
    optional `method`/`headers`/`body_base64`/ `insecure`. Output: JSON `{"ok":true,"status":..,"body_base64":..,"scope":[..]}`
    on a completed actuation, or `{"ok":false,"error":".."}` if the flow ran but failed
    (policy/HTTP). Returns null (and `*out_len == 0`) only on malformed input, a null
    `out_len`, or a panic. Release the result with [`cic_ffi_free`]. # Safety See
    [`marshal`].'
  references: []
  calls:
  - marshal
- name: cic_ffi_abi_version
  kind: fn
  visibility: pub
  description: Returns the C-ABI version of this staticlib. The Go side checks it
    against its own expectation at startup to catch a stale or mismatched link. No
    pointers cross here, so it needs no airlock.
  references: []
  calls: []
