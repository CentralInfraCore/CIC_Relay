  - _dep_names
  - data.get
  - manifest.exists
  - manifest.read_text
  - rs_file.resolve
- name: _module_path
  kind: function
  decorators: []
  description: Module path of a file inside its crate target, `crate` excluded. src/lib.rs,
    src/main.rs, src/bin/x.rs, tests/x.rs, examples/x.rs, benches/x.rs and build.rs
    are target roots (`[]`); src/a/b.rs and src/a/b/mod.rs are `["a", "b"]`. `#[path]`
    attributes are not followed.
  references: []
  calls:
  - rs_file.resolve
- name: _normalize
  kind: function
  decorators: []
  description: 'Make self::/super:: paths absolute (crate::…); others are unchanged.'
  references: []
  calls:
  - base.pop
  - path.split
- name: _is_external
  kind: function
  decorators: []
  description: ''
  references: []
  calls: []
- name: _local_rest
  kind: function
  decorators: []
  description: 'If path points into this file (its module and the inline modules in
    it), the file-relative rest ("Foo::new", "tests::helper"); None otherwise. `module`
    is the file''s module path; `file_mods` are the out-of-line modules the file declares
    (`mod x;`): a path into one of those is cross-module.'
  references: []
  calls:
  - path.split
- name: _keep_ref
  kind: function
  decorators: []
  description: ''
  references: []
  calls:
  - _is_external
