  decorators: []
  description: ''
  references: []
  calls: []
- name: _dep_names
  kind: function
  decorators: []
  description: Local (in-code) names of every dependency table of a manifest.
  references: []
  calls:
  - manifest.get
  - n.replace
  - names.update
  - t.get
- name: _find_crate
  kind: function
  decorators: []
