- name: _merge_data
  kind: function
  decorators: []
  description: 'Merge freshly generated data into an existing YAML. Auto fields (always
    taken from source): crate, module, entrypoint and every structural object field
    (kind, visibility, receiver, trait, derives, implements, variants, methods, supertraits,
    references, calls, test). Description fields: the doc comment wins when there
    is one, otherwise the existing (hand-written) description is kept. Manual fields
    (never touched): tags, category, used_in, related_nodes. Objects are matched by
    (kind, receiver, name) — Rust methods share names across types (new, fmt, from)
    — new ones are added, vanished ones dropped.'
  references: []
  calls:
  - _obj_key
  - merged.get
  - new_data.get
  - obj.get
  - objects.append
  - old_by_key.get
  - old_data.get
  - old_obj.get
- name: _companions
