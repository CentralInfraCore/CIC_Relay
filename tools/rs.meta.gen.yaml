---
module: tools.rs.meta.gen
description: 'rs.meta.gen.py — Companion YAML skeleton generator for Rust source files.
  The Rust counterpart of go.meta.gen.py. Reads Rust through tools/rsastdump (a `syn`
  front end, workspace member) and writes a .yaml companion next to each .rs file
  following rs.meta.schema.yaml. Auto-filled fields: - crate, module, entrypoint -
  description: the file''s inner doc (//!) - objects: name, kind, visibility, receiver,
  trait, derives, implements, variants, methods, supertraits, references, calls, test
  - objects[].description: outer doc comments (///) - tags: suggested from file path,
  dependencies, and naming (review before use) Semantic fields left empty for human
  completion: - category, used_in, related_nodes References keep only paths into dependency
  crates (Cargo.toml) and into other modules of the same crate (crate::…); std/core/alloc
  and same-module paths are dropped. `implements` is recomputed on every run from
  the `impl Trait for Type` blocks of all companions of the crate, so it is an auto
  field, not a manual one. Usage: python tools/rs.meta.gen.py <file.rs> [<file.rs>
  ...] python tools/rs.meta.gen.py --dir <directory> [--recursive] [--merge] Options:
  --dir         Process all .rs files in directory (default: non-recursive; target/
  and testdata/ are never entered) --recursive   Recurse into subdirectories (use
  with --dir) --overwrite   Overwrite existing .yaml files (default: skip) --merge       Refresh
  auto fields, keep manual ones (see _merge_data) --skip-tests  Leave out #[cfg(test)]
  / #[test] items and tests/ files --dry-run     Print what would be generated without
  writing files Environment: RS_META_RSASTDUMP  Command that runs rsastdump (default:
  build it with `cargo build -p rsastdump --locked` in this workspace).'
tags:
- builder
- core
category: []
used_in: []
entrypoint: true
related_nodes: []
