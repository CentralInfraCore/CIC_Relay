---
package: main
description: 'Command statechain-demo is a live, self-contained demonstration of the
  feature-010 signed state chain (§8.1 + §8.5 of the demo plan): it records a few
  infrastructure-state transitions into a git repo, each committed with a Vault-Transit
  signature over a manifest that binds the parent commit, then verifies the whole
  chain — the signing key never leaves Vault. Finally it tampers a committed state
  and re-verifies, showing the chain is tamper-evident. It expects VAULT_ADDR / VAULT_TOKEN
  / VAULT_CACERT in the environment (set by scripts/statechain-demo.sh, which spins
  a throwaway dev-tls OpenBao with a Transit `ecdsa-p256` key). Run it via `make demo`.'
