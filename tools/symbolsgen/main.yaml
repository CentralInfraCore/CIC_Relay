description: 'Command symbolsgen writes the exported symbols (constants, variables,
  functions, types) of the packages listed in an allowlist file to a Markdown file.
  make symbols regenerates context/SYMBOLS.md with it; make check-symbols fails when
  the committed file has drifted. Usage: symbolsgen <allowlist_file> <output_file>'
