---
package: main
description: 'objinventory lists the top-level functions and methods of Go source
  files with their exact source spans, as JSON. It is the Go side of the object inventory
  of scripts/object_model.py (object-id/1): the Python side decides what an object
  is called and how coverage blocks are attributed, this tool only reports what the
  syntax tree says. Usage: objinventory <file.go> [<file.go> ...] Only the standard
  library is used and nothing is type checked. A function literal is not an object
  of its own: it belongs to the top-level declaration whose span contains it (the
  documented attribution rule), so only FuncDecl spans are listed.'
