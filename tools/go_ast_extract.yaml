---
module: tools.go_ast_extract
description: 'Go AST extractor — augments go.meta.gen.py with precise AST metadata.
  Extracts: - position (start_line, end_line) - signature (params, returns) for funcs/methods
  - calls (functions called within a func/method body) - fields (struct field names,
  types, tags) - methods (interface method signatures) - interfaces (interfaces implemented
  by a type — via Named.Interface pattern) - exported (whether the symbol is exported)
  Output is a JSON object suitable for merging into go.meta.gen.py object dicts.'
tags:
- builder
category: []
used_in: []
entrypoint: true
related_nodes: []
objects:
- name: extract_ast
  kind: function
  decorators: []
  description: 'Extract AST metadata from a Go source file. Returns {object_key: ObjectMeta,
    ...} where object_key is: - "FuncName" for functions - "TypeName" for types/structs/interfaces
    - "ReceiverType.MethodName" for methods (matched to go.meta.gen.py''s receiver
    field) Returns empty dict if file doesn''t exist or can''t be read.'
  references: []
  calls:
  - _extract_funcs
  - _extract_types
  - _make_key
  - func_info.get
  - go_file.read_text
  - source.split
- name: _make_key
  kind: function
  decorators: []
  description: Make a key for a function/method matching go.meta.gen.py's object_key
    format.
  references: []
  calls: []
- name: _extract_funcs
  kind: function
  decorators: []
  description: Extract all function and method declarations with positions and signatures.
  references: []
  calls:
  - _extract_calls
  - _parse_params
  - _parse_returns
  - funcs.append
  - m.end
  - m.groups
  - m.start
  - pattern.finditer
  - source.find
- name: _extract_types
  kind: function
  decorators: []
  description: Extract all type/struct/interface declarations.
  references: []
  calls:
  - _parse_interface_methods
  - _parse_struct_fields
  - iface_pattern.finditer
  - m.end
  - m.group
  - m.groups
  - m.start
  - struct_pattern.finditer
  - type_pattern.finditer
  - types.append
- name: _parse_params
  kind: function
  decorators: []
  description: 'Parse function parameters into [{''name'': ..., ''type'': ...}, ...]'
  references: []
  calls:
  - _split_params
  - m.group
  - params.append
  - params_str.strip
  - part.strip
- name: _parse_returns
  kind: function
  decorators: []
  description: Parse function return types into ['type1', 'type2', ...]
  references: []
  calls:
  - _split_params
  - m.group
  - part.strip
  - result.append
  - returns_str.endswith
  - returns_str.startswith
  - returns_str.strip
- name: _split_params
  kind: function
  decorators: []
  description: Split parameters by comma, respecting nested brackets/parens.
  references: []
  calls:
  - current.append
  - parts.append
- name: _extract_calls
  kind: function
  decorators: []
  description: Extract function calls from a function body.
  references: []
  calls:
  - calls.add
  - m.group
  - pattern.finditer
- name: _parse_struct_fields
  kind: function
  decorators: []
  description: Extract struct fields from struct body.
  references: []
  calls:
  - body.split
  - field_type.strip
  - fields.append
  - line.startswith
  - line.strip
  - m.group
  - name.strip
  - tag.strip
- name: _parse_interface_methods
  kind: function
  decorators: []
  description: Extract interface methods from interface body.
  references: []
  calls:
  - _split_params
  - body.split
  - line.startswith
  - line.strip
  - m.group
  - methods.append
  - p.strip
  - r.strip
