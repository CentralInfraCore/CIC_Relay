---
module: tools.go_ast_extract
description: 'Go AST extractor — augments go.meta.gen.py with precise AST metadata.
  Extracts: - position (start_line, end_line) - signature (params, returns) for funcs/methods
  - calls (functions called within a func/method body) - fields (struct field names,
  types, tags) - methods (interface method signatures) - interfaces (interfaces implemented
  by a type — via Named.Interface pattern) - exported (whether the symbol is exported)
  Output is a JSON object suitable for merging into go.meta.gen.py object dicts.'
tags:
- builder
category: []
used_in: []
entrypoint: true
related_nodes: []
objects:
- name: extract_ast
  kind: function
  decorators: []
  description: 'Extract AST metadata from a Go source file. Returns {object_key: ObjectMeta,
    ...} where object_key is: - "FuncName" for functions - "TypeName" for types/structs/interfaces
    - "ReceiverType.MethodName" for methods (matched to go.meta.gen.py''s receiver
    field) Returns empty dict if file doesn''t exist or can''t be read.'
  references: []
- name: _make_key
  kind: function
  decorators: []
  description: Make a key for a function/method matching go.meta.gen.py's object_key
