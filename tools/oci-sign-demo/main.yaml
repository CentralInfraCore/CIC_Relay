---
package: main
description: 'Command oci-sign-demo proves the feature-011 OCI *sign-then-send* signing
  profile end to end, with no relay, no Vault, and no cgo — the smallest thing that
  de-risks R2 (#88) before wiring the real capability. It builds the OCI draft-cavage
  HTTP-Signatures canonical string for a sample `PUT /vcns/{id}`, signs it RSA-SHA256
  (PKCS#1 v1.5) — the exact operation `cic-flow.sign` performs, here over an in-process
  RSA key that stands in for the scoped Vault Transit key (in production the key never
  leaves Vault) — assembles the `Authorization: Signature …` header, and actuates
  against a fake OCI endpoint that **verifies the signature against the RSA public
  key exactly as OCI would**. It then tampers the body and shows the endpoint reject
  it, so the signature demonstrably binds the request. This isolates the crypto profile
  (canonical header set + order, RSA-SHA256 PKCS#1 v1.5) — the highest-risk unknown
  — from the wazero plumbing (already unit-tested) and the Vault custody (already
  proven by `make demo-trustflow`). Run: `make demo-oci-sign` (opt-in, not a CI gate).'
