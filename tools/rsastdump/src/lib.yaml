---
crate: rsastdump
module: crate
description: 'rsastdump parses Rust source files with `syn` and reports their items
  as JSON. It is the syntactic front end of `tools/rs.meta.gen.py`, the Rust counterpart
  of `tools/goastdump`: the Python side decides what counts as an external reference
  and writes the companion YAML, this crate only reports what the syntax tree says.
  No name resolution or type checking happens, so it runs offline and without the
  dependencies of the code it reads. Paths are expanded through the `use` declarations
  in scope (`use serde::Serialize;` turns `Serialize` into `serde::Serialize`) and
  a path whose first segment is a module declared in the same scope gets a `self::`
  prefix; everything else is reported as written. A method call is attributed to a
  type only where the syntax states it (`self`, a typed parameter, `let x: T`, `let
  x = T { .. }`); untyped method calls are not reported at all.'
tags:
- parser
category: []
used_in: []
entrypoint: false
related_nodes: []
