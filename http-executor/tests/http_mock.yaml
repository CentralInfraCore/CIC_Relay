  server (`wiremock`), mirroring `vault-adapter/tests/live_mock.rs`. They drive the
  real `reqwest` transport end to end without a real upstream, and pin the two load-bearing
  guarantees: the opened credential is delivered as a Bearer `Authorization` header,
