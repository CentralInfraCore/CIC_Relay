---
crate: http_executor
module: crate
description: 'Live async HTTP adapter behind the [`executor`] port (feature-008; roadmap
  M43/M44 seeds). Mirrors how `vault-adapter` sits behind `connections`: the sync
  [`Executor`] *contract* in the `executor` core declares *what* an actuation is;
  this crate performs it *how* — over the network with `reqwest`, under a minimal
  egress policy and hard limits. The opened credential (a [`secrecy::SecretString`],
  as `module::open` yields) is applied as a Bearer `Authorization` header and is never
  logged. [`HttpExecutor::execute`] is the **live async counterpart** of the sync
  [`Executor::execute`] contract: a *reached* endpoint yields `Ok(`[`ExecOutcome`]`)`
  for any status; an [`ExecuteError`] means the target was malformed, the egress policy
  refused it, a limit was exceeded, or the endpoint was never reached. Security posture
  (see `features/feature-008/http-executor-hardening.md`): request/connect timeouts,
  a response-body size cap, ambient proxy env ignored (`no_proxy`), and an SSRF guard
  denying private/link-local/loopback ranges — both for IP-literal targets (at policy
  time) and for resolved hostnames (via a custom [`reqwest::dns::Resolve`] on the
  connect path). [`Executor`]: executor::Executor [`Executor::execute`]: executor::Executor::execute'
tags:
- executor
- interface
category: []
used_in: []
entrypoint: false
related_nodes: []
