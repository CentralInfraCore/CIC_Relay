  description: 'A minimal egress policy (roadmap M43 seed): allow only an explicit
    set of hosts, and — in production shape — only over `https`, with private/loopback/
    link-local IP ranges denied. Host matching is exact and case-insensitive; a trailing
    dot is normalized away. Wildcards are not supported (a deliberate M43 invariant).
    An IP literal is reachable only if named explicitly in the allowlist **and** outside
    the blocked ranges (unless [`insecure_allowing`](Self::insecure_allowing) permits
    private IPs for loopback testing).'
  derives:
  - Debug
  - Clone
  implements: []
  references:
