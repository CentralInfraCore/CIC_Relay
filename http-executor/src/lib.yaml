- name: AuditRecord
  kind: struct
  visibility: pub
  description: A structured, **non-secret** audit record for one actuation (roadmap
    M45 seed). It never carries the credential, the `Authorization` header, a Vault
    token, or any request/response body — only the facts needed to prove *what happened*.
    Bodies are recorded as SHA-256 hex digests, not contents, so the record is always
    safe to log or fold into a `ProofTrace`.
  derives:
  - Debug
  - Clone
  - PartialEq
  - Eq
  implements: []
  references:
  - executor::Method
- name: ChainedEntry
  kind: struct
  visibility: pub
  description: 'One entry in a **tamper-evident audit chain** (feature-009 seed):
    an [`AuditRecord`] bound to its position by `record_hash = SHA-256(domain ‖ prev_hash
    ‖ seq ‖ canonical(record))`. The hash **excludes itself and the signature** (self-excluding
    projection), so recomputation is well-defined. The per-type/topic dual chains
    of feature-009 are a separate follow-up.'
  derives:
  - Debug
  - Clone
  - PartialEq
  - Eq
  implements: []
  references: []
- name: LocalEcdsaSigner
