- name: execute
  kind: method
  receiver: HttpExecutor
  visibility: pub
  description: 'Performs `request` over the network, applying `secret` as a Bearer
    `Authorization` header. The live async counterpart of the [`Executor`] port contract.
    A reached endpoint yields `Ok(`[`ExecOutcome`]`)` for **any** status. Caller headers
    are sanitized: hop-by-hop, proxy-related and `Authorization` headers are stripped
    (the executor applies the credential itself), and a `Host` header that disagrees
    with the target is refused rather than allowed to silently redirect. # Errors
    [`ExecuteError::InvalidRequest`] if the target is malformed; [`ExecuteError::Denied`]
    if the egress policy refuses it (non-https, a host outside the allowlist, a blocked
    IP literal, a method outside the allowlist, or a mismatched `Host` header); [`ExecuteError::LimitExceeded`]
    if the request or response body exceeds its cap; [`ExecuteError::Unavailable`]
    if the endpoint is not reached (timeout, connect failure, blocked resolution)
    or its body cannot be read. No error carries the secret. [`Executor`]: executor::Executor'
  references:
  - executor::ExecRequest
  - secrecy::SecretString
  - executor::ExecOutcome
  - executor::ExecuteError
  calls:
  - HttpExecutor::execute_inner
  - build_audit_record
