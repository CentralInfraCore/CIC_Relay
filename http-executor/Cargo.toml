[package]
name = "http-executor"
description = "Live async HTTP adapter behind the `executor` port (feature-008, roadmap M43 seed): performs an actuation over HTTPS via reqwest under a minimal egress policy, applying the opened credential as a Bearer header. Mirrors how `vault-adapter` sits behind `connections`."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# TLS is on by default (production egress is https). It is a feature so a
# consumer that only needs plain-http actuation — notably the `cic-ffi`
# staticlib, where pulling rustls would drag the aws-lc C library into the Go
# cgo link — can opt out with `default-features = false` and stay pure-Rust.
default = ["rustls"]
# rustls only — no default-tls/native-tls, so no new C-toolchain or license load.
# The tree is already rustls via vault-client-rs → reqwest (0.13.4), whose `rustls`
# feature verifies roots via rustls-platform-verifier; keeping to it avoids churning
# the locked reqwest version.
rustls = ["reqwest/rustls"]

[dependencies]
executor = { path = "../executor" }
secrecy = "0.10"
url = "2"
# Body digests for audit records (permissive, pure-Rust — already in the tree).
sha2 = "0.10"
# ECDSA P-256 signing/verification for authenticated audit chains (feature-009);
# permissive, pure-Rust, already in the tree via module/vault-adapter.
p256 = { version = "0.13", features = ["ecdsa", "std"] }
# TLS backend is selected by this crate's `rustls` feature (see [features]).
reqwest = { version = "0.13", default-features = false }
# `rt` only — for `spawn_blocking` in the SSRF-guarding DNS resolver (getaddrinfo
# is blocking). Already in the tree via reqwest; this just declares direct use.
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
