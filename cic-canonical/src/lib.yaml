---
crate: cic_canonical
module: crate
description: 'CIC Canonical Object Encoding — number normalization (spec #1). The
  Rust peer of the Go implementation in `core/nexus/iac/number.go`. Both must produce
  byte-identical canonical forms so a digest computed in Go verifies in Rust and vice
  versa. The contract is defined over the JSON numeric *literal* (the text a number
  arrives as), which is the language-neutral surface: - `4`, `4.0`, `4e0` all canonicalize
  to `"4"`; - `-0`, `-0.0` canonicalize to `"0"`; - `4.50` canonicalizes to `"4.5"`;
  - integer literals keep full precision (string-based, no float round-trip), so an
  integer beyond `f64`''s 53-bit mantissa canonicalizes to its exact digits. The test
  vectors below mirror `TestCanonicalNumber` in `number_test.go`; that Go table is
  the source of truth.'
