- name: canonical_number
  kind: fn
  visibility: pub
  description: Returns the canonical decimal form of a JSON numeric literal, or `None`
    if `s` is not a number. Integer literals are normalized as exact digit strings
    (sign, leading zeros and negative zero folded); other numeric literals normalize
    through `f64`'s shortest plain-decimal form.
  references: []
  calls:
  - canonical_float
  - canonical_integer
- name: canonical_integer
  kind: fn
  visibility: private
  description: 'Normalizes an integer literal to exact digits, or `None` if `s` is
    not an integer literal. Mirrors Go''s `big.Int` path: strips a leading `+`, folds
    leading zeros, and renders negative zero as `"0"`.'
  references: []
  calls: []
- name: canonical_float
  kind: fn
  visibility: private
  description: Renders a float in plain (non-exponent) shortest form, folding negative
    zero to `"0"`. Rust's `f64` `Display` is shortest round-trip and never uses an
    exponent, matching Go's `FormatFloat(f, 'f', -1, 64)`.
  references: []
  calls: []
