name: mutation-pr

# Diff-mode mutation gate of a pull request.
#
# What is mutated is discovered from the diff, never listed by hand (scripts/mutation_plan.py):
#   Go:   every package of the root module whose non-test source changed, spread over at most
#         6 jobs (gremlins, per-package ratchet: >= 90%, or not worse than the recorded baseline).
#   Rust: only the lines the pull request changes (cargo mutants --in-diff), split over
#         a number of shards chosen from the number of mutants (about 40 per shard, at most 8).
# New code is therefore gated by default; nothing has to be added to a list.
#
# The single check `mutation-pr` (job `gate`) is the one to require: it fails if the plan or
# any mutation job failed or was cancelled, and passes only when everything it planned passed
# (or nothing needed mutating). The full mutation run stays in mutation.yml.
on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: mutation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.plan.outputs.go }}
      rust: ${{ steps.plan.outputs.rust }}
      rust_full: ${{ steps.plan.outputs.rust_full }}
      rust_shards: ${{ steps.count.outputs.shards }}
      rust_matrix: ${{ steps.count.outputs.matrix }}
      rust_plan_digest: ${{ steps.rustplan.outputs.digest }}
      go_plan_digest: ${{ steps.goplan.outputs.digest }}
      go_chunks: ${{ steps.goplan.outputs.chunks }}
    steps:
      - name: Checkout (full history for the diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Plan from the diff
        id: plan
        run: python3 scripts/mutation_plan.py --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        if: steps.plan.outputs.rust == 'true'
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-mutants
        if: steps.plan.outputs.rust == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Count the Rust mutants in the diff
        id: count
        env:
          RUST: ${{ steps.plan.outputs.rust }}
          RUST_FULL: ${{ steps.plan.outputs.rust_full }}
        run: |
          shards=0
          n=0
          if [ "$RUST" = "true" ]; then
            # The listing exit status is checked before the count (scripts/count_mutants.py): a
            # failed listing fails this step, it is never "zero mutants". A valid empty listing
            # prints 0. The plan can escalate to every mutant (rust_full); the shards below
            # must then not be narrowed by --in-diff either.
            if [ "$RUST_FULL" = "true" ]; then
              n=$(python3 scripts/count_mutants.py --out /tmp/mutants.list -- \
                    cargo mutants --workspace --list) \
                || { echo "::error::the Rust mutant listing failed"; exit 1; }
            else
              git diff "$BASE_SHA...$HEAD_SHA" -- '*.rs' > /tmp/pr.diff
              n=$(python3 scripts/count_mutants.py --out /tmp/mutants.list -- \
                    cargo mutants --workspace --list --in-diff /tmp/pr.diff) \
                || { echo "::error::the Rust mutant listing failed"; exit 1; }
            fi
            echo "rust mutants to test: $n (rust_full=$RUST_FULL)"
            if [ "$n" -gt 0 ]; then
              shards=$(( (n + 39) / 40 ))
              [ "$shards" -gt 8 ] && shards=8
            fi
          fi
          matrix=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$shards")
          echo "rust shards: $shards"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "n=$n" >> "$GITHUB_OUTPUT"

      # The plan, as a record the completeness check can verify (scripts/quality_gate.py): the
      # sorted mutant ids (mutant-id/1), the listing exit status and a digest. A plan that is
      # empty is empty with a reason (a successful listing that printed nothing, or the planner
      # saying there is nothing to do), never because a file is missing.
      - name: Record the Rust plan
        id: rustplan
        env:
          RUST: ${{ steps.plan.outputs.rust }}
          RUST_FULL: ${{ steps.plan.outputs.rust_full }}
          COUNTED: ${{ steps.count.outputs.n }}
        run: |
          set -e
          mkdir -p plan
          if [ "$RUST" != "true" ]; then
            python3 scripts/quality_gate.py plan-rust --out plan/rust-plan.json \
              --skipped "planner: no Rust file changed"
          elif [ "$RUST_FULL" = "true" ]; then
            python3 scripts/quality_gate.py plan-rust --out plan/rust-plan.json --mode full -- \
              cargo mutants --workspace --list --json
          else
            git diff "$BASE_SHA...$HEAD_SHA" -- '*.rs' > /tmp/pr.diff
            python3 scripts/quality_gate.py plan-rust --out plan/rust-plan.json --mode diff -- \
              cargo mutants --workspace --list --json --in-diff /tmp/pr.diff
          fi
          planned=$(python3 -c "import json; print(json.load(open('plan/rust-plan.json'))['count'])")
          [ "$planned" = "$COUNTED" ] \
            || { echo "::error::the plan record holds $planned mutants, the count step $COUNTED"; exit 1; }
          echo "digest=$(python3 -c "import json; print(json.load(open('plan/rust-plan.json'))['digest'])")" >> "$GITHUB_OUTPUT"

      - name: Record the Go plan
        id: goplan
        env:
          GO: ${{ steps.plan.outputs.go }}
          GO_PKGS: ${{ steps.plan.outputs.go_pkgs }}
          GO_FULL: ${{ steps.plan.outputs.go_full }}
        run: |
          set -e
          mkdir -p plan
          mode=diff
          [ "$GO_FULL" = "true" ] && mode=full
          python3 scripts/quality_gate.py plan-go --out plan/go-plan.json --mode "$mode" --pkgs "$GO_PKGS"
          echo "digest=$(python3 -c "import json; print(json.load(open('plan/go-plan.json'))['digest'])")" >> "$GITHUB_OUTPUT"
          echo "chunks=$(python3 -c "import json,sys; print(len(json.loads(sys.argv[1])))" "$GO")" >> "$GITHUB_OUTPUT"

      - name: Keep the plan
        uses: actions/upload-artifact@v4
        with:
          name: mutation-plan
          path: plan/
          if-no-files-found: error

  go:
    name: go (chunk ${{ matrix.chunk.id }})
    needs: plan
    if: ${{ needs.plan.outputs.go != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.go) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"

      - name: Go mod download
        run: go mod download || true

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      # Per-package ratchet (scripts/gremlins_gate.py, .mutation-baseline.json): a package
      # needs efficacy and mutant coverage >= 90, or, if it was below 90 when the baseline
      # was taken, must not get worse than that baseline. All packages are run and judged.
      - name: Mutation of the changed packages (ratchet)
        env:
          GOFLAGS: "-mod=readonly -trimpath"
        run: |
          python3 scripts/gremlins_gate.py \
            --report chunk-${{ matrix.chunk.id }}.json --chunk ${{ matrix.chunk.id }} \
            --plan-digest ${{ needs.plan.outputs.go_plan_digest }} \
            ${{ matrix.chunk.pkgs }}

      # The report is handed in even when the ratchet failed (the job stays red); a chunk that
      # produced no report is a missing chunk for the completeness check.
      - name: Hand in the chunk report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: go-chunk-${{ matrix.chunk.id }}
          path: chunk-${{ matrix.chunk.id }}.json
          if-no-files-found: warn

  rust:
    name: rust (shard ${{ matrix.shard }}/${{ needs.plan.outputs.rust_shards }})
    needs: plan
    if: ${{ needs.plan.outputs.rust_shards != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.rust_matrix) }}
    steps:
      - name: Checkout (full history for the diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Mutation of the changed Rust lines, or of every mutant when the plan escalated (no surviving mutants)
        env:
          RUST_FULL: ${{ needs.plan.outputs.rust_full }}
        run: |
          set -e
          if [ "$RUST_FULL" = "true" ]; then
            cargo mutants --workspace \
              --shard ${{ matrix.shard }}/${{ needs.plan.outputs.rust_shards }}
          else
            git diff "$BASE_SHA...$HEAD_SHA" -- '*.rs' > /tmp/pr.diff
            cargo mutants --workspace --in-diff /tmp/pr.diff \
              --shard ${{ matrix.shard }}/${{ needs.plan.outputs.rust_shards }}
          fi

      # The verdicts of this shard, bound to the plan. Handed in even when a mutant survived
      # (the job stays red); a shard without a report is a missing shard for the completeness check.
      - name: Bind the shard verdicts to the plan
        if: ${{ always() }}
        run: |
          python3 scripts/quality_gate.py wrap-shard \
            --plan-digest ${{ needs.plan.outputs.rust_plan_digest }} \
            --shard ${{ matrix.shard }} --shards ${{ needs.plan.outputs.rust_shards }} \
            --outcomes mutants.out/outcomes.json --out shard-${{ matrix.shard }}.json

      - name: Hand in the shard report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
          if-no-files-found: warn

  # Every planned mutant and package got exactly one verdict: the planned set and the measured
  # set are compared (scripts/quality_gate.py verify). A green job per shard is not that proof:
  # a shard that never ran, a duplicated or unknown verdict, or a plan that is missing or
  # does not match its digest all fail here. A skipped rust/go job is accepted only when the
  # plan says PLAN_VALID_EMPTY.
  completeness:
    needs: [plan, go, rust]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download the plan
        uses: actions/download-artifact@v4
        with:
          name: mutation-plan
          path: plan

      - name: Download the Rust shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: rust-shard-*
          merge-multiple: true
          path: reports/rust

      - name: Download the Go chunk reports
        uses: actions/download-artifact@v4
        with:
          pattern: go-chunk-*
          merge-multiple: true
          path: reports/go

      - name: Planned equals measured
        run: |
          python3 scripts/quality_gate.py verify \
            --rust-plan plan/rust-plan.json --rust-reports reports/rust \
            --rust-shards ${{ needs.plan.outputs.rust_shards }} \
            --go-plan plan/go-plan.json --go-reports reports/go \
            --go-chunks ${{ needs.plan.outputs.go_chunks }}

  # The ratchet baseline may only get stricter (scripts/baseline_guard.py). The guard and
  # the thresholds function it imports are taken from the BASE commit, so a pull request
  # cannot weaken the check it is judged by. (A change of this workflow file itself is
  # still run from the pull request's own version: a limit of pull_request workflows.)
  baseline-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: The baseline is not weaker than the base's
        run: |
          set -e
          mkdir -p /tmp/guard
          git show "$BASE_SHA:.mutation-baseline.json" > /tmp/guard/base.json
          if git cat-file -e "$BASE_SHA:scripts/baseline_guard.py" 2>/dev/null \
             && git cat-file -e "$BASE_SHA:scripts/gremlins_gate.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/baseline_guard.py" > /tmp/guard/baseline_guard.py
            git show "$BASE_SHA:scripts/gremlins_gate.py" > /tmp/guard/gremlins_gate.py
          else
            echo "::notice::the base has no baseline guard yet (the change that adds it): using this change's own"
            cp scripts/baseline_guard.py scripts/gremlins_gate.py /tmp/guard/
          fi
          python3 /tmp/guard/baseline_guard.py --base /tmp/guard/base.json --head .mutation-baseline.json

  gate:
    name: mutation-pr
    needs: [plan, go, rust, completeness, baseline-guard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Everything planned passed
        env:
          PLAN: ${{ needs.plan.result }}
          GO: ${{ needs.go.result }}
          RUST: ${{ needs.rust.result }}
          COMPLETENESS: ${{ needs.completeness.result }}
          GUARD: ${{ needs.baseline-guard.result }}
        run: |
          echo "plan=$PLAN go=$GO rust=$RUST completeness=$COMPLETENESS baseline-guard=$GUARD"
          [ "$PLAN" = "success" ] || { echo "::error::plan did not succeed"; exit 1; }
          [ "$COMPLETENESS" = "success" ] || { echo "::error::planned and measured mutants do not match"; exit 1; }
          [ "$GUARD" = "success" ] || { echo "::error::the baseline guard did not succeed"; exit 1; }
          for r in "$GO" "$RUST"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a mutation job ended as '$r'"; exit 1 ;;
            esac
          done
