name: renovate

on:
  schedule:
    - cron: "0 4 * * 1"  # every Monday 04:00 UTC
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Renovate
        uses: renovatebot/github-action@v46
        with:
          configurationFile: renovate.json
        env:
          # PAT required: GITHUB_TOKEN cannot trigger CI on created PRs (GitHub security limit)
          # Create a PAT with repo scope and add as repo secret RENOVATE_TOKEN
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
