name: verify

on:
  # `pull_request` already runs this full suite on every branch (it's the
  # merge gate); scoping `push` to `main` avoids running the identical jobs
  # twice for the same commit whenever a branch has an open PR (only
  # `coverage` differs between the two events — everything else was literally
  # duplicated work). Mutation runs in its own scheduled workflow.
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"

      - name: Go mod download (best-effort)
        run: |
          go mod download || true

      - name: gofmt check
        run: |
          set -euo pipefail
          M="$(git ls-files -z -- '*.go' | xargs -0 gofmt -s -l)"
          test -z "$M" || { printf '%s\n' "$M"; echo "Code not gofmt-formatted. Run make fmt"; exit 1; }

      - name: Go Vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.6.1

      - name: Staticcheck
        run: staticcheck ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Vulnerability scan
        run: govulncheck ./...

      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@v0.44.0

      - name: Dead code scan
        run: deadcode ./...

      - name: Check for symbol drift
        run: |
          go run ./tools/symbolsgen context/SYMBOLS.ALLOWPKGS context/SYMBOLS.md
          git diff --exit-code context/SYMBOLS.md

      - name: Build canonicalize (local, no Docker)
        run: |
          mkdir -p output/dev
          go build -trimpath -o output/dev/canonicalize ./tools/canonicalize

      - name: Golden verify
        run: |
          BINARY=./output/dev/canonicalize make verify

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"

      - name: Go mod download (best-effort)
        run: |
          go mod download || true

      # On pull_request, test the full module — this is the merge gate.
      # On push, scope to the packages affected by the changed files (the
      # changed packages plus everything that transitively imports them) so
      # incremental pushes get fast feedback without paying for a full run.
      - name: Determine test scope
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pkgs=./..." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git merge-base origin/main HEAD 2>/dev/null || true)
          fi
          if [ -z "$BASE" ]; then
            echo "pkgs=./..." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PKGS=$(git diff --name-only "$BASE" "${{ github.sha }}" -- '*.go' | go run ./tools/affected | tr '\n' ' ')
          echo "pkgs=${PKGS:-none}" >> "$GITHUB_OUTPUT"

      - name: Generate coverage report
        if: steps.scope.outputs.pkgs != 'none'
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out ${{ steps.scope.outputs.pkgs }}
          go tool cover -html=coverage.out -o coverage.html

      - name: No affected packages
        if: steps.scope.outputs.pkgs == 'none'
        run: echo "No Go packages affected by this push — skipping coverage run."

      - name: Per-package coverage thresholds
        if: steps.scope.outputs.pkgs != 'none'
        run: |
          set -euo pipefail
          FAIL=0
          for p in $(go list ${{ steps.scope.outputs.pkgs }} | grep -v /vendor/); do
            # Packages with no testable code
            case "$p" in
              */core/nexus/types) echo "$p: skip (types-only)"; continue ;;
              */embedded/pki)     echo "$p: skip (no test files)"; continue ;;
              */tools/sourcehash) echo "$p: skip (main entry only)"; continue ;;
              */tools/statechain-demo) echo "$p: skip (live demo entry; exercised by make demo)"; continue ;;
              */pkg/cicffi)       echo "$p: skip (cgo bridge; tested in the ffi job under -tags ffi_cgo)"; continue ;;
            esac
            go test -coverprofile=/tmp/pkg_cover.out "$p" > /dev/null 2>&1 || continue
            pc=$(go tool cover -func=/tmp/pkg_cover.out | awk 'END{gsub(/%/,""); print $3+0}')
            case "$p" in
              */cmd/relay)                   min=90  ;;
              */core/cabinet)                min=93  ;;
              */core/modules/certselfsigned) min=99  ;;
              */core/modules/cibuild)        min=94  ;;
              */core/modules/schemacompile)  min=90  ;;
              */core/modules/schemapipeline) min=90  ;;
              */core/nexus/crypto)           min=93  ;;
              */core/nexus/git)              min=92  ;;
              */core/nexus/iac)              min=90  ;;
              */core/nexus/isolation)        min=90  ;;
              */core/nexus/operator)         min=90  ;;
              */core/nexus/recorder)         min=85  ;;
              */core/nexus/sync)             min=88  ;;
              */pkg/canonicaljson)           min=96  ;;
              */pkg/merkle)                  min=97  ;;
              */pkg/obs)                     min=97  ;;
              */pkg/sourcedigest)            min=85  ;;
              */tools/canonicalize)          min=99  ;;
              */tools/certutils)             min=82  ;;
              */tools/symbolsgen)            min=90  ;;
              *)                             min=80  ;;
            esac
            echo "$p: ${pc}% (min ${min}%)"
            awk -v p="$pc" -v m="$min" 'BEGIN{ if (p+0 < m+0) { print "FAIL: coverage below threshold"; exit 1 } }' || FAIL=1
          done
          exit $FAIL

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html

  # NOTE: mutation testing (gremlins + cargo-mutants) moved to its own workflow
  # (.github/workflows/mutation.yml) — it runs daily on `main` and on demand
  # (workflow_dispatch), not on every PR, to conserve Actions minutes. Run it
  # locally before risky changes: `make mutate-all`, `make mutate-rust`.

  python:
    # Quality + test gate for the Python tooling (tools/, tests/). Mirrors the
    # checks run by `make infra.check` / `make test-py`, but natively (no Docker)
    # to match the Go jobs. Dependencies are installed hash-verified from the
    # pinned requirements.txt (pip --require-hashes).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (hash-verified)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Ruff (lint)
        run: python -m ruff check .

      - name: Black (format check)
        run: python -m black --check --exclude p_venv .

      - name: Isort (import order check)
        run: python -m isort --check-only --skip-glob "p_venv/*" .

      - name: MyPy (type check)
        run: python -m mypy --exclude p_venv .

      - name: yamllint
        run: python -m yamllint .

      - name: Bandit (security)
        # Fail only on medium+ severity; the tools/ dir's findings are all low
        # (asserts in tests, expected subprocess use to git/vault).
        run: python -m bandit -r tools --severity-level medium

      - name: Pytest
        run: python -m pytest

  rust:
    # Quality + test gate for the Rust workspace (Cargo.toml + connections/…).
    # Mirrors `make rust`: rustfmt, clippy (-D warnings), tests (--locked),
    # line-coverage floor (cargo-llvm-cov), and the cargo-deny supply-chain gate.
    # Toolchain is pinned by rust-toolchain.toml.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy llvm-tools-preview

      - name: rustfmt (format check)
        run: cargo fmt --all --check

      - name: Clippy (-D warnings)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test (locked)
        run: cargo test --all --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage (fail under 90% lines)
        run: cargo llvm-cov --all --locked --fail-under-lines 90

      - name: cargo-deny (advisories/licenses/bans/sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  ffi:
    # Live Rust↔Go FFI bridge gate: builds the cic-ffi staticlib and links it
    # into the Go cgo consumer (pkg/cicffi), exercising the real Go→Rust→Go
    # round-trip. This is the only job that runs the CGO_ENABLED=1 path — every
    # other build keeps the bridge tag-isolated (features/feature-008/ffi-boundary.md),
    # so a broken staticlib symbol or ABI drift cannot rot silently.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install

      - name: Build cic-ffi staticlib
        run: cargo build -p cic-ffi --release --locked

      - name: Test FFI bridge (cgo, ffi_cgo tag)
        run: |
          set -euo pipefail
          CGO_ENABLED=1 CGO_LDFLAGS="-L$PWD/target/release" \
            go test -tags ffi_cgo -count=1 -v ./pkg/cicffi/...
