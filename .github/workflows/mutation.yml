name: mutation

# The FULL mutation run, without history: every Go package of the root module (discovered,
# not listed, so new packages are included; scripts/gremlins_gate.py, per-package ratchet
# against .mutation-baseline.json) and the whole Rust workspace (cargo-mutants, no surviving
# mutant, four parallel shards).
#
# It runs weekly on Tuesday daytime and on demand (workflow_dispatch, and locally with
# `make mutate-all` / `make mutate-rust`). The incremental run since the last nightly is
# nightly.yml; the diff-mode gate of a pull request is mutation-pr.yml.
#
# A failed weekly run opens one issue (label weekly-failure) or comments on the open one;
# the next green week closes it (scripts/ci_report.sh).
#
# The Go and the Rust run are independent jobs and run in parallel: the wall time is that
# of the slower one (measured on 2026-11-09: Rust ~185 s sharded, all Go packages a few
# minutes), not their sum.
#
# NOTE: because this does not run on pull_request, it must not be a required status check.
on:
  schedule:
    - cron: "0 9 * * 2"   # Tuesday 09:00 UTC = 10:00 Europe/Budapest in winter (CET), 11:00 in summer
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Go mod download
        run: go mod download || true

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      - name: Plan - every Go package of the root module
        id: plan
        run: python3 scripts/mutation_plan.py --all --head HEAD --go-max-jobs 1

      - name: Mutation of every package (ratchet)
        env:
          GOFLAGS: "-mod=readonly -trimpath"
          PKGS: ${{ steps.plan.outputs.go_pkgs }}
        run: python3 scripts/gremlins_gate.py $PKGS

  # Rust mutation testing (cargo-mutants). Fails if any viable mutant survives.
  # The mutants are split over parallel shards (cargo-mutants --shard k/n, round-robin):
  # one 300-mutant run took ~430 s on a single job. Every shard builds its own baseline.
  mutation-rust:
    name: mutation-rust (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Mutation — Rust workspace, shard ${{ matrix.shard }}/4 (no surviving mutants)
        run: cargo mutants --workspace --shard ${{ matrix.shard }}/4

  report:
    needs: [mutation-go, mutation-rust]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (for the report script)
        uses: actions/checkout@v4

      - name: Report (open or update the issue on failure, close it on success)
        env:
          GH_TOKEN: ${{ github.token }}
          GO: ${{ needs.mutation-go.result }}
          RUST: ${{ needs.mutation-rust.result }}
          EVENT: ${{ github.event_name }}
        run: |
          # only the scheduled run reports; a manual run is looked at by the person who started it
          [ "$EVENT" = "schedule" ] || { echo "not a scheduled run: no report"; exit 0; }
          status=success
          for r in "$GO" "$RUST"; do
            case "$r" in failure|cancelled) status=failure ;; esac
          done
          bash scripts/ci_report.sh weekly-failure "Weekly mutation FULL failed" "$status" "go=$GO rust=$RUST"
