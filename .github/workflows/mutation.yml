name: mutation

# Mutation testing (gremlins for Go, cargo-mutants for Rust) is the slowest,
# most minute-hungry gate and rarely catches anything the unit/coverage gates
# miss on a per-commit basis. It is therefore NOT run on every push/PR, and NOT
# on a schedule either — it is run **manually on demand** (workflow_dispatch),
# and locally before risky changes (`make mutate-all`, `make mutate-rust`).
#
# The Go and the Rust mutation runs are independent jobs and run in parallel:
# the wall time is that of the slower one (measured on 2026-11-09: Rust 363 s,
# all Go packages together 152 s), not their sum (556 s as one job).
#
# NOTE: because this does not run on pull_request, remove `mutation` from the
# branch-protection *required status checks* for `main`, or PRs will wait on a
# check that never reports.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Go mod download
        run: go mod download || true

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      - name: Mutation — core/cabinet (efficacy ≥ 90%)
        run: |
          GOFLAGS="-mod=readonly -trimpath" gremlins unleash \
            --workers 4 --threshold-efficacy 90 \
            ./core/cabinet

      - name: Mutation — core/modules/schemapipeline (efficacy ≥ 90%)
        run: |
          GOFLAGS="-mod=readonly -trimpath" gremlins unleash \
            --workers 4 --threshold-efficacy 90 \
            ./core/modules/schemapipeline

      - name: Mutation — core/modules/schemacompile (efficacy ≥ 90%)
        run: |
          GOFLAGS="-mod=readonly -trimpath" gremlins unleash \
            --workers 4 --threshold-efficacy 90 \
            ./core/modules/schemacompile

      - name: Mutation — core/modules/httpcap (efficacy ≥ 90%)
        run: |
          GOFLAGS="-mod=readonly -trimpath" gremlins unleash \
            --workers 4 --threshold-efficacy 90 \
            ./core/modules/httpcap

      - name: Mutation — core/nexus/ois (efficacy ≥ 90%)
        run: |
          GOFLAGS="-mod=readonly -trimpath" gremlins unleash \
            --workers 4 --threshold-efficacy 90 \
            ./core/nexus/ois

  # Rust mutation testing (cargo-mutants). Fails if any viable mutant survives.
  # The mutants are split over parallel shards (cargo-mutants --shard k/n, round-robin):
  # one 300-mutant run took ~430 s on a single job. Every shard builds its own baseline.
  mutation-rust:
    name: mutation-rust (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Mutation — Rust workspace, shard ${{ matrix.shard }}/4 (no surviving mutants)
        run: cargo mutants --workspace --shard ${{ matrix.shard }}/4
