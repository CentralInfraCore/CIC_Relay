# pyproject.toml

[tool.mypy]
exclude = ['p_venv', 'source']
# Ignore missing stubs for libraries that don't have them
[[tool.mypy.overrides]]
module = [
    "jsonschema.*",
    "jsonref.*"
]
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ['py311']
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | p_venv
  | source
)/
'''

[tool.isort]
profile = "black"
skip_glob = ["p_venv/*", "source/*"]

[tool.ruff]
# `source` is a self-referential symlink (source -> .) accidentally emitted by the
# KB generator; excluding it (plus p_venv) keeps recursive runs from exploding.
extend-exclude = ["p_venv", "source"]
