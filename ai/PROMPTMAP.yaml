  - task: "polling-watcher-state-diff"
    status: done
    priority: 30
    milestone: M18
    prompt: |
      A `core/nexus/operator/watcher.go` `PollingWatcher.Watch()` metódusa jelenleg
      skeleton — a TODO komment szerint nincs state tracking, nem detektál változást.
      Implementáld a state diff logikát:
        1. Fájl snapshot struktúra: `map[string]string` (path → SHA256 content hash)
        2. `scanDir(rootPath string) (map[string]string, error)`: rekurzív directory scan,
           minden fájl content hash-e SHA256-tal számolva (a content-ből, nem a path-ból)
        3. Diff logika:
           - Első tick: minden fájl → CREATE esemény
           - Következő tickek: előző snapshot vs. aktuális →
             * Új fájl: CREATE
             * Megváltozott hash: UPDATE (content is bekerül az Event-be)
             * Eltűnt fájl: DELETE (Content = nil)
        4. `Event.Content`: fájl tartalma ([]byte) CREATE/UPDATE esetén; nil DELETE esetén
        5. A snapshot az előző tickről megmarad a goroutine-ban (state a goroutine-ban él)
      Ne változtass a `Watcher` interfészen és az `Event` struktúrán (backward-compatible).
      Tesztek: tmpdir + fájl create/update/delete → elvárt event szekvencia.
