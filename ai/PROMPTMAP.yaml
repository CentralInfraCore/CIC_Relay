version: 2
entries:
  # --- Megvalósított / referencia ---
  - task: "cabinet-canonicalize"
    status: done
    prompt: |
      Készíts determinisztikus, rendezett (canonical) JSON kimenetet a cabinet grafból a CONTRACT szerint.
      Ne legyen idő/locale/RNG mellékhatás. A GOLDEN inputokkal ellenőrizd.
    tests:
      - GOLDEN/cabinet_case01.in
      - GOLDEN/cabinet_case02.in
    accept: make verify

  # --- Következő lépések (prioritás szerint) ---

  - task: "fix-audit-placeholder-log"
    status: done
    priority: 1
    prompt: |
      A `cmd/relay/bootstrap.go` `loadModule` függvényében a PEM aláírás ellenőrzés
      placeholder ágán `"outcome": "success"` log jelenik meg, holott semmi nem lett ellenőrizve.
      Javítsd `"outcome": "skipped"`-re és adj hozzá `"reason": "trust ecosystem not bootstrapped"` mezőt.
      Ez nem feature — ez egy hazugság az audit trailben.
    tests:
      - cmd/relay/bootstrap_test.go
    accept: make test

  - task: "schema-validation-setx"
    status: done
    priority: 2
    prompt: |
      A `core/cabinet/service.go` `Setx` függvényében van egy TODO:
      "Implement schema validation here using moduleDesc.Accepts and inputData's schema ID."
      Implementáld: minden lépésnél ellenőrizd az inputData schema-megfelelőségét
      a moduleDesc.Accepts lista alapján. ErrInvalid-dal térj vissza ha nem egyezik.
      Ne változtasd meg a Cabinet interfészt.
    tests:
      - core/cabinet/service_unit_test.go
      - core/cabinet/service_integration_test.go
    accept: make test

  - task: "proof-trace-type"
    status: done
    priority: 3
    prompt: |
      Vezess be egy `ProofTrace` típust a `core/cabinet` csomagban.
      A ProofTrace rögzíti egy workflow végrehajtás teljes lenyomatát:
      workflow_id, lépésenkénti input_hash + output_hash, chain_hash (lépések hash-einek SHA256-a),
      timestamp (injektált, nem clock). Minden mező determinisztikus és kanonizálható.
      A `Setx` térjen vissza ProofTrace-szel is a SetResponse-ban.
      Nem kell Vault aláírás ebben a lépésben — csak a típus és a chain_hash számítás.
    tests:
      - core/cabinet/service_unit_test.go (új teszteset)
    accept: make test

  - task: "setx-recorder-wire"
    status: done
    priority: 4
    prompt: |
      Kösd össze a `Setx` végrehajtást a `core/nexus/recorder`-rel:
      minden sikeres workflow végrehajtás után a ProofTrace kerüljön be a recorder-be
      (expected state = workflow input, actual state = ProofTrace).
      A recorder Vault aláírást igényel — ha Vault nem elérhető, logolj WARN-t és folytasd.
      Failure ne legyen fatal a végrehajtásra nézve ebben a lépésben.
    tests:
      - core/nexus/recorder/recorder_test.go
    accept: make test

  - task: "execution-graph-linear"
    status: done
    priority: 5
    prompt: |
      Implementáld a `core/cabinet/graph.go`-t lineáris ExecutionGraph-ként.
      Egy ExecutionGraph lépések rendezett listája ahol minden lépés kimenetének
      saját neve van a kontextusban (nem mindent felülíró "result" kulcs).
      A lépés formátuma: `"component@version.function(inputKey) -> outputKey"`.
      A Setx parser ezt az új formátumot értelmezze.
      Visszafelé kompatibilis: a régi `"component.function(data)"` formátum is működjön.
    tests:
      - core/cabinet/graph_test.go
      - core/cabinet/service_unit_test.go
    accept: make test

  - task: "dev-vault-bootstrap"
    status: done
    priority: 6
    prompt: |
      Készíts egy `make dev-vault` Makefile targetet és egy hozzá tartozó szkriptet,
      ami a `tools/vault-sign-agent.sh` alapján elindít egy lokális, in-memory Vault-ot
      a fejlesztői környezethez. A target után `make verify` futtatható legyen
      Vault-függő tesztek nélkül is. Dokumentáld a `ai/SYSTEM_CONTEXT.md`-ben.
    tests:
      - scripts/
    accept: make dev-vault && make verify

  # --- Sprint 2 (done) ---

  - task: "prod-recorder-wiring"
    status: done
    priority: 7
    prompt: |
      Kösd be a `cabinetService.recorder`-t produkciós szinten a `cmd/relay/main.go`-ban.
      Adj hozzá `WithRecorder(r ExecutionRecorder) CabinetOption` funkcionális opciót
      a `core/cabinet/service.go`-ba (variadic, backward-compatible).
      A `main()` env változókból olvassa be a Vault konfigurációt
      (`VAULT_ADDR`, `VAULT_TOKEN`, `CIC_VAULT_MOUNT` default "transit",
      `CIC_VAULT_KEY` default "cic-dev-sign-key", `CIC_AUDIT_REPO_PATH` default "/var/lib/cic-relay/audit").
      Ha Vault nem konfigurált (VAULT_TOKEN hiányzik): WARN log + nil recorder (nem fatal).
      Ha Vault konfigurált: `VaultCryptoService` + `GitStateRecorder` + `WorkflowRecorder` összerakva,
      `NewCabinetService` hívása `cabinet.WithRecorder(wr)` opcióval.
      Ne változtasd meg a `Cabinet` interfészt.
    tests:
      - cmd/relay/main_test.go
    accept: make test

  # --- Sprint 3 (következő) ---

  - task: "env-cic-prefix"
    status: done
    priority: 8
    milestone: M8.1
    prompt: |
      A `cmd/relay/main.go` `loadConfig` és `buildRecorderOption` függvényekben
      minden env változót láss el `CIC_` prefixszel:
        MAX_JSON_INPUT_SIZE    → CIC_MAX_JSON_INPUT_SIZE
        MAX_WASM_MODULE_SIZE   → CIC_MAX_WASM_MODULE_SIZE
        HASHING_TIMEOUT        → CIC_HASHING_TIMEOUT
        CIC_VAULT_MOUNT, CIC_VAULT_KEY, CIC_AUDIT_REPO_PATH — már jók
        VAULT_ADDR, VAULT_TOKEN — Vault SDK saját változói, ezeket NE nevezd át
          (a Vault Go SDK VAULT_ADDR és VAULT_TOKEN változókat vár, ezek nem CIC névterűek)
      Frissítsd a teszteket is. Ne változtass más logikán.
    tests:
      - cmd/relay/main_test.go
    accept: make test

  - task: "uniform-error-json"
    status: done
    priority: 9
    milestone: M5.2
    prompt: |
      Minden HTTP hibaválasz egységes JSON struktúrával térjen vissza:
        {"error": "<message>", "code": "<snake_case_code>"}
      Jelenleg a handlerek `http.Error`-t használnak, ami plain text választ ad.
      Vezess be egy `writeError(w, code int, errCode, msg string)` segédfüggvényt
      a `cmd/relay/main.go`-ban, és cseréld ki az összes `http.Error` hívást rá.
      A Content-Type legyen `application/json` minden hibánál.
      Frissítsd a handler teszteket: ellenőrizzék a JSON body tartalmát is.
    tests:
      - cmd/relay/main_api_test.go
      - cmd/relay/main_test.go
    accept: make test

  - task: "dogfooding-config-schema"
    status: done
    priority: 10
    milestone: M8.2 / M-Konfig
    prompt: |
      A Relay induláskor validálja a saját konfigurációját a cabinet schema engine-nel.
      1. Hozz létre `config/relay.config.schema.yaml` fájlt (Kind: Schema), amely leírja
         az összes CIC_ prefixű config paramétert: típus, kötelező/opcionális, leírás.
      2. A `loadConfig` után (main.go) töltsd be ezt a sémát és validáld a betöltött
         konfigurációt mint map[string]interface{} a schema `$schema` kulcsával.
         Érvénytelen konfig esetén Fatal + egyértelmű hibaüzenet.
      3. A validációhoz a `cabinet` csomag `validateInputSchema` logikáját használd
         (nem kell új engine — a meglévő Accepts-alapú validáció elég első lépésként).
      4. Frissítsd az `ai/SYSTEM_CONTEXT.md`-t a dogfooding mechanizmus leírásával.
    tests:
      - cmd/relay/main_test.go
    accept: make test

  - task: "wasm-exec-timeout"
    status: done
    priority: 11
    milestone: M4.3
    prompt: |
      Vezess be per-step CPU/idő korlátot a `Setx` WASM végrehajtásban.
      A `WasmManagerConfig`-ban már van `DefaultTimeoutSeconds int` mező — ezt
      használd: minden WASM dispatch előtt hozz létre `context.WithTimeout`-ot.
      Native Go moduloknál NEM kell timeout (bízunk bennük).
      Ha a context lejár: `ErrTimeout` sentinel hiba (új, a `cabinet` csomagban),
      HTTP 504-re map-elve a handler szinten.
      Adj hozzá teszteket: timeout lejár → ErrTimeout, normál futás → ok.
    tests:
      - core/cabinet/service_unit_test.go
      - cmd/relay/main_api_test.go
    accept: make test

  - task: "symbols-ci-check"
    status: done
    priority: 12
    milestone: M7.1
    prompt: |
      A `make check-symbols` target már létezik (symbolsgen futtatás + git diff).
      Kösd be a CI pipeline-ba: hozz létre `.github/workflows/symbols.yml`-t
      (vagy bővítsd a meglévő workflow-t), amely `make check-symbols`-t futtat
      minden PR-on és minden main push-on.
      Ha a SYMBOLS.md drift > 0: a CI fail-el.
      Dokumentáld a `context/SYMBOLS.md` tetején egy rövid megjegyzéssel
      hogy ez auto-generált, kézzel ne módosítsd.
    tests:
      - .github/workflows/
    accept: make check-symbols

  - task: "e2e-smoke-tests"
    status: done
    priority: 13
    milestone: M6.5
    prompt: |
      Hozz létre `api_tests/smoke.sh` bash szkriptet, amely `docker compose up`
      után curl-lel teszteli a fő útvonalakat:
        GET  /         → 200, {"status":"ok",...}
        GET  /healthz  → 200, {"status":"ok"}
        GET  /readyz   → 200, {"status":"ok"}
        POST /set      → 400 (üres body), valid JSON hibapayload
      A szkript exit 0 ha minden pass, exit 1 ha bármely assertion fail.
      Frissítsd a Makefile `test-api` targetét hogy ezt futtassa.
      Dokumentáld a `ai/SYSTEM_CONTEXT.md`-ben az E2E futtatás módját.
    tests:
      - api_tests/smoke.sh
    accept: bash api_tests/smoke.sh

  - task: "secrets-separation"
    status: done
    priority: 14
    milestone: M8.3
    prompt: |
      Válaszd szét a titokkezelést a komponens-betöltéstől a `cmd/relay/main.go`-ban.
      A `buildRecorderOption` már külön van — ez a minta.
      Hozz létre `loadSecretsFromVault(ctx, logger) (*VaultSecrets, error)` függvényt,
      amely kizárólag Vault-tal kommunikál (token, PKI certs ha szükséges).
      A `loadInstalledComponents` NE tartalmazzon hálózati/titok logikát.
      Ez refaktor: a viselkedés nem változik, csak a felelősségek szétválnak.
      Frissítsd a teszteket hogy az új struktúrát tükrözzék.
    tests:
      - cmd/relay/main_test.go
      - cmd/relay/bootstrap_test.go
    accept: make test

  # --- Sprint 4 — Tech Debt (külső audit alapján) ---

  - task: "debug-cleanup"
    status: done
    priority: 15
    milestone: hygiene
    prompt: |
      Távolítsd el az összes debug print és kommentezett debug kód maradványt:
        1. `core/cabinet/mock_wasm_manager.go:19` — aktív `fmt.Printf("DEBUG: ...")` sor
        2. `core/cabinet/cicwasm.go:292` — kommentezett `// fmt.Printf("DEBUG: ...")` sor
      Ellenőrizd az összes többi .go fájlt is `fmt.Printf.*DEBUG` mintára — ha van más, azt is.
      Ez nem feature, nem refaktor — csak takarítás. Ne változtass logikán.
    tests:
      - (grep: nincs fmt.Printf.*DEBUG maradék)
    accept: make test

  - task: "ci-toolchain-sync"
    status: done
    priority: 16
    milestone: hygiene
    prompt: |
      A `go.mod` `go 1.24.0` / `toolchain go1.24.6`-ot deklarál, de a CI pipeline
      (`.github/workflows/verify.yml`) `go-version: "1.21.x"`-et használ.
      Ez silent build drift kockázatot jelent.
      Javítás:
        - Frissítsd a verify.yml összes `go-version` entry-jét `"1.24.x"`-re.
        - Ellenőrizd, hogy van-e más workflow fájl (pl. symbols.yml) ahol szintén javítani kell.
        - `make test` zöld marad a frissített verzióval.
      Ne változtass go.mod-on — az a forrás igazság.
    tests:
      - .github/workflows/verify.yml
      - .github/workflows/symbols.yml
    accept: make test

  - task: "makefile-ldflags-vars"
    status: done
    priority: 17
    milestone: hygiene
    prompt: |
      A `Makefile` a bináris build során ezeket injektálja ldflags-szal:
        `-X main.BuildID=$(VERSION)-$(COMMIT)`
        `-X main.CommitHash=$(COMMIT)`
        `-X main.Timestamp=$(shell date -u +...)`
      De a `cmd/relay/main.go`-ban ezek a változók (`BuildID`, `CommitHash`, `Timestamp`)
      nincsenek deklarálva, ezért a linker injekció néma sikertelenséggel elvész.
      Javítás: add hozzá a `cmd/relay/main.go`-hoz (package szinten):
        var (
            BuildID    = "dev"
            CommitHash = "unknown"
            Timestamp  = "unknown"
        )
      És loggold ki induláskor (INFO szint, `build_id`, `commit`, `timestamp` mezőkkel).
      Ne változtass Makefile-on.
    tests:
      - cmd/relay/main_test.go (build metadata log megjelenik)
    accept: make test

  - task: "wasm-size-limit-single-source"
    status: done
    priority: 18
    milestone: M4.4
    prompt: |
      A WASM méretlimit két helyen él egymástól függetlenül:
        1. `core/cabinet/validate.go:22` — `const MaxWASMModuleSize = 16 * 1024 * 1024` (hardcoded)
        2. `cmd/relay/main.go` config — `MaxWASMModuleSize` env-ből, default `16 * 1024 * 1024`
      Ezek egymástól függetlenül érvényesülnek — a config módosítása nem hat a validate.go logikára.
      Javítás:
        - Töröld a `validate.go`-beli `MaxWASMModuleSize` konstanst.
        - A `NewModuleDescriptor` (vagy ahol a konstans használva van) kapja meg a limitet
          paraméterként, vagy a cabinet service injektálja a konfiguráció alapján.
        - Egyetlen forrás a limit értékére: a `config.MaxWASMModuleSize`.
      Frissítsd az érintett teszteket.
    tests:
      - core/cabinet/service_unit_test.go
      - cmd/relay/bootstrap_test.go
    accept: make test

  - task: "embedded-pki-key-audit"
    status: done
    priority: 19
    milestone: hygiene
    prompt: |
      Az `embedded/pki/` könyvtárban privát kulcsok találhatók (`root_ca.key`, `intermediate_ca.key`).
      Ezek valószínűleg fejlesztői teszt kulcsok, de egy trust/PKI fókuszú projektben ez rossz optika
      és biztonsági kockázat.
      Feladatok:
        1. Ellenőrizd: az `embedded/pki/*.key` fájlok tényleg csak teszt/dev kulcsok-e
           (ne legyenek azonosak semmilyen éles infrastruktúrával).
        2. Adj hozzá `embedded/pki/README.md`-t: "DEVELOPMENT ONLY — generated test keys,
           never use in production" figyelmeztetéssel.
        3. Adj hozzá `.gitignore` szabályt az `embedded/pki/*.key` fájlokhoz — ezentúl ne
           kerüljenek commitba; a meglévőket hagyd (generáltak, nem változnak).
        4. Dokumentáld `ai/SYSTEM_CONTEXT.md`-ben hogy a `cmd/relay/testdata/pki/` generált
           kulcsok (`bootstrap_testdata.sh`), de az `embedded/pki/` kulcsok manuálisan commitáltak.
      Ne töröld a meglévő kulcsokat — a tesztek függhetnek rájuk.
    tests:
      - embedded/pki/README.md létezik
      - .gitignore tartalmaz embedded/pki/*.key szabályt
    accept: make test

  # --- Sprint 4 — Features ---

  - task: "ci-quality-gates"
    status: done
    priority: 20
    milestone: M7.2-M7.4
    prompt: |
      Bővítsd a `.github/workflows/verify.yml` CI pipeline-t a hiányzó quality gate lépésekkel:
        1. `make lint` (staticcheck) — minden PR-on és main push-on.
        2. `make vet` (go vet) — minden PR-on és main push-on.
        3. Per-package coverage threshold (`make coverage-check-pkgs`) — minden PR-on.
           Küszöbök: cabinet ≥ 95%, canonicalize ≥ 85%, certutils ≥ 70%, cmd/relay ≥ 80%, többi ≥ 75%.
        4. Coverage HTML artifact feltöltése (`actions/upload-artifact`) a coverage-profile lépés után.
      A meglévő lépések sorrendjét ne változtasd — csak add hozzá az újakat a megfelelő helyre.
      Ha valamelyik lépés már létezik (pl. vet), csak ellenőrizd, ne duplázd.
    tests:
      - .github/workflows/verify.yml
    accept: make vet && make lint

  - task: "limit-schema-config"
    status: done
    priority: 21
    milestone: M4.4
    prompt: |
      Egészítsd ki a `config/relay.config.schema.yaml` sémát és a `validateConfig` logikát úgy,
      hogy az összes LIMITS-korlát is schema-vezérelt legyen:
        - `CIC_MAX_JSON_INPUT_SIZE` (bytes, default 1MB) — már env változó, de nincs range-check a sémában
        - `CIC_MAX_WASM_MODULE_SIZE` (bytes, default 10MB) — ugyanez
        - `CIC_HASHING_TIMEOUT` (duration string, pl. "5s") — formátum + minimum "1s" ellenőrzés
        - `CIC_WASM_EXEC_TIMEOUT_SECONDS` (integer, ≥ 1) — ez jelenleg a WasmManagerConfig-ból jön,
          de nincs env-ből konfigurálva; vezess be `CIC_WASM_EXEC_TIMEOUT_SECONDS` env változót,
          default 30, minimum 1.
      A `relay.config.schema.yaml`-ban minden mezőhöz add hozzá a `minimum`/`pattern` constraint-et
      ha releváns. `validateConfig` szintén ellenőrizze a range-eket (Fatal ha sértett).
      Frissítsd a teszteket és a `ai/SYSTEM_CONTEXT.md` Dogfooding szekcióját.
    tests:
      - cmd/relay/main_test.go
      - config/relay.config.schema.yaml
    accept: make test

  - task: "circuit-breaker-rate-limit"
    status: done
    priority: 22
    milestone: M9
    prompt: |
      Vezess be alapszintű Operations Safety védelmet a `cmd/relay/main.go` HTTP szerverbe:
        1. **Rate limiter**: Per-IP token bucket, max 100 req/s, burst 20.
           Implementálás: `golang.org/x/time/rate` (már elérhető a Go std-n keresztül, ill. vendor-be).
           429 Too Many Requests → `writeError(w, 429, "rate_limited", "too many requests")`.
        2. **Concurrent request cap**: Max 50 párhuzamos request (semaphore pattern).
           503 Service Unavailable → `writeError(w, 503, "overloaded", "server busy")`.
        3. **Slow-loris védelem**: `http.Server.ReadHeaderTimeout = 5s`, `ReadTimeout = 30s`,
           `WriteTimeout = 60s`, `IdleTimeout = 120s`.
      Konfigurálható env változókon keresztül (`CIC_RATE_LIMIT_RPS`, `CIC_MAX_CONCURRENT_REQUESTS`).
      Ne vezess be külső függőséget ha elkerülhető — standard lib + x/time/rate.
      Add hozzá a limiteket a `config/relay.config.schema.yaml`-hoz és `validateConfig`-hoz.
      Tesztek: middleware unit tesztek a rate limiterhez és a concurrent cap-hez.
    tests:
      - cmd/relay/main_test.go
      - cmd/relay/main_api_test.go
    accept: make test

  - task: "operator-bootstrap-lifecycle"
    status: done
    priority: 23
    milestone: M16.2-M16.3
    prompt: |
      Implementáld a Nexus Operator hiányzó Bootstrap és Lifecycle logikáját:
        **M16.2 — Bootstrap**: `core/nexus/operator/bootstrap.go`
          - `BootstrapHost(ctx, hostDef HostDefinition) (*BootstrapToken, error)` függvény
          - Token = HMAC-SHA256(hostID + timestamp, operatorSecret), time-limited (24h)
          - A token a Git állapot repóba kerül commit-tal (recorder-en keresztül)
          - Ha a recorder nil: WARN + folytatás (non-fatal, mint a többi helyen)
        **M16.3 — Lifecycle**: `core/nexus/operator/lifecycle.go`
          - `OnboardHost(ctx, token *BootstrapToken) error` — validálja a tokent, aktiválja a hostot
          - `OffboardHost(ctx, hostID string) error` — deaktiválja, revoke token, commit
          - Mindkét művelet audit logot generál (structured logrus)
        Az operatorSecret-et env változóból olvasd (`CIC_OPERATOR_SECRET`), hiánya Fatal.
        Ne kösd be a PKI-ba (M3 előfeltétel) — csak HMAC alapú, dokumentáld mint "pre-PKI scaffold".
    tests:
      - core/nexus/operator/bootstrap_test.go
      - core/nexus/operator/lifecycle_test.go
    accept: make test

  - task: "nexus-upstream-source"
    status: done
    priority: 24
    milestone: M11
    prompt: |
      Implementáld az `UpstreamSource` IaC forrást a `core/nexus/iac/upstream.go`-ban.
      Az `IaCSource` interfész (`FetchConfig`) már definiált — a `FileSource` a referencia implementáció.
      Az `UpstreamSource`:
        - HTTP GET kérést küld a konfigurált `upstream_url`-re
        - Vár JSON vagy YAML választ (Content-Type alapján auto-detect)
        - Timeout: 10s (context-alapú, `CIC_UPSTREAM_FETCH_TIMEOUT` env változóból)
        - Hiba esetén: részletes wrapped error + logrus WARN (nem Fatal — degraded mode)
        - Retry: maximum 3 kísérlet, exponenciális backoff (1s, 2s, 4s)
      A forrás konfigurálható: `upstream_url` + opcionális `bearer_token` (env: `CIC_UPSTREAM_TOKEN`).
      Ha `CIC_UPSTREAM_URL` nincs beállítva: FileSource marad az alapértelmezett (backward-compatible).
      Tesztek: mock HTTP server-rel, timeout és retry szcenáriókkal.
    tests:
      - core/nexus/iac/upstream_test.go
    accept: make test

  # --- Sprint 5 ---

  - task: "sbom-release-artifact"
    status: done
    priority: 25
    milestone: M9
    prompt: |
      Zárjuk le az M9 mérföldkövet: reprodukálható release artifact lánc.
      A `-trimpath` flag már megvan a Makefile-ban.
      Feladatok:
        1. `make release` target:
           - Cross-compile linux/amd64 statikus binárist
             (`CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w"`)
           - Kimenet: `dist/relay`
