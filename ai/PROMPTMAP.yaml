  - task: "isolation-subprocess-ipc"
    status: todo
    priority: 27
    milestone: M15
    prompt: |
      Az M15 isolation coordinator jelenleg in-process — a Zero Trust cél
      ("plaintext adat soha nem jelenik meg a koordinátor processz memóriájában")
      nem teljesül. Implementáld a 3-process szétválasztást:
        1. Coordinator (jelenlegi main relay): Unix socket listener (`/tmp/cic-relay-ipc.sock`)
        2. Worker subprocess: `exec.Command(os.Executable(), "--mode=module-worker")`
           - stdin/stdout: newline-delimited JSON (kérés + válasz, 1 request egyszerre)
           - IPC protokoll: `{"op":"decrypt","payload":"..."}` / `{"result":"...","error":"..."}`
        3. `--mode=module-worker` flag: ha jelen van, a relay worker módban fut
           (nincs HTTP listener, csak IPC loop)
        4. Coordinator ↔ worker round-trip integrációs teszt (subprocess spawn + echo)
      Backward compat: ha `CIC_ISOLATION_MODE=subprocess` nincs beállítva,
      az in-process mód marad aktív (nem breaking change).
      DoD: `make test` zöld + subprocess round-trip teszt átmegy.
    tests:
      - core/nexus/isolation/coordinator_test.go
      - core/nexus/isolation/ipc_test.go
    accept: make test

