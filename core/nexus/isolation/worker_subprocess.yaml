objects:
- name: SubprocessWorker
  kind: struct
  description: 'SubprocessWorker implements Worker by spawning a subprocess for each
    Decrypt call. Communication is via stdin/stdout using newline-delimited JSON (IPCRequest
    / IPCResponse). Each Decrypt call spawns one subprocess, sends one request, reads
    one response, and waits. This is intentionally simple — no connection pooling,
    no persistent worker process. Activation: set CIC_ISOLATION_MODE=subprocess. Without
    it the existing LocalWorker (in-process) is used, preserving backward compatibility.'
  implements: []
  references: []
- name: NewSubprocessWorker
  kind: func
  description: NewSubprocessWorker returns a SubprocessWorker that re-executes the
    running binary with --mode=module-worker.
  references: []
