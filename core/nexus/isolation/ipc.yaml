- name: RunWorkerLoop
  kind: func
  description: 'RunWorkerLoop reads newline-delimited JSON IPCRequests from in, processes
    each with worker, and writes IPCResponse lines to out. Runs until in is exhausted
    or ctx is cancelled. If worker is nil the loop operates in echo mode: the payload
    is returned unchanged. Echo mode is used for testing and for subprocess startup
    before a crypto service is wired in.'
