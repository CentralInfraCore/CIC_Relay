- name: SignOCI
  kind: method
  receiver: VaultCryptoService
  description: 'SignOCI signs data with the Transit key using RSASSA-PKCS#1 v1.5 over
    SHA-256 — OCI''s request-signing scheme (draft-cavage `rsa-sha256`) — and returns
    the raw base64 signature the OCI `Authorization: Signature` header needs, with
    Vault''s `vault:v<N>:` version prefix stripped. Unlike [VaultCryptoService.Sign],
    which lets Vault default to PSS for RSA keys, this pins `pkcs1v15` / `sha2-256`
    as OCI requires. The key never leaves Vault. See features/feature-011-oci-provider.'
  references: []
  calls:
  - EncodeToString
  - Errorf
  - LastIndexByte
  - Logical
  - Sprintf
  - WriteWithContext
- name: Verify
  kind: method
  receiver: VaultCryptoService
  description: Verify uses the Vault Transit engine to verify a signature over the
    given data. The signature is the Vault wire form (e.g. "vault:v1:..."). The signing
    key never leaves Vault. Returns true iff Vault reports the signature valid.
  references: []
  calls:
  - EncodeToString
  - Errorf
  - Logical
  - Sprintf
  - WriteWithContext
- name: Decrypt
  kind: method
  receiver: VaultCryptoService
  description: Decrypt uses the Vault Transit engine to decrypt the given ciphertext.
