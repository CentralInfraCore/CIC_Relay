objects:
- name: CompareType
  kind: type
  description: CompareType is the semantic-equality rule for a field, sourced from
    the field's `behavior.compare.type`. Unknown/empty defaults to [CompareExact].
  references: []
- name: Compare
  kind: func
  description: 'Compare answers whether `observed` conforms to `intent` under the
    comparator `ct`. It returns: - comparable — false when the two values are not
    type-compatible under `ct` (the caller surfaces this as NOT_COMPARABLE, never
    as DRIFT); - matched — meaningful only when comparable, true when the values are
    equal. An empty/unknown `ct` is treated as [CompareExact].'
  references: []
  calls:
  - Cmp
- name: ClassifyFieldValue
  kind: method
  receiver: Observation
  description: 'ClassifyFieldValue is the full per-field verdict: it joins observation
    coverage (this method''s receiver) with the value comparison. For an observed
    field it runs [Compare] and maps the result to CONFORMANT / DRIFT / NOT_COMPARABLE;
    for absent or unobserved fields it defers to [Observation.ClassifyField], where
    the value never matters. This is the seam the compiled conformance plan drives:
    one call per field path, carrying the field''s comparator and both sides'' values.'
  references: []
  calls:
  - ClassifyField
  - Compare
  - Coverage
- name: canonicalEqual
