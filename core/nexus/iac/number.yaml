objects:
- name: canonicalNumber
  kind: func
  description: canonicalNumber returns the canonical decimal form of a numeric value
    and whether v was numeric. Integer types (and integer literals) keep full precision
    via big.Int; floats and non-integer literals normalize through float64's shortest
    round-trip form. Plain strings are accepted here (for numeric comparison), but
    [normalizeNumbers] does not treat them as numbers.
  references: []
  calls: []
- name: canonicalFloat
  kind: func
  description: canonicalFloat renders a float in plain (non-exponent) decimal, shortest
    form, mapping negative zero to "0".
  references: []
  calls: []
- name: canonicalNumericString
  kind: func
  description: canonicalNumericString canonicalizes a numeric literal. Integer literals
    keep full precision (big.Int); decimal/scientific literals normalize through float64.
    Returns false if s is not a number.
  references: []
  calls:
  - SetString
  - String
- name: isNumeric
  kind: func
  description: isNumeric reports whether v is a numeric Go type (not a numeric string).
  references: []
  calls: []
- name: normalizeNumbers
  kind: func
  description: normalizeNumbers deep-copies a decoded value tree, rewriting every
    numeric leaf to its canonical form (as a json.Number so it stays a number, not
    a string). Strings, bools and null are left untouched — a JSON string "4" stays
    distinct from the number 4.
  references: []
  calls: []
