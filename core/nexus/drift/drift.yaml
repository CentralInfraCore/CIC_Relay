---
package: drift
description: 'Package drift classifies the difference between a declared (desired)
  state and the observed (actual) state — the CIC "Declarative Accountability" primitive
  (demo §8.2–§8.3). The classification is deterministic (a `ProofTrace` prerequisite):
  the same desired/actual pair always yields the same type and the same, sorted, difference
  report. Classification is delegated to the feature-011 conformance model (core/nexus/iac):
  each desired key becomes an exact-compared field, `actual` is treated as a complete
  observation, and the per-field verdicts are folded back into this package''s Report.
  This is the "rewire the drift engine onto the new model" step — the bridge the object
  model was missing. Two consequences follow directly from that model (both intentional
  corrections of the old reflect-based engine): - Extra keys in the observed state
  are observed state, not drift. A desired state that is fully satisfied is NONE even
  when actual carries more (a provider_id, an assigned IP, a timestamp). SOFT_DRIFT
  is reserved for when a schema/plan says an extra field must not exist — not emitted
  by the default, schema-less classification here. - Empty desired + empty actual
  is NONE, not HARD_DRIFT: nothing is declared and nothing is there.'
