---
package: drift
description: 'Package drift classifies the difference between a declared (desired)
  state and the observed (actual) state — the CIC "Declarative Accountability" primitive
  (demo §8.2–§8.3). The classification is deterministic (a `ProofTrace` prerequisite):
  the same desired/actual pair always yields the same type and the same, sorted, difference
  report. Classification is delegated to the feature-011 conformance model (core/nexus/iac):
  each desired key becomes an exact-compared field, `actual` is treated as a complete
  observation, and the per-field verdicts are folded back into this package''s Report.
  This is the "rewire the drift engine onto the new model" step — the bridge the object
  model was missing. Two consequences follow directly from that model (both intentional
  corrections of the old reflect-based engine): - Extra keys in the observed state
  are observed state, not drift. A desired state that is fully satisfied is NONE even
  when actual carries more (a provider_id, an assigned IP, a timestamp). SOFT_DRIFT
  is reserved for when a schema/plan says an extra field must not exist — not emitted
  by the default, schema-less classification here. - Empty desired + empty actual
  is NONE, not HARD_DRIFT: nothing is declared and nothing is there.'
tags:
- core
category: []
used_in: []
entrypoint: false
related_nodes: []
objects:
- name: Report
  kind: struct
  description: 'Report is the deterministic result of comparing a desired state against
    an actual one: the drift Type plus the exact keys that differ.'
  implements: []
  references: []
- name: Type
  kind: type
  description: Type is the classification of a desired-vs-actual difference.
  references: []
- name: Analyze
  kind: func
  description: 'Analyze compares a desired state against an actual state and returns
    the deterministic drift Report, classified through the iac conformance model.
    Both are canonicalizable maps (e.g. decoded JSON). An empty actual against a non-empty
    desired is HARD_DRIFT (the infrastructure is gone). Empty against empty is NONE.
    Otherwise each desired key is compared (exact) against the observed value: a missing
    or mismatched key makes it RECONCILIABLE_DRIFT; a fully-satisfied desired state
    is NONE regardless of extra observed keys.'
  references:
  - iac.ConformancePlan
  - iac.FieldPlan
  - iac.Observation
  - iac.CompareExact
  - iac.Evaluate
  - iac.VerdictDrift
  - iac.VerdictNotComparable
  calls:
  - iac.Evaluate
- name: Classify
  kind: func
  description: Classify is a convenience over Analyze returning only the drift Type.
  references: []
  calls:
  - Analyze
- name: None
  kind: const
  description: 'None: the actual state satisfies the desired state (extra observed
    state is not counted against it).'
  references: []
- name: SoftDrift
  kind: const
  description: 'SoftDrift: the desired state is satisfied but a schema/plan forbids
    an extra field that is present — reconcilable by pruning. Requires a plan that
    marks the field forbidden; the default schema-less classification never emits
    it.'
  references: []
- name: ReconciliableDrift
  kind: const
  description: 'ReconciliableDrift: the desired state is not fully reflected (a desired
    key is missing, or holds a different/incomparable value) — reconcilable by re-applying.'
  references: []
- name: HardDrift
  kind: const
  description: 'HardDrift: a state was declared but nothing is observed (the infrastructure
    is gone). The physical state cannot be derived from the last valid ProofTrace.'
  references: []
