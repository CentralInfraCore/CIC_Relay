- name: Type
  kind: type
  description: Type is the classification of a desired-vs-actual difference.
  references: []
- name: Analyze
  kind: func
  description: 'Analyze compares a desired state against an actual state and returns
    the deterministic drift Report. Both are canonicalizable maps (e.g. decoded JSON).
    An empty or nil actual state is HARD_DRIFT (the infrastructure is gone), regardless
    of desired. Otherwise: any missing or changed desired key makes it RECONCILIABLE_DRIFT;
    if the desired state is fully satisfied but the actual has extra keys, it is SOFT_DRIFT;
    an exact match is NONE.'
