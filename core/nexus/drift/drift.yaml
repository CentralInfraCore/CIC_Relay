objects:
- name: Report
  kind: struct
  description: 'Report is the deterministic result of comparing a desired state against
    an actual one: the drift Type plus the exact keys that differ.'
  implements: []
  references: []
- name: Type
  kind: type
  description: Type is the classification of a desired-vs-actual difference.
  references: []
- name: Analyze
  kind: func
  description: 'Analyze compares a desired state against an actual state and returns
    the deterministic drift Report, classified through the iac conformance model.
    Both are canonicalizable maps (e.g. decoded JSON). An empty actual against a non-empty
    desired is HARD_DRIFT (the infrastructure is gone). Empty against empty is NONE.
    Otherwise each desired key is compared (exact) against the observed value: a missing
    or mismatched key makes it RECONCILIABLE_DRIFT; a fully-satisfied desired state
    is NONE regardless of extra observed keys.'
  references:
  - iac.ConformancePlanScalars
  - iac.FieldPlan
  - iac.ObservationObserved
  - iac.FieldPlanPath
  - iac.CompareExact
  - iac.Evaluate
