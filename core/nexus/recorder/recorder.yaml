  - types.ExpectedState
  calls: []
- name: RecordDrift
  kind: method
  receiver: GitStateRecorder
  description: 'RecordDrift records an observed actual state against a declared desired
    state: it classifies the drift (drift.Analyze) and commits it as a Vault-signed,
    parent-linked state entry whose meta carries the verdict — so the drift itself
    becomes an auditable, signed event (§8.2). `expected.json` holds the desired state
    and `actual.json` the observed one, so the standard VerifyChain verifies these
    commits unchanged. Returns the commit hash and the drift report.'
  references:
  - drift.Report
  - drift.Analyze
  calls:
  - drift.Analyze
- name: Rollback
  kind: method
  receiver: GitStateRecorder
  description: 'Rollback restores the declared state recorded at targetRef, gated
    by OIS (§8.4): it authorizes the rollback intent via policy, extracts the declared
    state at the target commit, and — if authorized — records that restored state
    as a new Vault-signed, parent-linked commit whose meta attests the authorized
    rollback (the physical re-apply is out of scope). It returns the new commit hash
    and the restored declared state; a policy refusal surfaces as the policy''s error
    (e.g. *ois.Denied), so the caller can tell "not authorized" from a recording failure.'
  references:
  - ois.Policy
  calls: []
- name: signAndCommit
  kind: method
  receiver: GitStateRecorder
  description: signAndCommit writes expected.json (the declared state), actual.json
    (the observed state), and meta.json — run_id, timestamp, the parent commit hash
    for chain binding, plus any extraMeta fields — signs the manifest over them via
    Vault, and commits. Shared by RecordState and RecordDrift.
  references: []
  calls:
  - Errorf
  - Format
  - Join
  - MarshalIndent
  - Now
  - Sign
  - Sprintf
  - Sum256
  - UTC
  - WriteFile
- name: createManifest
  kind: method
  receiver: GitStateRecorder
  description: createManifest generates a sorted list of files and their SHA256 hashes.
  references: []
  calls:
  - EncodeToString
  - Strings
  - Sum256
- name: runGit
  kind: method
  receiver: GitStateRecorder
  description: runGit executes a git command in the repo directory.
  references: []
  calls:
  - CombinedOutput
  - Command
  - Errorf
  - Join
- name: getHeadHash
  kind: method
  receiver: GitStateRecorder
  description: getHeadHash returns the full hash of the current HEAD commit.
  references: []
  calls:
  - Command
  - Errorf
  - Output
  - TrimSpace
- name: VerifyChain
  kind: method
  receiver: GitStateRecorder
  description: VerifyChain walks the recorded state commits oldest-to-newest and verifies,
    for each, that (1) the Vault signature over the file manifest is valid — the content
    is authentic and unaltered — and (2) the parent commit hash the record signed
    matches its actual git parent — the chain is intact. Any tampering with a committed
    file or any break in the chain is detected. The initial .gitignore commit (which
    carries no signature) is skipped. Returns nil iff the whole chain of state commits
    verifies; the signing key never leaves Vault.
  references: []
  calls:
  - Errorf
  - MarshalIndent
  - Sum256
  - Unmarshal
  - Verify
- name: listCommits
  kind: method
  receiver: GitStateRecorder
  description: listCommits returns all commit hashes oldest-to-newest.
  references: []
  calls:
  - Command
  - Errorf
  - Output
  - Split
  - TrimSpace
- name: showFileAtCommit
  kind: method
  receiver: GitStateRecorder
  description: showFileAtCommit returns the content of file as it existed at commit.
  references: []
  calls:
  - Command
  - Errorf
  - Output
- name: parentOf
  kind: method
  receiver: GitStateRecorder
  description: parentOf returns the parent commit hash of commit, or "" if it is the
