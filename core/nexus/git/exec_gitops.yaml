---
package: git
description: ''
tags:
- core
category: []
used_in: []
entrypoint: false
related_nodes: []
objects:
- name: ExecGitOps
  kind: struct
  description: ExecGitOps implements GitOps using os/exec("git", ...). All commands
    run with a hardened environment (no system config, no interactive prompts, no
    hooks).
  implements:
  - GitOps
  references:
  - obs.LogSink
  - obs.MetricSink
- name: NewExecGitOps
  kind: func
  description: NewExecGitOps creates an ExecGitOps backed by the given registry.
  references: []
  calls: []
- name: SetObsSinks
  kind: method
  receiver: ExecGitOps
  description: 'SetObsSinks wires observability sinks into ExecGitOps. Both arguments
    are nil-safe: passing nil disables the corresponding emissions.'
  references:
  - obs.LogSink
  - obs.MetricSink
  calls: []
- name: Clone
  kind: method
  receiver: ExecGitOps
  description: Clone clones url into the local path registered for repoID.
  references: []
  calls:
  - Resolve
- name: Fetch
  kind: method
  receiver: ExecGitOps
  description: Fetch fetches the given remote for the registered repo.
  references: []
  calls:
  - Resolve
- name: Checkout
  kind: method
  receiver: ExecGitOps
  description: Checkout checks out the given ref in the registered repo.
  references: []
  calls:
  - Resolve
- name: Commit
  kind: method
  receiver: ExecGitOps
  description: Commit stages paths and creates a commit; returns the new commit hash.
  references: []
  calls:
  - Resolve
- name: Push
  kind: method
  receiver: ExecGitOps
  description: Push pushes refspec to remote for the registered repo.
  references: []
  calls:
  - CanonicalPushRefspec
  - Resolve
- name: resolveExactRef
  kind: method
  receiver: ExecGitOps
  description: 'resolveExactRef returns the object id of the local ref named exactly
    refname ("refs/heads/..." or "refs/tags/..."), or an error if there is no such
    ref. "git show-ref --verify" requires the exact ref path: it does not try the
    other places a short or qualified name could also be looked up.'
  references: []
  calls: []
- name: requireUnambiguousRemoteRef
  kind: method
  receiver: ExecGitOps
  description: requireUnambiguousRemoteRef refuses a push whose destination refname
    git could match to a different ref of the remote. Given "refs/heads/x", git also
    accepts the remote's "refs/refs/heads/x", "refs/tags/refs/heads/x", "refs/heads/refs/heads/x",
    "refs/remotes/refs/heads/x" and ".../HEAD" for it, and updates that one when it
    is the only match. Everything that could be taken for the destination is asked
    of the remote; the only acceptable answer is nothing, or exactly the destination.
  references: []
  calls: []
- name: Status
  kind: method
  receiver: ExecGitOps
  description: Status returns the working-tree status of the registered repo.
  references: []
  calls:
  - Resolve
- name: parsePortcelainStatus
  kind: func
  description: parsePortcelainStatus parses the output of `git status --porcelain`.
  references: []
  calls: []
- name: auditRepoConfig
  kind: method
  receiver: ExecGitOps
  description: auditRepoConfig reads the repository's local configuration and refuses
    it if it carries a key outside repoConfigAllowed. It runs before any operation
    that would otherwise let git act on that configuration.
  references: []
  calls:
  - MatchString
- name: checkGlobalConfigFile
  kind: func
  description: 'checkGlobalConfigFile validates the operator-designated global configuration
    file, if one is set: an absolute path to a regular file that only its owner can
    write. Anything else disables git operations (fail closed) instead of being read.'
  references: []
  calls:
  - IsRegular
  - Mode
  - Perm
- name: requireConfiguredRemote
  kind: method
  receiver: ExecGitOps
  description: requireConfiguredRemote proves that name is a remote of this repository,
    that the repository's configuration is one we accept, and that every target the
    operation will use passes the URL policy. A syntactically valid name is not evidence
    that the remote is configured (git would read an unknown name as a path or a URL),
    so the repository is asked.
  references: []
  calls: []
- name: configuredRemoteTargets
  kind: method
  receiver: ExecGitOps
  description: configuredRemoteTargets is requireConfiguredRemote that also returns
    the validated effective target URLs.
  references: []
  calls: []
- name: validateRemoteTargets
  kind: method
  receiver: ExecGitOps
  description: 'validateRemoteTargets checks the targets of a remote for one operation,
    at two levels that must agree: 1. the stored values, as raw NUL-delimited records,
    with include files and every other configuration scope git itself reads applied
    (so a pushurl that lives in an included file or in the worktree configuration
    is seen), each validated exactly as stored; 2. the effective targets git will
    actually use, from "git remote get-url", which apply insteadOf and pushInsteadOf
    rewriting, each validated as well. The two lists must have the same number of
    entries: a difference means the target was rewritten into something else or a
    value contains a line break, and either way the operation is refused. The URL
    policy is applied to what git will contact, not only to what was written down.'
  references: []
  calls: []
- name: remoteTargets
  kind: method
  receiver: ExecGitOps
  description: remoteTargets is validateRemoteTargets that also returns the effective
    target URLs it validated, in the order git lists them. A caller that acts on a
    target uses THESE strings, not the remote's name, so that the endpoint that was
    checked is the endpoint that is used.
  references: []
  calls: []
- name: remoteConfigValues
  kind: method
  receiver: ExecGitOps
  description: 'remoteConfigValues returns every value of a multi-valued key as NUL-delimited
    records (git config -z), so one record is exactly one stored value however many
    lines it contains. It reads what git itself would read: all configuration scopes
    that are enabled, with include files applied. An absent key is an empty result,
    not an error.'
  references: []
  calls: []
- name: gitEnv
  kind: func
  description: 'gitEnv builds the child environment: the allowlisted inherited variables,
    then the fixed hardening values, which are appended last and so win over anything
    inherited.'
  references: []
  calls: []
- name: localProtocol
  kind: func
  description: ''
  references: []
  calls: []
- name: runGit
  kind: method
  receiver: ExecGitOps
  description: runGit executes a git command with a hardened environment. dir is the
    working directory; empty string means the caller's working directory.
  references: []
  calls: []
- name: runGitOutput
  kind: method
  receiver: ExecGitOps
  description: runGitOutput executes a git command and returns its stdout as a string.
  references: []
  calls: []
- name: runGitOutputDir
  kind: method
  receiver: ExecGitOps
  description: ''
  references:
  - obs.HistogramPoint
  - obs.Resource
  - obs.LogRecord
  calls:
  - Format
  - Milliseconds
  - RecordHistogram
  - RecordLog
  - Run
  - UTC
- name: repoConfigAllowed
  kind: var
  description: 'repoConfigAllowed lists the repository-local configuration keys a
    registered repository may carry. Anything else is refused: git configuration can
    name programs to run (core.sshCommand, core.fsmonitor, remote.<n>.receivepack,
    filter and diff drivers, credential helpers, aliases, includes) and can rewrite
    URLs (url.<base>.insteadOf), which would undo the transport and URL policy. The
    list is what "git clone" itself writes, plus remote and branch tracking.'
  references: []
- name: envAllowlist
  kind: var
  description: 'envAllowlist names the only variables a git child inherits from the
    relay process. Everything else (API tokens, Vault credentials, CIC_* settings,
    GIT_* overrides) stays with the relay: git, and the ssh/credential helpers it
    starts, have no use for them, and a transport that misbehaves must not be able
    to read them. These are the variables git needs to find itself, its home, a proxy
    or a CA bundle.'
  references: []
- name: maxOutputSize
  kind: const
  description: maxOutputSize limits the amount of git output captured in memory.
  references: []
- name: defaultTimeout
  kind: const
  description: defaultTimeout is applied per git command when the context has no deadline.
  references: []
