- name: TestGuestReachableOperationsDoNotWriteTheConfiguration
  kind: func
  description: 'F1.2 evidence: the operations a guest can reach do not write the repository
    configuration at all. Together with "the guest has no file access" (core/cabinet/cicwasm.go:
    the module is instantiated with no filesystem), this is what limits who can change
    the configuration between a validation and the git command that follows: not the
    guest, through any operation it can reach. Note a behaviour this pins: checkout
    runs "git checkout <ref> --", and with "--" git does not create a local tracking
    branch from a remote-only name (the DWIM that would write branch.<n>.remote/merge).
    A branch that exists locally, a tag or a commit check out as before.'
