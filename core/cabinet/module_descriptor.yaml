objects:
- name: NewModuleDescriptor
  kind: func
  description: 'NewModuleDescriptor constructs a ModuleDescriptor by calling the single
    central entry point for validation and checksum calculation. WASM canonicalization
    contract: custom sections are stripped from wasmCode *before* building the composite
    data struct used for checksum. This ensures the checksum is over the canonical
    (deterministic) form of the module, regardless of non-functional metadata embedded
    by compilers. The stripped bytes are also stored in the descriptor so that stored
    and executed bytes always match the checksummed form.'
  references: []
  calls:
  - ModuleDescriptor.GetData
- name: ID
  kind: method
  receiver: ModuleDescriptor
  description: ID returns the unique module identifier in the form "name@version".
    This is used for lookups in the module store.
  references: []
  calls: []
- name: GetData
  kind: method
  receiver: ModuleDescriptor
  description: GetData returns the data part of the module descriptor for checksum
    calculation. It now always returns a composite structure including policy fields
    and optional WASM code.
  references: []
  calls: []
- name: Checksum
  kind: method
  receiver: ModuleDescriptor
  description: Checksum returns the pre-computed checksum from the Meta block.
  references: []
  calls: []
