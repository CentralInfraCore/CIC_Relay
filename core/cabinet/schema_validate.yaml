objects:
- name: ValidateSchema
  kind: func
  description: ValidateSchema checks whether data carries a "$schema" key matching
    one of the accepted schema IDs. If accepts is empty, all data passes validation.
    This is the exported counterpart of validateInputSchema and can be used independently
    without a ModuleDescriptor (e.g. for self-validation).
  references: []
  calls:
  - Errorf
- name: validateInputSchema
  kind: func
  description: validateInputSchema checks whether inputData declares a "$schema" key
    that matches one of the module's accepted schema IDs. If the module declares no
    accepted schemas (Accepts is empty), all inputs pass without inspection. This
    preserves backward-compatibility with native modules that do not restrict their
    input type. When Accepts is non-empty the input MUST be a map[string]interface{}
    carrying a "$schema" string value whose value appears in the Accepts list. Any
    deviation returns ErrInvalid.
  references: []
  calls:
  - Errorf
  - ID
