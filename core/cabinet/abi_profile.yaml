- name: AbiSchemaRef
  kind: struct
  description: 'AbiSchemaRef is a (id, digest) reference to an operator-registered
    request or response schema. A reference without a digest is invalid at the wire
    level (ref 02 §2): there is no "trust the id alone" mode.'
  implements: []
  references: []
- name: AbiEffectResolution
  kind: struct
  description: 'AbiEffectResolution is the "contract-dependent" effect resolver (ref
    02 §2, D-3): the request field whose value selects the effect, the map from field
    value to effect, and the fail-closed default for values the map does not list.'
  implements: []
  references: []
- name: AbiOperation
