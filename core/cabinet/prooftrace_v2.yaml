- name: ValidateArtifactV2
  kind: func
  description: 'ValidateArtifactV2 enforces the V2 invariants the producer must never
    break. It is the Relay-side counterpart of the wire schema, plus the normative
    V2-01 rules: the requested identity always exists; a REJECTED step has a rejection
    record and no executed identity, output or host interaction; a SUCCEEDED/FAILED/ABORTED
    step has an executed identity and no rejection; "authenticated" requires the envelope
    digest (AC-V2-06); an ALLOWED/DENIED step requires the authorization-decision
    reference (AC-V2-11); and a V1 record is refused in the V2 domain (AC-V2-07).'
  references: []
  calls: []
