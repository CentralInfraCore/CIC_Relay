  kind: func
  description: 'SealArtifactV2 validates the artifact and writes its computed chain
    hash. A refused artifact gets no chain hash: the Relay does not emit a V2 artifact
    that breaks the V2-01 identity rules.'
  references: []
  calls:
  - ComputeChainHashV2
