- name: ChainBytesV2
  kind: func
  description: 'ChainBytesV2 builds the normative CICCHAINv2 hash input (V2-03): fixed
    order, LF-terminated `key=value` lines, with no JSON re-serialisation. Free text
    (the step name) enters only as the sha256 of its UTF-8 bytes; an absent value
    is the `null` literal; absent groups are explicit (`rejection=absent`, `executed=absent`);
    the chain_hash field is not part of the input.'
  references: []
  calls: []
- name: ComputeChainHashV2
  kind: func
  description: 'ComputeChainHashV2 returns "sha256:" + hex(sha256(ChainBytesV2(a))).
    It is the V2 chain hash: a different hash domain from ComputeChainHashV1, over
    a different field set, with no conversion between the two.'
  references: []
  calls:
