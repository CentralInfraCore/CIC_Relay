- name: ProfileRegistry
  kind: struct
  description: 'ProfileRegistry is the Relay''s ABI-profile loader (ref 02 §1/§3):
    admission (pinning + signature) and semantics (ABI-01..05, SS-05) for every profile
    a module manifest can pin against. The operator''s pinned list, signature verifier,
    schema registry and limit caps are supplied at construction, so a second (or Nth)
    profile is admissible purely by adding its pin and schema entries to this configuration
    — no change to ProfileRegistry or CheckProfileSemantics (AC-03-1).'
  implements: []
  references: []
- name: ProfileSignatureVerifier
  kind: interface
  description: 'ProfileSignatureVerifier checks a profile''s CICABIPROFv1 signed domain
    against the admission trust bundle''s authority bindings. This is explicitly the
    WP-02 admission mechanism''s job (job input: "a CICABIPROFv1 aláírt tartomány
    verifikációja a WP-02 admission-mechanizmusán át (ha az még nincs kész, interfész
    mögötti, mockolt trust-bundle, jelölve)") — WP-02 has not landed in this repository
    snapshot (CIC_Relay 86ea1ab), so there is no real trust bundle to call here yet.
    This interface is that seam; MockProfileSignatureVerifier below is the explicit,
    clearly-labelled stand-in the job input calls for. No production code in this
    job wires the mock in — it exists so ProfileRegistry.Admit''s pinning/semantics
    logic can be tested without waiting on WP-02, and so WP-02 can later supply the
    real implementation without any change to ProfileRegistry itself.'
  references: []
  methods:
  - VerifySignedProfile
