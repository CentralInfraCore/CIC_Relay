- name: CheckProfileSemantics
  kind: func
  description: 'CheckProfileSemantics enforces ABI-01..04 and SS-05 (ref 02 §7) on
    an already structurally-valid AbiProfile (see ParseProfile). It returns the first
    violation as an *ABIProfileError, or nil. The check order mirrors check_profile_semantics
    exactly (reference-build_o1_schemas.py.txt:190-217): duplicate names, then per-operation
    schema refs and effect-field resolution, then host-capability consistency, then
    limits.'
  references: []
