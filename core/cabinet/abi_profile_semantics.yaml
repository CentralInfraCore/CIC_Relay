- name: ABIProfileError
  kind: struct
  description: ABIProfileError is a named, machine-checkable ABI-profile admission
    failure. errors.Is(err, ErrInvalid) holds for it, like every other Cabinet validation
    failure; Code carries the specific ABI-01..05/SS-05/registry violation.
  implements: []
  references: []
- name: SchemaRegistryEntry
  kind: struct
  description: 'SchemaRegistryEntry is one operator-registered schema: its pinned
    digest, and for request schemas used as an effect_resolution field source, the
    field''s enum domain (ABI-02''s "egy deklarált, felsorolásos mező").'
  implements: []
  references: []
- name: OperatorLimits
  kind: struct
  description: 'OperatorLimits is the operator''s upper bound on a profile''s limits
    (SS-05): "a profil-limitek az operátori korlátot nem lépik túl". Zero means "no
    operator cap is declared for this field", mirroring the reference''s dict lookup:
    a profile field with no corresponding cap entry is a programming error in the
    caller (the reference''s OPERATOR_CAPS covers all three fields), not something
    CheckProfileSemantics silently allows.'
  implements: []
  references: []
- name: SchemaRegistry
  kind: interface
  description: SchemaRegistry resolves a profile's schema references against the operator's
    schema store (ABI-03). The physical location of that store is an open question
    (ref 02 §6); this interface is what CheckProfileSemantics needs from it. InMemorySchemaRegistry
    below is the test/reference implementation.
  references: []
  methods:
  - Resolve
- name: InMemorySchemaRegistry
  kind: type
  description: InMemorySchemaRegistry is a fixed-map SchemaRegistry, for tests and
    for any caller that already has its schema set resolved in memory.
  references: []
