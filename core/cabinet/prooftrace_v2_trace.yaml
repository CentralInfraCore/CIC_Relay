- name: TraceV2Source
  kind: interface
  description: 'TraceV2Source supplies what the cabinet cannot know by itself: the
    authenticated identity of an executed module (the envelope digest of the admission,
    the ABI profile, the trust state), the authorization decision record, the context
    reference and the host-interaction list. Production wiring of these is integration
    work (the admission and the host-interaction record live in other work packages);
    the cabinet only asks.'
  references: []
  methods:
  - Authorization
  - ExecutedIdentity
  - ExecutionContext
  - HostInteractions
- name: StepScoper
  kind: interface
  description: 'StepScoper is an optional extension of a TraceV2Source: it is asked,
    once per step and before the step dispatches, for the context the step runs under.
    A source uses it to keep the step''s host interactions apart (O-1 INT-08): the
    scoped context reaches the host functions the step calls, and the same context
    is handed back to the source''s HostInteractions, Authorization and ExecutionContext
    when the step is sealed.'
  references: []
  methods:
  - ScopeStep
- name: TraceV2Sink
  kind: type
