- name: TestAssertSource_CarriesSourceProvenance
  kind: func
  description: 'Regression: the assert step must carry source provenance through.
    cic.pipeline.start resolves the cloned repository''s commit and tree digest and
    the intermediate steps propagate them, but assert used to rebuild its result from
    scratch and drop them here. The signing step then fell back to the relay''s own
    build-time constants, so build_hash attested WHAT was compiled but not WHERE it
    came from: two different commits of the same repository yielded a bit-identical
    build_hash whenever the compiled artifact was unchanged.'
  references:
  - schemacompile.NewAssertSourceFunc
  - require.NoError
  - assert.Equal
  calls:
  - AddCert
  - assert.Equal
  - require.NoError
  - schemacompile.NewAssertSourceFunc
- name: TestAssertSource_NoProvenanceKeysWhenAbsent
  kind: func
  description: A run that carries no repository (e.g. a direct /v1/schema/compile
    call) must not grow empty provenance keys — the signing step distinguishes "absent"
    from "empty" to decide whether to fall back to the relay's own build constants.
  references:
  - schemacompile.NewAssertSourceFunc
  - require.NoError
  - assert.False
  calls:
  - assert.False
  - require.NoError
  - schemacompile.NewAssertSourceFunc
