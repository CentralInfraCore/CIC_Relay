objects:
- name: stubArtifact
  kind: struct
  description: 'stubArtifact is the document BuildSchema generates in stub mode. It
    is serialized with a YAML encoder, not interpolated into a template: the encoder
    quotes a value whenever its plain form would parse as something other than a string,
    so a version such as "1.0" stays the string "1.0" (not the float 1) and a name
    such as "true" stays a string (not a bool). A character whitelist alone does not
    give that guarantee: "1.0", "true", "null" and "1e3" all pass it.'
  implements: []
  references: []
- name: renderStubArtifact
  kind: func
  description: renderStubArtifact returns the stub artifact document. For ordinary
    values the bytes equal what the former template produced (two-space indent, same
    key order).
  references:
  - yaml.NewEncoder
  calls:
  - Close
  - Encode
  - SetIndent
  - yaml.NewEncoder
