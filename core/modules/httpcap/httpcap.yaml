---
package: httpcap
description: 'Package httpcap implements the relay''s `http.request` capability: a
  native cabinet module that performs an authenticated HTTP actuation through the
  feature-008/009 trust-flow. Registered in the cabinet, a workflow step like `http@1.0.request(input)`
  drives a real actuation; because it is a native step, Setx hashes its input/output
  into the ProofTrace and the recorder persists it — so a capability call is auditable
  and durable exactly like any native or WASM step, with no special-casing. The actuation
  itself is performed by an injected [Actuator] whose single method matches the Rust
  FFI `run_flow` seam byte-for-byte (JSON in, JSON out). The cgo relay build injects
  a `cicffi.RunFlow`-backed actuator; the cabinet and this package never import cgo,
  so the default build stays pure-Go.'
tags:
- core
category: []
used_in: []
entrypoint: false
related_nodes: []
objects:
- name: Audit
  kind: struct
  description: 'Audit is the non-secret audit record an actuation carries back — the
    Rust ChainedEntry projection: body digests, the allow/deny decision, and the tamper-evident
    record_hash. It never carries the credential, the Authorization header, a token,
    or any body contents.'
  implements: []
  references: []
- name: Result
  kind: struct
  description: 'Result is the capability step''s output: the non-secret outcome of
    an actuation. The opened credential never appears here — only the status, the
    (base64) response body, the countersigned scope, and the audit record.'
  implements: []
  references: []
- name: runFlowResult
  kind: struct
  description: runFlowResult is the wire form of the actuator's JSON output.
  implements: []
  references: []
- name: Actuator
  kind: interface
  description: Actuator performs one HTTP actuation via the trust-flow. reqJSON and
    resJSON are the Rust `run_flow` request/result documents. The production implementation
    is the cgo FFI (`cicffi.RunFlow`), injected at relay startup so the cabinet never
    hard-depends on cgo.
  references: []
  methods:
  - RunFlow
- name: ActuatorFunc
  kind: type
  description: ActuatorFunc adapts a plain function to the [Actuator] interface (mirrors
    the http.HandlerFunc idiom), so `cicffi.RunFlow` or a test double can be used
    directly.
  references: []
- name: RunFlow
  kind: method
  receiver: ActuatorFunc
  description: RunFlow calls f.
  references: []
  calls: []
- name: NewRequestFunc
  kind: func
  description: 'NewRequestFunc returns the native cabinet function for the `request`
    operation, backed by actuator. The returned function matches the native module
    ABI `func(context.Context, interface{}) (interface{}, error)`: it marshals the
    step input as the `run_flow` request, actuates, and returns the non-secret [Result].
    A flow that runs but is refused (policy deny, SSRF block, limit, transport error)
    is surfaced as an error so the workflow step fails; the credential and any body
    contents never cross into the result.'
  references: []
  calls: []
- name: ErrNoActuator
  kind: var
  description: ErrNoActuator is returned by the capability when no [Actuator] is configured
    — e.g. a relay built without the `ffi_cgo` bridge. It lets the workflow step fail
    cleanly rather than panic.
  references: []
