- name: TestValidateStepHash_Deterministic
  kind: func
  description: 'TestValidateStepHash_Deterministic verifies that sortedKeys produces
    a stable sorted order on every call: the same input must yield an identical step_hash
    across repeated invocations. Go randomises map iteration per range, so any mutation
    that breaks the sort (disabled inner loop, reversed comparison, wrong swap indices)
    will produce a different hash on at least one iteration.'
  references:
  - schemapipeline.PipelineConfig
  - require.NoError
  - require.NotEmpty
  - assert.Equal
  - schemapipeline.PipelineConfig.NewValidateFunc
  calls:
  - assert.Equal
  - require.NoError
  - require.NotEmpty
  - schemapipeline.PipelineConfig.NewValidateFunc
- name: TestValidateStepHash_GoldenValue
  kind: func
  description: 'TestValidateStepHash_GoldenValue asserts the exact step_hash for a
    known input. This kills mutations that sort keys in the wrong order (e.g. reversed
    comparison): any wrong sort produces a different Merkle root.'
  references:
  - schemapipeline.PipelineConfig
  - require.NoError
  - assert.Equal
  - schemapipeline.PipelineConfig.NewValidateFunc
  calls:
  - assert.Equal
  - require.NoError
  - schemapipeline.PipelineConfig.NewValidateFunc
