---
package: schemapipeline
description: 'Package schemapipeline implements the four-step CIC-Schemas build pipeline
  as native relay modules. Workflow steps (in order): cic.pipeline.start@1.0 — git
  clone + branch, record source_ref + tree_digest cic.pipeline.test@1.0 — make test
  in the builder container cic.pipeline.validate@1.0 — make validate in the builder
  container cic.pipeline.release@1.0 — make release, read signed artifact from source/
  The output of release feeds directly into cic.source.assert@1.0 as source_assertion.
  Every step adds its own merkle leaf (step_hash) to the carry-over map.'
tags:
- core
category: []
used_in: []
entrypoint: false
related_nodes: []
