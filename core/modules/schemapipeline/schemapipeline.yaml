  references: []
  calls: []
- name: NewStartFunc
  kind: method
  receiver: PipelineConfig
  description: 'NewStartFunc returns the cic.pipeline.start@1.0 native function. It
    git-clones the requested repo+branch into BuildDir and records source_ref, tree_digest,
    and builder_image_digest as hash-chain leaves. Required input fields: repo_url,
    branch, schema, version. Optional: build_dir (overrides PipelineConfig.BuildDir
    per-request).'
  references: []
  calls:
  - Run
- name: NewTestFunc
  kind: method
  receiver: PipelineConfig
  description: NewTestFunc returns the cic.pipeline.test@1.0 native function. Runs
    `docker exec <builder_container> make test` and records stdout_digest + exit_code.
  references: []
  calls: []
- name: NewValidateFunc
  kind: method
  receiver: PipelineConfig
  description: NewValidateFunc returns the cic.pipeline.validate@1.0 native function.
    Runs `docker exec <builder_container> make validate` and records stdout_digest
    + exit_code.
  references: []
  calls: []
- name: NewRepoBuildFunc
  kind: method
  receiver: PipelineConfig
  description: 'NewRepoBuildFunc returns the cic.repo.build@1.0 native function. The
    schema pipeline is CIC-Schemas-shaped: it demands schema/version and reads the
    released artifact from a fixed source/<schema>.yaml. This step is the generic
    counterpart — the caller names the make target and the file that make produces,
    and the result is handed to cic.artifact.sign as raw_artifact. Like test/validate
    it runs inside the builder container, not in the relay process, so the build toolchain
    stays in a container the operator controls. Input: make_target (default "build"),
    artifact_output (required, relative to build_dir), builder_container, build_dir
    Output: the make step''s record plus raw_artifact / artifact_path / artifact_digest'
  references: []
  calls: []
- name: resolveInBuildDir
  kind: func
  description: resolveInBuildDir joins rel onto buildDir and refuses anything that
    escapes it.
  references: []
  calls: []
- name: runMakeStep
  kind: method
  receiver: PipelineConfig
  description: runMakeStep is the shared implementation for test and validate steps.
    It runs `make <target>` inside the builder container and records the result.
  references: []
  calls:
  - Run
- name: NewReleaseFunc
  kind: method
  receiver: PipelineConfig
  description: NewReleaseFunc returns the cic.pipeline.release@1.0 native function.
    Runs `docker exec <builder_container> make release VERSION=<version>`, then reads
    the signed artifact from <build_dir>/source/<schema>.yaml and returns it as source_assertion
    for cic.source.assert.
  references: []
  calls:
  - Run
- name: computeStepHash
  kind: func
  description: computeStepHash returns a Merkle root over the step's named leaves.
    keys is iterated in sorted order for determinism.
  references:
  - merkle.LeafHash
  - merkle.HexMerkleRoot
  calls:
  - merkle.HexMerkleRoot
  - merkle.LeafHash
- name: computeTreeDigest
  kind: func
  description: 'computeTreeDigest returns a content-addressable digest of the source
    tree at buildDir. Algorithm (normalization rules): - Traversal: filepath.WalkDir
    in OS readdir order (UTF-8 byte order on Linux/ext4). - Scope: regular files only.
    Directories, symlinks, and device files are skipped. The .git directory is excluded
    entirely. - Path encoding: each file''s path is the slash-free relative path from
    buildDir, using the OS-native path separator (always ''/'' on Linux). No normalization
    of line endings, permissions, timestamps, or ownership is performed. - Per-file
    hash: raw sha256 of file bytes (no length prefix, no mode bits). - Accumulator:
    single SHA-256 updated with (rel_path_bytes || file_sha256_bytes) for each file
    in WalkDir order. No delimiter between path and hash — the fixed 32-byte sha256
    length makes the concatenation unambiguous. - Result format: "sha256:<lowercase-hex-of-accumulator>".
    - Empty / missing directory: returns sha256("empty-tree") prefixed with "sha256:".
    Limitation: this digest is NOT portable across OS/filesystem types that sort directory
    entries differently from Linux ext4. It is suitable for Docker-based pipelines
    where the build directory always lives on the same host filesystem.'
  references: []
  calls:
  - Sum
  - Write
- name: digestString
  kind: func
  description: digestString returns the lowercase hex SHA-256 of s.
  references: []
  calls: []
- name: copyMap
  kind: func
  description: copyMap shallow-copies a map[string]interface{}.
  references: []
  calls: []
- name: sortedKeys
  kind: func
  description: sortedKeys returns the keys of m in sorted order.
  references: []
  calls: []
