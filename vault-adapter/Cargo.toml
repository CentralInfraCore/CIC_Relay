[package]
name = "vault-adapter"
description = "Live async bridge from the CIC secret-flow ports to a HashiCorp Vault backend (feature-008)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Opt-in live-Vault integration path (mTLS cert-auth constructor + the
# tests/live_chain.rs end-to-end test). Off by default so the standard
# unit/coverage/mutation runs never require a Vault; run it via `make test-vault-live`.
live-vault = []

[dependencies]
connections = { path = "../connections" }
vault-client-rs = { git = "https://github.com/sinkog/vault-client-rs", rev = "e442b8122a2dcf93146113e987904841e717111b" }
base64 = "0.22"
secrecy = "0.10"

[dev-dependencies]
vault-client-rs-test = { git = "https://github.com/sinkog/vault-client-rs", rev = "e442b8122a2dcf93146113e987904841e717111b" }
module = { path = "../module" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
serde_json = "1"
# live_chain.rs generates a raw module key and exports it as PKCS#8 PEM for the
# mTLS client identity (permissive, pure-Rust — already in the tree via `module`).
p256 = { version = "0.13", features = ["ecdsa", "pem", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
