- name: VaultPkiCountersigner
  kind: struct
  visibility: pub
  description: 'The Relay''s runtime countersigner: a [`CountersignPolicy`] (decision)
    plus a [`PkiBackend`] (mechanism), targeting a PKI `mount`/`role`. It authorizes
    the request, then — only if permitted — has Vault countersign the CSR, returning
    a [`CounterSignedCert`] carrying the authorized scope. The signing key stays in
    Vault; this type never holds it.'
  derives: []
  implements: []
  references:
  - vault_client_rs::VaultClient
- name: CountersignPolicy
  kind: trait
  visibility: pub
  description: The Relay's content-dependent authorization — the policy decision point.
    Given a [`CertRequest`] (subject + requested scope + CSR), decide **which CNs
    to countersign** and return that authorized [`AuthScope`], or [`Denied`] to refuse.
    Implementations range from a trivial [`AllowlistPolicy`] to richer, content-dependent
    rules; the countersigner treats them uniformly.
  methods:
  - authorize
  supertraits:
  - Send
  - Sync
  references:
  - connections::vault::port::CertRequest
  - connections::vault::AuthScope
  calls: []
- name: PkiBackend
  kind: trait
  visibility: pub
  description: The CA-signing mechanism the countersigner needs, as a seam over the
    driver. The real [`VaultClient`] implements it via the PKI engine's `sign-verbatim`;
    tests implement it with the driver-level `MockPki`. It signs the CSR as-is (the
    module chose the subject/CNs); the policy — not this seam — decides whether that
    request is allowed.
  methods:
