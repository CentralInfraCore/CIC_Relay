---
crate: vault_adapter
module: crate::countersign
description: 'Live Vault-PKI-backed countersigner — the runtime counterpart of the
  `connections` [`Countersigner`](connections::vault::port::Countersigner) port. This
  is the Relay''s role at runtime, split into its two orthogonal parts: - **The decision**
  ([`CountersignPolicy`]) — the Relay''s *content-dependent authorization*: given
  a [`CertRequest`], decide which CNs to countersign, or refuse. This is where the
  Relay is "smart"; the signer knows nothing about it. - **The mechanism** ([`PkiBackend`])
  — a dumb CA-signing seam over Vault''s PKI engine (`pki/sign-verbatim`). The intermediate
  CA key lives in Vault and never enters the Relay''s process. [`VaultPkiCountersigner`]
  wires the two: it authorizes via the policy, then — only for what the policy permitted
  — has Vault countersign the module''s CSR, yielding a [`CounterSignedCert`] chained
  to the CA root. It never holds the signing key and never sees a secret.'
tags:
- interface
