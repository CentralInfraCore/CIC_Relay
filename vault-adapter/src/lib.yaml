---
crate: vault_adapter
module: crate
description: 'Live async bridge from the CIC secret-flow core to a `HashiCorp` Vault
  backend (feature-008). This is the **adapter** layer: it owns *translation* between
  the `vault-client-rs` driver (which owns *access*) and the `connections` core types
  (which own *meaning*). It depends on the driver as a pinned git dependency and produces
  core [`SealedSecret`] values. Crucially, it **never decrypts**: it reads the pubkey-sealed
  envelope stored in Vault and wraps it opaquely, so only the module holding the matching
  private key can open it. The `read_sealed` method is the live async counterpart
  of the deterministic in-memory [`connections::vault::port::SecretBackend`] contract.'
