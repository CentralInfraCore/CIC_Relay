- name: connect_mtls
  kind: method
  receiver: VaultSecretSource
  visibility: pub
  description: 'Connects with an **mTLS client identity** for cert-auth login: the
    client presents `client_cert_pem` + `client_key_pem` in the TLS handshake and
    verifies the server against `ca_pem`. It starts tokenless — [`login`](Self::login)
    performs the cert-auth exchange and the resulting scoped token is what subsequent
    reads use. Gated behind the `live-vault` feature: it is exercised only by the
    opt-in live-Vault integration test (`tests/live_chain.rs`), never in the default
    build''s unit/coverage/mutation runs. # Errors [`VaultError`] if the address,
    CA certificate, or client identity is invalid.'
  references:
  - vault_client_rs::VaultError
  - vault_client_rs::VaultClient::builder
  calls:
  - VaultSecretSource::new
  - vault_client_rs::VaultClient::builder
