- name: read_sealed
  kind: method
  receiver: VaultSecretSource
  visibility: pub
  description: 'Reads the sealed envelope at `secret_ref` from Vault KV v2. The `mount`
    and `path` of the reference select the KV v2 secret; the `sealed` field carries
    the base64 ciphertext. Explicit versions are not yet wired — the latest version
    is read. # Errors [`AdapterError::NotFound`] if absent; [`AdapterError::Denied`]
    if access is refused; [`AdapterError::Decode`] if the stored field is not valid
    base64; [`AdapterError::Backend`] on any other Vault failure.'
  references:
  - connections::vault::SecretRef
  - connections::vault::SealedSecret
  calls:
  - decode_sealed
  - map_read_error
- name: login
  kind: method
  receiver: VaultSecretSource
  visibility: pub
  description: 'Authenticates to Vault via the cert-auth backend at `mount`, presenting
    the (mTLS) client certificate configured on the transport and optionally naming
    the cert `role`. Returns the issued token with its lease metadata. This is the
    live async counterpart of the in-memory `TokenProvider` contract: the Relay-countersigned
    Cert is exchanged for a scoped token. # Errors [`AdapterError::Unauthorized`]
    if Vault rejects the certificate; [`AdapterError::Backend`] on any other Vault
    failure.'
  references: []
  calls:
  - IssuedToken::from_auth
