- name: VaultBackend
  kind: trait
  visibility: pub
  description: 'The narrow set of Vault driver operations the adapter needs, as a
    seam. This is the adapter''s own port over the `vault-client-rs` driver: it names
    exactly the two operations [`VaultSecretSource`] performs — a KV v2 field read
    and a cert-auth login — each scoped by an explicit `mount`. The real [`VaultClient`]
    implements it by delegating to the driver''s mount-scoped handlers; tests implement
    it with the driver-level trait mocks, so the adapter''s translation logic is exercised
    without `WireMock` or a live Vault. Methods return `impl Future + Send` (rather
    than `async fn`) so the trait stays object-safe-adjacent and imposes an explicit
    `Send` bound on the returned futures.'
  methods:
  - cert_login
  - read_field
  supertraits:
  - Send
  - Sync
