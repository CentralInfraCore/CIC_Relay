- name: VaultSecretSource
  kind: struct
  visibility: pub
  description: A live secret source backed by a `HashiCorp` Vault KV v2 mount, via
    the `vault-client-rs` driver (the default backend `B`). It reads the pubkey-sealed
    envelope stored under the `sealed` field and wraps it as a [`SealedSecret`]; it
    never decrypts. Generic over the [`VaultBackend`] seam so it can be driven by
    the real driver or a mock.
  derives:
