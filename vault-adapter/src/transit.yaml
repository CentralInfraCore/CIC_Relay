  references: []
  calls: []
- name: sign
  kind: method
  receiver: VaultTransitSigner
  visibility: pub
  description: 'Signs `message` — an audit-chain head `record_hash`, as bytes — with
    the Vault-held key. One call anchors the whole hash-linked prefix (see the module
    docs). `message` is expected to be the hex `record_hash` string''s bytes, the
    same domain `http-executor`''s in-process `RecordSigner` signs. # Errors [`SignError::Denied`]
    if Vault policy refuses the operation; [`SignError::Backend`] on any other Transit
    failure.'
  references: []
  calls: []
- name: verify
  kind: method
  receiver: VaultTransitSigner
  visibility: pub
  description: 'Verifies a Vault `signature` over `message` against the Vault-held
    key. Returns `Ok(false)` for a well-formed but non-matching signature, and [`SignError`]
    only when Vault itself refuses or fails. # Errors [`SignError::Denied`] if Vault
    policy refuses the operation; [`SignError::Backend`] on any other Transit failure.'
  references: []
  calls:
  - VaultSignature::as_str
