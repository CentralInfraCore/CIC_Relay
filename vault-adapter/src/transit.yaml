  test: true
- name: TransitBackend
  kind: trait
  visibility: pub
  description: 'The narrow Transit operations the signer needs, as a seam over the
    driver. This is the signer''s own port over the `vault-client-rs` driver: it names
    exactly the two operations [`VaultTransitSigner`] performs — a Transit `sign`
    and a Transit `verify`, each scoped by an explicit `mount` and key `name`. The
    real [`VaultClient`] implements it via the driver''s mount-scoped Transit handler;
    tests implement it with an in-memory fake, so the signer''s translation logic
    is exercised without a live Vault. Methods return `impl Future + Send` (rather
    than `async fn`) so the trait imposes an explicit `Send` bound on the returned
    futures, matching the rest of the adapter''s seams.'
  methods:
  - transit_sign
  - transit_verify
  supertraits:
  - Send
  - Sync
