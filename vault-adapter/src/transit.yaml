---
crate: vault_adapter
module: crate::transit
description: 'Live Vault-Transit-backed audit-chain signer (feature-009): the runtime
  counterpart of `http-executor`''s in-process `RecordSigner`, but the ECDSA signing
  key lives in Vault''s Transit engine and **never leaves it** — exactly the custody
  model the countersign CA key already uses (`pki/sign-verbatim`). # Why a head anchor,
  not per-entry sync signing `http-executor`''s `HashChainedAuditSink` signs each
  entry *synchronously* with a `RecordSigner` (an in-process ECDSA key). A Vault Transit
  call is *async* network I/O; driving it from that sync `record()` path would mean
  blocking on a runtime from inside a runtime — a footgun that panics under `tokio`.
  Because the chain is hash-linked (`record_hash_n` transitively binds every earlier
  entry), signing the **head** `record_hash` with a Vault-held key anchors the whole
  prefix in a single call — the standard tamper-evident-log notarization shape. So
  this signer takes raw `record_hash` bytes (the exact `ChainedEntry.record_hash.as_bytes()`
  domain the in-process signer signs) and returns a Vault signature over them. The
  in-process `LocalEcdsaSigner` stays for the pure/embedded path; this is its production
  key-custody counterpart.'
tags:
- interface
category: []
used_in: []
entrypoint: false
related_nodes: []
