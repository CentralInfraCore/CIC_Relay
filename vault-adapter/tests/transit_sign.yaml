description: 'Opt-in **live-Vault** test of the feature-009 audit-chain signer: it
  signs an audit-chain head `record_hash` with a Vault-Transit-held ECDSA key and
  verifies it back — proving the signing key never leaves Vault (the production custody
  model), the tamper-evident-log head-anchor shape, and the stored-signature round-trip.
  It is a no-op unless `VAULT_LIVE_ADDR` is set, so it never runs in the default unit/coverage/mutation
  builds. Run it via `make test-vault-live`, which spins a throwaway `-dev-tls` server,
  enables a Transit mount with an `ecdsa-p256` signing key, and points the `VAULT_LIVE_*`
  env vars at it.'
