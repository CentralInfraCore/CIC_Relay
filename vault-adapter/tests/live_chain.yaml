crate: vault_adapter
module: crate
description: 'Opt-in **live-Vault** end-to-end test of the full feature-008 trust-flow
  chain against a real (throwaway) OpenBao/Vault dev server. It is a no-op unless
  `VAULT_LIVE_ADDR` is set, so it never runs in the default unit/coverage/mutation
  builds. Run it via `make test-vault-live`, which spins a throwaway `-dev-tls` server,
  provisions the PKI / cert-auth / KV mounts, and points the `VAULT_LIVE_*` env vars
  at it. Chain exercised against the live server: ```text module CSR ──PKI sign-verbatim──►
  countersigned cert (Relay''s key stays in Vault) ──mTLS cert-auth login──► scoped
  token ──read_sealed (KV)──► open inside the module ──► plaintext ``` The KV secret
  is pre-sealed to the module''s own key here (the request-time A-version Vault-side
  wrapping is a deferred edge — see feature-008/spec.md).'
