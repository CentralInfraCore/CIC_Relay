  description: 'An actuation failure. Carries no secret material, so it is always
    safe to log. A *reached* endpoint is **not** a failure — it is an [`ExecOutcome`]
    with a status. These variants cover only the ways an actuation never produces
    a (complete) outcome: malformed, denied, over a limit, or never completed.'
  derives:
