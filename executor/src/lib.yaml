---
crate: executor
module: crate
description: 'The **executor** — the actuating ("intervening") half of a `module/host`
  pair in feature-008''s secret flow. The pair owns two objects: a Vault object (holds
  pubkey-sealed secrets) and this executor object (performs the real intervention;
  first round: HTTP). The executor sits at the **tail of the secret-flow pipeline**:
  the WASM module opens a `SealedSecret` (from `connections`) into plaintext, and
  that plaintext — carried as a [`secrecy::SecretString`], the same type `module::open`
  yields — is applied here as the actuation credential, right before the outbound
  call. This crate owns *meaning* only: the [`ExecRequest`]/[`ExecOutcome`] shapes
  and the [`Executor`] port, plus an in-memory [`MockExecutor`] and its contract tests.
  It performs **no network I/O** — a real HTTP transport is a separate adapter crate
  (`http-executor`), mirroring how `vault-adapter` sits behind `connections`. Contract
  note: a **reached** endpoint always yields `Ok(`[`ExecOutcome`]`)`, whatever its
  status — interpreting a `401`/`500` is the caller''s job, not the transport''s.
  An [`ExecuteError`] means only that the call was *malformed*, *denied by policy*,
  or *never completed*.'
