- name: MockExecutor
  kind: struct
  visibility: pub
  description: 'An in-memory [`Executor`] that models an endpoint guarding a credential:
    it **echoes** the request back (status 200, same headers and body) when the supplied
    secret matches the one it accepts, and returns a `401` outcome otherwise. This
    is the executor-side analogue of `connections`'' `InMemoryTokenProvider` (trust-by-value):
    it proves the opened secret flows all the way through to the actuation and is
    checked there, while never placing the secret in its output. Note that a credential
    mismatch is a `401` **outcome**, not an error — exactly how a live HTTP endpoint
    would answer.'
  derives: []
  implements:
  - Executor
  - std::fmt::Debug
  references:
  - secrecy::SecretString
- name: Executor
  kind: trait
  visibility: pub
  description: 'The executor port: perform an [`ExecRequest`], applying a secret credential.
    Contract: the `secret` (the plaintext a module opened from a `SealedSecret`) is
    applied as the actuation credential and **must never appear** in the returned
    [`ExecOutcome`] nor in an [`ExecuteError`]. A reached endpoint yields `Ok(ExecOutcome)`
    for any status. A real implementation is a network transport (`http-executor`);
    the in-memory [`MockExecutor`] models one without I/O.'
  methods:
  - execute
