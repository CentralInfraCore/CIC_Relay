- name: generate
  kind: method
  receiver: ModuleIdentity
  visibility: pub
  description: 'Mints a fresh **per-request** identity and the [`CertRequest`] to
    countersign for `subject`/`scope`: a new P-256 keypair plus a CSR whose subject
    CN is `subject` and whose DNS SANs carry the `scope` CNs (the task encoding).
    Call this once per request — see the type-level lifecycle contract. # Errors [`ModuleError`]
    if the subject/CNs cannot be encoded or the CSR cannot be built and signed.'
  references:
  - connections::vault::Cn
  - connections::vault::AuthScope
  - connections::vault::port::CertRequest
  - p256::ecdsa::SigningKey::random
  - rand_core::OsRng
  - connections::vault::port::CertRequest::new
  calls:
  - build_csr
  - connections::vault::port::CertRequest::new
  - p256::ecdsa::SigningKey::random
- name: from_pkcs8_pem
  kind: method
  receiver: ModuleIdentity
  visibility: pub
  description: 'Reconstructs an identity from an existing PKCS#8 PEM private key —
    for a caller that *already* holds the module key (e.g. the module performing its
    own Vault mTLS cert-auth login, where the same key is the TLS client identity).
    The key still never leaves this type once constructed. # Errors [`ModuleError`]
    if `pem` is not a valid PKCS#8 P-256 private key.'
  references:
  - p256::ecdsa::SigningKey::from_pkcs8_pem
  calls:
  - ModuleError::new
  - p256::ecdsa::SigningKey::from_pkcs8_pem
- name: certificate_request
  kind: method
  receiver: ModuleIdentity
  visibility: pub
  description: 'Builds a [`CertRequest`] (CSR) for `subject`/`scope` from this identity''s
    key — the public counterpart of [`generate`](Self::generate) for an already-constructed
    identity. Emits public material only. # Errors [`ModuleError`] if the subject/CNs
    cannot be encoded or the CSR cannot be built and signed.'
  references:
  - connections::vault::Cn
  - connections::vault::AuthScope
  - connections::vault::port::CertRequest
  - connections::vault::port::CertRequest::new
  calls:
  - build_csr
  - connections::vault::port::CertRequest::new
- name: public_key_der
  kind: method
  receiver: ModuleIdentity
  visibility: pub
  description: 'The module''s public key as SPKI DER — safe to share; the private
    half never leaves. This is the key a returned secret is sealed to (see [`seal`]).
    # Errors [`ModuleError`] if the public key cannot be encoded.'
  references: []
  calls:
  - ModuleError::new
- name: open
  kind: method
  receiver: ModuleIdentity
  visibility: pub
  description: 'Opens a [`SealedSecret`] that was sealed to this module''s public
    key, recovering the plaintext as a redacting [`SecretString`]. This is the module
    acting as the execution endpoint — the secret is decrypted *inside* the module,
    never handed out in the open. **Consumes the identity** (`self` by value): the
    per-request keypair is single-use, so opening ends its life and zeroizes the key
    on drop. Mint a new [`ModuleIdentity`] for the next request. # Errors [`ModuleError`]
    if the blob is malformed, was sealed to a different key, or was tampered with.'
  references:
  - connections::vault::SealedSecret
  - secrecy::SecretString
  - crate::sealing::open
  calls:
  - connections::vault::SealedSecret::ciphertext
  - crate::sealing::open
