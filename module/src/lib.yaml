---
crate: module
module: crate
description: Module-side identity for the CIC secret flow (feature-008), trust-flow
  step 2. A workload (the "module") generates its own keypair and a PKCS#10 CSR whose
  subject/SANs encode the task's CNs, and hands the resulting [`CertRequest`] to the
  Relay for countersignature. **The private key never leaves this boundary** — [`ModuleIdentity`]
  holds it (zeroizing) and only ever emits public material (the CSR now; the public
  key for pubkey-sealing later). Pure-Rust crypto (`p256` + `x509-cert`), so the module
  side carries no C dependency and stays within the workspace's permissive-only supply
  chain. The key is ECDSA P-256; the intermediate CA that countersigns it is independent.
