- name: ModuleIdentity
  kind: struct
  visibility: pub
  description: 'A module''s **per-request, single-use** cryptographic identity: a
    fresh P-256 keypair minted for one trust-flow request. Its public key is a *capability*
    — it both carries the authorization metadata (the CNs encoded in the CSR) **and**
    is the recipient a returned secret is sealed to. This is the OIS-lib model: *"the
    response key is always a single-use, session-level ephemeral key"*, so one keypair
    deliberately serves both the signing identity and the ECDH sealing role. The **private
    half never leaves this type** and zeroizes on drop. **Lifecycle contract — this
    is not a persistent identity.** Mint one per request with [`ModuleIdentity::generate`],
    use it for that request only, and do **not** persist or reuse it across requests:
    reuse would turn the ephemeral key long-lived and reintroduce cross-algorithm-key-reuse
    and forward-secrecy concerns that the single-use property is what keeps benign.
    [`open`](Self::open) **consumes** the identity, so the single-use property is
    enforced by the type system, not left to convention.'
  derives: []
  implements:
  - std::fmt::Debug
  references:
  - p256::ecdsa::SigningKey
