---
crate: module
module: crate::sealing
description: 'Pubkey-sealing (feature-008 trust-flow step 7): ECIES over P-256. A
  returned secret is **encrypted to the module''s public key** so that whatever caches
  or routes it holds only ciphertext it cannot open — only the module holding the
  matching private key can. This is public-key encryption to the module''s own key
  (ECIES: ephemeral ECDH → HKDF → AEAD), **not** Vault Transit (which encrypts with
  its own managed keys, not to an external module key). Blob layout: `ephemeral_public(SEC1
  uncompressed, 65B) || nonce(12B) || AES-256-GCM ciphertext`.'
