[package]
name = "module"
description = "Module-side identity: keypair + CSR generation for the CIC secret flow (feature-008). The private key never leaves this boundary."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
connections = { path = "../connections" }
p256 = { version = "0.14", features = ["ecdsa", "ecdh", "pem", "std", "getrandom"] }
x509-cert = { version = "0.3", features = ["builder"] }
# Only for the AES-GCM nonce: aes-gcm 0.10 (aead 0.5) takes a rand_core 0.6 RNG. The p256 / ecdsa keys
# are generated through the `Generate` trait (p256 feature `getrandom`).
rand_core = { version = "0.6", features = ["getrandom"] }
# Enables `Sha256: AssociatedOid`, required for the ECDSA-with-SHA256 signature
# algorithm identifier that x509-cert's RequestBuilder needs from the p256 signer.
sha2 = { version = "0.11", features = ["oid"] }
# ECIES pubkey-sealing: P-256 ECDH (above) + HKDF-SHA256 + AES-256-GCM.
hkdf = "0.13"
aes-gcm = "0.10"
secrecy = "0.10"
