module: test_tools.cidag_make_vectors
description: 'Writes pkg/cidag/testdata/vectors.json: the vectors both implementations
  of the CI Merkle DAG contract read.


  The expected values come from the independent Python implementation (cidag_independent.py),
  the ORACLE, not

  from the Go package: the Go package is measured against these vectors, never the
  other way round. One case is

  also fixed by hand (docs/hu/CI-MERKLE-DAG-CONTRACT.md, worked example) so that the
  oracle itself is checked

  with `printf | sha256sum`.


  Run:  python3 tests/test_tools/cidag_make_vectors.py [OUTPUT]'
