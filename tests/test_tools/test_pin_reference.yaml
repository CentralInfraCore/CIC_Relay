module: test_tools.test_pin_reference
description: 'The reference of the measuring-tool check is not the pull request''s
  own (CIC_Relay #195). Every case runs real git against a bare "origin" and a clone:
  the base branch tip is the reference, a forged SHA is refused because it is not
  a commit of the base branch, a changed pin file needs an approval bound to the exact
  head and the exact digest and written by an approver of the BASE pin file. Each
  denial has a positive control next to it.'
