module: test_tools.test_cidag_independent
description: 'Tests of the independent implementation of the CI Merkle DAG contract,
  on the vectors shared with pkg/cidag.


  The vectors are the point of agreement between the two implementations: this file
  proves the Python side meets

  them, and proves that the vector set CAN FAIL: each planted defect in the independent
  implementation must be

  caught by at least one vector (the seeded pattern of cic-primitive-forms tools/test-evidence/seeded.py).'
