---
module: test_tools.test_mutation_workflow_enumeration
description: 'The Rust mutant enumeration of the mutation workflows fails closed (PR-02).
  The workflow step that counts the mutants and picks the shard count is run for real:
  the `run:` text is taken from the workflow file and executed under `bash -e` (the
  default shell of a GitHub Actions step: no pipefail) with a fake `cargo` that behaves
  like the three cases measured in PR-01: A  valid, empty listing          exit 0,
  no output   -> step succeeds, shards=0 B  unreadable --in-diff file     exit 6,
  no output   -> step MUST fail C  broken .cargo/mutants.toml    exit 1, no output   ->
  step MUST fail Counter-test: the old step text (`| grep -c . || true`) is run through
  the same harness and shown to return success with shards=0 for B and C, i.e. the
  harness does see the defect.'
