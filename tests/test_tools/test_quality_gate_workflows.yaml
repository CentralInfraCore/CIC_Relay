---
module: test_tools.test_quality_gate_workflows
description: 'The completeness check is wired into the mutation workflows and cannot
  be bypassed (PR-03). The steps are run for real: the `run:` text is taken from the
  workflow YAML and executed under `bash -e` (the default shell of an Actions step)
  with a fake `cargo` / a stub report script. The counter-test of the old defect is
  `test_gate_is_red_when_the_completeness_check_is_not_` `successful`: before this
  change the `gate` job looked at the result of each job only, so a run in which every
  job was `success` was green even if the planned and the measured mutants differed.
  On the previous workflow that test fails with `assert 0 != 0` (the gate step exits
  0).'
