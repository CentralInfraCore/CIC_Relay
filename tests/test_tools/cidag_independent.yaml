---
module: test_tools.cidag_independent
description: 'Independent recomputation of the CIC CI Merkle DAG (contracts cic-ci-step/1,
  cic-ci-root/1).


  This module shares NO code with pkg/cidag (Go): it is a second implementation of
  the same contract,

  written from docs/hu/CI-MERKLE-DAG-CONTRACT.md, standard library only. Both implementations
  read the

  same vectors (pkg/cidag/testdata/vectors.json) and must agree on every canonical
  byte, every root and

  every refusal class.


  The canonical form is the PROFILE of the CIC Canonical Object Encoding used for
  CI step objects: only

  strings that never need an escape (so Go''s json.Marshal escaping, which the encoding
  inherits, never

  applies), integers, booleans and null; object keys sorted by their UTF-8 bytes;
  no white space. For that

  profile the bytes are identical to Go pkg/canonicaljson.ToJSON, to Python json.dumps(sort_keys=True,

  separators=(",", ":")) and to RFC 8785.'
