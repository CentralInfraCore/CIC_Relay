---
package: strictjson
description: 'Package strictjson reads JSON that a producer and a consumer must read
  identically (O-1 INT-02). encoding/json alone accepts duplicate object keys (the
  last one wins), matches field names case-insensitively and, without DisallowUnknownFields,
  ignores unknown keys. For a signed or digest-bound wire object that is a hole: the
  same bytes can mean two things. Scan walks the raw JSON once, before any struct
  decoding, against an exact Shape, and refuses: unknown or differently spelled keys,
  duplicate keys (also inside objects whose key names are data), missing required
  keys, an object or array where the shape wants the other, and anything after the
  first value. It replaces the two byte-identical-in-behaviour copies that the #233
  (the module-release envelope and the module-sign authority bindings) and #234 (the
  ABI-profile artifact) changes carried separately.'
