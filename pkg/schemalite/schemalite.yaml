---
package: schemalite
description: 'Package schemalite validates JSON payloads against a small, closed subset
  of JSON Schema (O-1 INT-07). The subset is deliberately closed and fails closed:
  a schema that uses any keyword outside it is REFUSED AT COMPILE TIME, never silently
  ignored, because an ignored keyword is a constraint the operator believes is enforced
  and is not. Supported: type (object, array, string, integer, number, boolean, null),
  properties, required, additionalProperties (boolean), items (one schema), enum,
  const, minLength, maxLength, minimum, maximum, minItems, maxItems, pattern (RE2);
  $schema, $id, title and description are annotations and have no effect. Everything
  else (for example $ref, oneOf, allOf, format, patternProperties) is unsupported
  and rejected. A payload is exactly one JSON value; trailing data is refused. Numbers
  are read as json.Number, so an integer is recognised exactly and no precision is
  lost on the way in.'
