---
package: trustbundle
description: 'Package trustbundle admits the operator''s trust bundle (O-1 INT-12;
  contract: release-admission-contract-draft 9.2). The bundle carries what the relay
  must take from the operator''s trust domain: which signer keys hold module:sign
  (authority bindings) and which ABI profiles are accepted (id, digest). It does NOT
  authenticate itself: whatever it contains, it is only as good as the operator''s
  pin. Admission is therefore four independent checks, in this order, each with its
  own result code: BUNDLE_NOT_PINNED the presented bytes are not the bundle whose
  sha256 the operator pinned (checked first and on the raw bytes: nothing of an unpinned
  bundle is trusted, not even its version or its age) BUNDLE_INVALID the pinned bytes
  do not have the exact wire shape (strict JSON, closed vocabulary, no duplicates)
  BUNDLE_STALE bundle_version is below the operator''s minimum_bundle_version BUNDLE_ROLLBACK
  bundle_version is below the highest version this relay has already admitted (anti-rollback)
  BUNDLE_EXPIRED the bundle is older than the operator''s max age, or is issued in
  the future The first two codes and the minimum version are the draft''s; the anti-rollback
  high-water mark and the age check are the owner''s INT-12 list (digest pin, minimum
  version, freshness, anti-rollback) given a code each. The high-water mark is advanced
  by the caller only through Commit, after every check passed, and is persisted atomically.'
