  calls: []
- name: parse
  kind: func
  description: parse decodes and structurally validates the request (schema step);
    the forbidden-header check is separate so that it can be recorded as a denial.
  references: []
  calls:
  - Decode
  - DecodeString
  - DisallowUnknownFields
  - MatchString
  - More
- name: Handle
  kind: method
  receiver: Engine
  description: 'Handle runs one sign+send call in the enforced order and returns the
    JSON the guest receives: schema → forbidden headers → body size → profile → key_ref
    → target policy (SS-03) → egress → profile canonicalisation → signature → controlled
    HTTP → interaction record → response Nothing is signed or sent before the policy
    steps have passed. Every well-formed request, refused or not, gets exactly one
    interaction record.'
  references: []
  calls:
  - Authorize
  - Close
