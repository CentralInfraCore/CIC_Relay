- name: Limits
  kind: struct
  description: Limits are the timeout and size caps of one call. The operator policy
    gives the upper bound; a profile can only narrow it; a guest request carries no
    limit at all (SS-05).
  implements: []
  references: []
- name: OperationPolicy
  kind: struct
  description: OperationPolicy is what the operator allows for one intent operation.
  implements: []
  references: []
- name: Policy
  kind: struct
  description: Policy is the operator-owned deployment policy the host validates every
    request against. It is NOT guest-supplied and not part of the module artifact.
  implements: []
  references: []
- name: TargetIntent
  kind: struct
  description: TargetIntent is the intent part of a request as the target validation
    sees it.
  implements: []
  references: []
- name: effectiveLimits
  kind: func
  description: effectiveLimits is min(operator, profile) per field; a zero profile
    field does not narrow. It fails if the profile limit is wider than the operator
    cap.
  references: []
  calls: []
- name: Validate
  kind: method
