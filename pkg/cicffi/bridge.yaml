---
package: cicffi
description: Package cicffi is the Go side of the Rust↔Go FFI bridge. It links the
  cic-ffi staticlib (the unsafe airlock) and exposes safe Go wrappers over the C-ABI
  exports. See features/feature-008/ffi-boundary.md. This file is compiled only under
  the `ffi_cgo` build tag with CGO_ENABLED=1; the default build uses the stub in bridge_stub.go,
  so the rest of the tree builds without the Rust staticlib.
tags: []
category: []
used_in: []
entrypoint: false
related_nodes: []
objects:
- name: ABIVersion
  kind: func
  description: ABIVersion returns the C-ABI version of the linked cic-ffi staticlib.
  references:
  - C.cic_ffi_abi_version
  calls: []
- name: CheckABI
  kind: func
  description: CheckABI reports an error if the linked staticlib's ABI version differs
    from ExpectedABIVersion. Call it once at startup before using the bridge.
  references: []
  calls:
  - ABIVersion
- name: invoke
  kind: func
  description: 'invoke runs one airlock call: it hands `in` to a C export `fn`, copies
    the Rust-owned result into Go memory, and frees the Rust buffer. It returns nil
    when the export returned null/empty (its rejection or empty signal), so no Rust
    memory is retained by the caller.'
  references:
  - C.uchar
  - C.size_t
  - C.cic_ffi_free
  - C.GoBytes
  - C.int
  calls:
  - C.GoBytes
- name: Ping
  kind: func
  description: Ping sends bytes across the FFI boundary into the Rust airlock and
    returns the echoed bytes (the linkability smoke test). Empty input yields nil.
  references:
  - C.uchar
  - C.size_t
  - C.cic_ffi_ping
  calls: []
- name: ConnectionRequest
  kind: func
  description: 'ConnectionRequest builds a canonical Vault Connection request from
    a JSON {"subject": ..., "scope": [...]} document via the Rust core, returning
    the canonical JSON (deduplicated, sorted scope). It returns an error when the
    Rust core rejected the input (malformed JSON or an empty subject).'
  references:
  - C.uchar
  - C.size_t
  - C.cic_ffi_connection_request
  calls: []
- name: RunFlow
  kind: func
  description: RunFlow runs the end-to-end trust-flow PoC entirely inside Rust and
    returns its JSON result. The Go side hands in a request document — subject, scope,
    secret, target, allow_hosts (and optional method/headers/body_base64/insecure)
    — and Rust mints a module identity, mock-countersigns it, seals the secret to
    the module key, opens it internally, and actuates over HTTP with the opened credential.
    Only the outcome crosses back; the secret never leaves Rust. The result JSON is
    {"ok":true,"status":..,"body_base64":..,"scope":[..]} for a completed actuation,
    or {"ok":false,"error":".."} if the flow ran but failed (policy/HTTP). It returns
    an error only when the Rust core rejected the input (malformed JSON or a missing/empty
    required field).
  references:
  - C.uchar
  - C.size_t
  - C.cic_ffi_run_flow
  calls: []
- name: ExpectedABIVersion
  kind: const
  description: ExpectedABIVersion is the C-ABI version this Go package is written
    against. It must match the linked staticlib's cic_ffi_abi_version(); a mismatch
    means a stale or wrong libcic_ffi.a was linked. Kept in sync with CIC_FFI_ABI_VERSION
    in ffi/src/lib.rs.
  references: []
