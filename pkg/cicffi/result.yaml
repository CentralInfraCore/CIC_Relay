- name: ActuationAudit
  kind: struct
  description: 'ActuationAudit is the non-secret audit record the Rust run_flow emits
    for an actuation (feature-009). It never carries the credential, the Authorization
    header, a Vault token, or any body contents — only digests and facts, so it is
    safe to log or fold into a ProofTrace. It mirrors http-executor''s ChainedEntry(AuditRecord):
    RecordHash is the tamper-evident SHA-256 that binds this record to its position
    in the audit chain.'
