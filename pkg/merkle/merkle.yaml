---
package: merkle
description: 'Package merkle implements a deterministic binary Merkle tree used for
  computing the final verification hash of a CIC build provenance manifest. Domain
  separation: Leaf node:  SHA256(0x00 || name || 0x1f || value) Inner node: SHA256(0x01
  || left || right) Odd-count levels duplicate the last element before pairing. Empty
  tree returns SHA256("empty").'
