- name: GoRuntimeDigest
  kind: func
  description: 'GoRuntimeDigest returns a "sha256:<hex>" digest of the Go toolchain
    identity. Included fields (separated by \x00): - runtime.Version()  — e.g. "go1.22.2"
    - runtime.GOOS       — e.g. "linux" - runtime.GOARCH     — e.g. "amd64" - CGO_ENABLED        —
    "0" or "1" (from debug.ReadBuildInfo settings) - -tags              — build tags
    at compile time, if any - GOEXPERIMENT       — active Go experiments, if any Using
    only runtime.Version() would miss CGO mode and build-tag variation that can materially
    change binary behavior while keeping the same version string.'
