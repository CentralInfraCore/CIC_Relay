  - binary.EncodeModule
  calls:
  - binary.DecodeModule
  - binary.EncodeModule
- name: Digest
  kind: func
  description: Digest is the sha256:<lowercase hex> form every digest of the O-1 wire
    contracts uses.
  references: []
  calls: []
- name: ExecutedDigest
  kind: func
  description: 'ExecutedDigest is Digest(Canonicalize(raw)): the executed_wasm_sha256
    of a release envelope.'
  references: []
  calls:
  - Canonicalize
  - Digest
- name: TransformID
  kind: const
  description: TransformID names the transformation in releases, envelopes and evidence.
  references: []
