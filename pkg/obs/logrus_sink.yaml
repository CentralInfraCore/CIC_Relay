- name: LogrusSink
  kind: struct
  description: 'LogrusSink bridges the obs layer into an existing logrus.Logger. It
    satisfies TraceSink, LogSink, and MetricSink. Every obs emission becomes a structured
    logrus entry so that the relay''s JSON log stream carries full observability data
    without any additional infrastructure. Log levels: - TraceFrame  → Info  (warn
    if Status is "error" or "timeout") - LogRecord   → mapped from LogRecord.Level
    (info/warn/error; unknown → info) - CounterPoint / GaugePoint / HistogramPoint
    → Debug ("relay.metric" event)'
  implements: []
  references:
  - logrus.Logger
  position:
