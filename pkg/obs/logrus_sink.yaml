  calls:
  - Debug
  - WithFields
- name: RecordHistogram
  kind: method
  receiver: LogrusSink
  description: RecordHistogram emits a logrus Debug entry for a HistogramPoint.
  references:
  - logrus.Fields
  calls:
  - Debug
  - WithFields
