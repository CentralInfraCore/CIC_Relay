- name: PrometheusSink
  kind: struct
  description: PrometheusSink aggregates obs metric points in-process and renders
    them in the Prometheus text exposition format (https://prometheus.io/docs/instrumenting/exposition_formats/).
    It satisfies MetricSink. Counters sum monotonically per (name, labels) series;
    gauges keep the latest value; histograms track only count+sum, exposed as a single
    "+Inf" bucket — no call site today supplies distribution buckets, so percentile
    buckets are not fabricated.
