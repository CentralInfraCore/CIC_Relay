---
package: cidag
description: 'Package cidag builds the deterministic Merkle DAG of a CI process: one
  canonical object per CI step (its definition, inputs, dependency roots and result)
  and one CI root over all of them. The contract is docs/hu/CI-MERKLE-DAG-CONTRACT.md.
  It is additive: it changes no existing hash, root or canonical form. The canonical
  bytes come from pkg/canonicaljson (the CIC Canonical Object Encoding); this package
  only restricts what may be written to a profile on which that encoding can never
  apply an escape (so the escaping rules it inherits from encoding/json never matter),
  hashes with versioned domain prefixes in the style of core/cabinet.ComputeChainHashV1,
  and wires the dependency structure. It deliberately does not reuse pkg/merkle.MerkleRoot:
  that tree duplicates the last element of an odd level, so root([a,b,c]) == root([a,b,c,c]),
  which is harmless for its fixed field set and wrong for a variable-length list of
  steps. The independent implementation is tests/test_tools/cidag_independent.py;
  both read testdata/vectors.json.'
