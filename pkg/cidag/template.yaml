- name: TemplateFromWorkflow
  kind: func
  description: 'TemplateFromWorkflow derives the template of a GitHub Actions workflow
    file: one step per job, the edges from `needs`. It reads nothing else of the YAML
    (no `if`, no matrix, no reusable workflows): a job that may not run is a step
    whose result can be `skipped`. The definition digest of every job is the SHA-256
    of the raw bytes of the workflow file, which is coarse (a change anywhere in the
    file changes every digest) and safe: no YAML semantics decide what a definition
    is. The result is in the generic form Build and Verify take.'
  references:
  - yaml.Unmarshal
  calls:
  - yaml.Unmarshal
