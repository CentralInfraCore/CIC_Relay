- name: Build
  kind: func
  description: Build derives the step objects, their roots and the CI root from a
    template and the execution evidence. Both arguments are in the generic JSON model
    (see ParseStrict). The result does not depend on the order of the template's steps,
    of its needs, or of any map.
  references: []
  calls: []
- name: jsonEqual
  kind: func
  description: jsonEqual compares two values of the generic JSON model structurally
    (an int and an int64 of the same value are equal; a bool never equals a number).
  references: []
  calls: []
- name: Verify
  kind: func
  description: 'Verify recomputes everything from a published bundle {"template","objects","step_roots","ci_root"}.
    A published object is never trusted: only its inputs and result are read (they
    are the evidence); its contract, step and dependencies, every step root, the template
    digest and the CI root are recomputed and compared. A change to a step is therefore
    caught at that step''s own root if it is the last, and one hop downstream otherwise,
    in the dependencies of the step that depends on it.'
  references: []
  calls:
  - Build
