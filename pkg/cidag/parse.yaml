- name: ParseStrict
  kind: func
  description: 'ParseStrict reads one JSON document into the generic model the package
    works on (nil, bool, int64, string, []any, map[string]any) and refuses what two
    correct readers could read differently: a duplicate member name, any number that
    is not an integer within int64, a constant (NaN, Infinity), trailing data and
    nesting deeper than MaxDepth. Every refusal is of class PARSE.'
