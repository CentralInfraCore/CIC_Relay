objects:
- name: ComputeTreeHash
  kind: func
  description: ComputeTreeHash returns a deterministic SHA-256 digest of all regular
    files under rootPath. Top-level directories whose name matches an entry in excludes
    (or DefaultExcludes if nil) are skipped entirely.
  references: []
  calls:
  - IsRegular
  - Sum
- name: fileContentHash
  kind: func
  description: fileContentHash returns the hex-encoded SHA-256 of the file at path.
  references: []
  calls:
  - Close
  - Sum
- name: DefaultExcludes
  kind: var
  description: DefaultExcludes is the set of top-level directory names skipped by
    default during tree traversal. These are build artefact or cache directories whose
    contents are not part of the source inputs.
  references: []
