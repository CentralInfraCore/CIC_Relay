---
package: sourcedigest
description: 'Package sourcedigest provides a deterministic source tree hash suitable
  for embedding into binaries as a ProofTrace build-input anchor. Algorithm: 1. WalkDir
  the root path, collecting (relPath, SHA-256(content)) pairs. 2. Sort entries by
  relPath (lexicographic, forward-slash normalised). 3. Aggregate: SHA-256 over "relPath\x00hexContent\n"
  lines in sorted order. The result is a stable, 64-char lowercase hex string that
  is sensitive to any change in file content, path, or set of tracked files. It is
  NOT sensitive to file mode or mtime — only to content and relative paths.'
