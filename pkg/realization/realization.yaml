---
package: realization
description: 'Package realization is the realization context of an observation (O-1
  G-3): an authenticated, content-addressed object that says in which concrete infrastructure
  environment an abstract object is realised or observed: which provider, region,
  host, API base path and scope. It is NOT part of the module manifest, NOT a modification
  of the intent and NOT a property of the ABI profile: it is an external input the
  operator pins. Authentication is the operator''s pin of the content digest (the
  object does not vouch for itself), exactly as for the trust bundle. The authorization
  decision and the execution context record carry its digest, so a verifier can tell
  which environment a decision was about. This is the MINIMAL context the observation
  PoC needs. It is the only realization model: there is no second one, and it carries
  nothing about changing infrastructure.'
