---
package: o1verify
description: 'Package o1verify is an independent verifier of ProofTrace V2 artifacts
  (O-1 WP-05, AC-V2-08/10/12/13/15). Independence is structural, not a claim: this
  package imports nothing from core/cabinet (the producer), reads the artifact as
  generic JSON, and derives the CICCHAINv2 hash input and the CICHOSTINTv1 list digest
  from its own code. Its agreement with the producer is therefore evidence of two
  implementations reading the same contract, checked against the shared vectors, not
  of shared code. It makes two separate assertions (V2-02): EvidenceVerdict (the evidence
  is authentic and a complete representation of what happened, whatever happened)
  and Acceptance (the operation met the mandatory policy and evidence conditions).
  The Relay cannot make either about its own artifact. What a schema cannot prove
  is proved here: the chain hash is recomputed, the host-interaction list is recomputed
  from the records and compared, and a persistence claim counts only if its attestation
  is verified by a verifier the caller supplies (the trust input), against this very
  artifact''s chain hash. The verifier''s own identity (VerifierInfo.ImplementationDigest)
  is a DECLARATION; that the declared implementation is the one that ran is not proved
  by this package and must be established separately (AC-V2-13).'
