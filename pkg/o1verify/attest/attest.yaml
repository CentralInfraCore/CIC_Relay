---
package: attest
description: 'Package attest gives the independent verifier (pkg/o1verify) two identities
  it can check instead of take on trust (O-1 INT-10, AC-V2-13): - the recorder''s
  persistence attestation (kind recorder-signature): a signature over the artifact''s
  chain hash by a key that holds recorder:attest in the operator''s pinned trust bundle;
  - the verifier''s own result: a signature over the VerificationResult by a key that
  holds verifier:attest. In both, the public key travels with the signature and is
  checked against the key_id (sha256 of its DER SPKI), and the AUTHORITY comes from
  the bundle''s role map, never from the presented key: a key in a file is not an
  authority. What this does and does not prove. A signed result is ATTRIBUTABLE: an
  authorised verifier key stands behind exactly this result. It does not prove that
  the declared implementation_digest is the code that ran; that holds only when the
  operator also pins the implementation digests of the released verifier (Pinned),
  which is what the release pipeline (INT-13) supplies. With no pin the outcome says
  so (ImplementationPinned false) instead of implying it. Like the rest of pkg/o1verify
  this package imports nothing from the producer.'
