---
# Companion YAML schema for Rust source files (<file>.rs -> <file>.yaml).
# Generated by tools/rs.meta.gen.py (front end: tools/rsastdump, syn); the Rust
# counterpart of go.meta.schema.yaml. Paths use Rust syntax (a::b::C).
type: object
required:
  - crate
  - module
  - description
  - tags
  - category
  - used_in
  - entrypoint
  - related_nodes
  - objects
properties:
  crate:
    type: string
    description: Crate name from the owning Cargo.toml ('-' replaced by '_').

  module:
    type: string
    description: >
      Module path of the file inside its crate target, e.g. "crate::vault::port".
      Target roots (src/lib.rs, src/main.rs, src/bin/*, tests/*, build.rs) are "crate".

  description:
    type: string
    description: The file's inner doc (//!), or a human-written summary.

  tags:
    type: array
    description: "Thematic tags for AI context integration (same vocabulary as go.meta.schema.yaml):"
    items:
      type: string
      enum:
        - relay
        - compliance
        - workflow
        - cictor
        - schema
        - parser
        - guard
        - core
        - doc
        - interface
        - gateway
        - builder
        - test
        - meta
        - orchestrator
        - decision
        - reflector
        - context
        - validator
        - executor
        - hook
        - template
        - fallback
        - session
        - metrics
        - storage
        - loader
        - renderer
        - legal
        - license
        - platform-engineering
        - ci-cd
        - ecosystem

  category:
    type: array
    description: "Functional role(s) of the file. Allowed values:"
    items:
      type: string
      enum:
        - modul
        - decision
        - morális
        - belépési
        - meta
        - elemző
        - concept
        - architecture
        - ci-cd

  used_in:
    type: array
    description: "Workflows or processes where this file is used. Allowed values:"
    items:
      type: string
      enum:
        - decision_flow
        - validation
        - generation
        - onboarding
        - fallback_process
        - distribution
        - publishing
        - development-process
        - architecture-review

  entrypoint:
    type: boolean
    description: True for a binary root with fn main (src/main.rs, src/bin/*) and build.rs.

  related_nodes:
    type: array
    items:
      type: string
    description: Related concepts, modules, or files (relative paths or concept names).

  objects:
    type: array
    description: >
      All items of the file, nested inline modules included. Matched on merge by
      (kind, receiver, name).
    items:
      type: object
      required:
        - name
        - kind
        - description
      properties:
        name:
          type: string
          description: >
            Identifier; inside an inline module qualified by it ("tests::works").
            For an impl block "Trait for Type" or "Type".

        kind:
          type: string
          enum:
            - mod       # mod x; / mod x { .. }
            - const
            - static
            - type      # type alias
            - struct
            - enum
            - union
            - trait
            - impl      # impl Type / impl Trait for Type
            - method    # fn inside an impl block
            - fn        # free fn (also extern "C" declarations)
            - macro     # macro_rules!

        visibility:
          type: string
          description: >
            pub, pub(crate), pub(super), pub(in path) or private. Absent on trait
            impl methods (fixed by the trait) and impl blocks.

        description:
          type: string
          description: The item's outer doc (///), or a human-written summary.

        receiver:
          type: string
          description: method / impl only — the self type as written, without generics.

        trait:
          type: string
          description: method / impl only — the implemented trait, expanded through use.

        derives:
          type: array
          items:
            type: string
          description: struct / enum / union — #[derive(..)] paths.

        implements:
          type: array
          items:
            type: string
          description: >
            struct / enum / union — traits from `impl Trait for Type` blocks across
            the crate's companions (matched by type name). Auto field: recomputed
            on every generator run.

        variants:
          type: array
          items:
            type: string
          description: enum only — variant names.

        methods:
          type: array
          items:
            type: string
          description: trait only — method names, sorted.

        supertraits:
          type: array
          items:
            type: string
          description: trait only — supertrait paths.

        references:
          type: array
          items:
            type: string
          description: >
            Paths into dependency crates (e.g. "serde_json::Value") and into other
            modules of the same crate ("crate::vault::port::CertRequest"). std,
            core, alloc and same-file paths are left out. Auto-generated.

        calls:
          type: array
          items:
            type: string
          description: >
            fn / method / trait — called functions and typed method calls, sorted.
            Same-file targets are file-relative ("Denied::new"); untyped method
            calls (x.foo() with x of unknown type) are not listed.

        test:
          type: boolean
          description: Present (true) under #[cfg(test)] or on a #[test]-style function.
