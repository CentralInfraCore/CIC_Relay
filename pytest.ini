[pytest]
# Explicit test root — the canonical suite (matches `PYTEST_ARGS += tests/` in
# the Makefile). Also keeps collection off the repo root, which contains a
# `source -> .` symlink that otherwise sends pytest into infinite recursion.
# (tools/test_*.py use cwd-relative bare imports and are not part of this suite.)
testpaths = tests
# Belt-and-suspenders: never descend into the venv cache, the self-referential
# `source` symlink, or generated/VCS dirs.
norecursedirs = p_venv source .git .mypy_cache .pytest_cache build dist output htmlcov
# cov-fail-under is a floor, not the target: the suite currently measures ~84%.
# Ratchet this up as coverage improves; never lower it. See .coveragerc for
# measurement scope.
addopts = --cov=tools --cov-report=term-missing --cov-fail-under=80 -v
